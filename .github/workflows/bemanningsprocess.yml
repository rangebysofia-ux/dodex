name: Bemanningsprocess och regelstöd – test
on:
  push:
    branches:
      - feature/bemanningsprocess-regelstod-v1
  pull_request:
    branches:
      - test
permissions:
  contents: read
jobs:
  regelstod:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Kontrollera syntax för process och data
        run: |
          node --check schemawebb/statisk/regelstod_data.js
          node --check schemawebb/statisk/process_regelstod.js
          node --check schemawebb/statisk/app.js
      - name: Kör enhetstester för Bemanningscontroller
        run: node --test tests/process_regelstod.test.cjs
