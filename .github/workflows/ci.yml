name: Tester – DODEX
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Installera projekt och testberoenden
        run: python -m pip install -e '.[dev]'
      - name: Kör alla Python-tester
        run: python -m pytest -q
