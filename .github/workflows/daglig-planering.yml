name: Dodex daglig bemanning – test

on:
  push:
    branches:
      - feature/daglig-bemanning-pilot-v1
  pull_request:
    branches:
      - feature/planering-datumgrund-v1

jobs:
  pilot-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Installera beroenden
        run: python -m pip install -e '.[dev]'
      - name: Syntetiska planeringstester
        run: python -m pytest -q tests/test_planering.py tests/test_daglig_planering.py
