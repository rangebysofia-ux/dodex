function vakansPass(res) {
  const tider = {};
  for (const rad of Object.values(res.schema)) for (const x of rad) if (x) { const k = x.start + "–" + x.slut; (tider[x.dygnsdel] = tider[x.dygnsdel] || {})[k] = (tider[x.dygnsdel][k] || 0) + 1; }
  const reserv = { morgon: "07:00–15:00", kvall: "14:00–22:00", natt: "21:45–06:45" };
  const perDag = Array.from({ length: res.veckor * 7 }, () => []);
  for (const v of res.vakanser) for (let i = 0; i < v.antal; i++) {
    const [start, slut] = (tider[v.dygnsdel] ? Object.entries(tider[v.dygnsdel]).sort((a, b) => b[1] - a[1])[0][0] : reserv[v.dygnsdel]).split("–");
    perDag[v.dag].push({ dygnsdel: v.dygnsdel, start, slut });
  }
  perDag.forEach(l => l.sort((a, b) => "mkn".indexOf(a.dygnsdel[0]) - "mkn".indexOf(b.dygnsdel[0])));
  return perDag;
}

function behovDag(indata) {
  const ut = Array.from({ length: 7 }, () => ({ morgon: 0, kvall: 0, natt: 0 }));
  for (const [k, v] of Object.entries(indata.behov || {})) {
    const idx = k === "vardag" ? [0, 1, 2, 3, 4] : k === "helg" ? [5, 6] : k === "alla" ? [0, 1, 2, 3, 4, 5, 6] : [DAGAR.indexOf(k)];
    idx.forEach(i => { if (i >= 0) ut[i] = { morgon: v.morgon || 0, kvall: v.kvall || 0, natt: v.natt || 0 }; });
  }
  return ut;
}

function vecka(res, v) { return dagTabell(res, Array.from({ length: 7 }, (_, i) => v * 7 + i), false); }

function dagTabell(res, dagar, period) {
  const ind = st.korning.indata || st.enhet.indata, pers = Object.keys(res.schema), vak = {}, vp = vakansPass(res), rs = GRAF.resurs(res, ind);
  const vvAlla = Object.fromEntries(pers.map(p => [p, GRAF.veckovilaDagar(res, ind, p)]));
  const kod = { morgon: "D", kvall: "K", natt: "N" };
  res.vakanser.forEach(x => (vak[x.dag] = (vak[x.dag] || 0) + x.antal));
  const kl = d => `class="${d % 7 > 4 ? "helg" : ""}${period && d % 7 === 0 ? " ny-vecka" : ""}"`;
  let h = `<div class="rull"><table class="schema${period ? " period" : ""}"${period ? ` style="min-width:${46 + dagar.length * 30}px"` : ""}><thead>`;
  if (period) h += `<tr><th></th>${Array.from({ length: dagar.length / 7 }, (_, w) => `<th colspan="7" class="ny-vecka" style="text-align:left">V${w + 1}</th>`).join("")}</tr>`;
  h += `<tr><th>${period ? "" : "V" + (Math.floor(dagar[0] / 7) + 1)}</th>${dagar.map(d => `<th ${kl(d)}>${period ? DAGAR[d % 7][0] : DAGAR[d % 7]}</th>`).join("")}</tr></thead><tbody>`;
  for (const p of pers) h += `<tr><td title="${esc(p)}">${st.red ? esc(p) : `<button class="lank" data-g="person" data-p="${esc(p)}" style="font-weight:700">${esc(p)}</button>`}</td>` + dagar.map(d => {
    const x = res.schema[p][d], n = p + "|" + d;
    if (st.red && !x) return `<td ${kl(d)}><button class="tomruta" data-g="red-cell" data-c="${esc(n)}" aria-label="Lägg till pass ${esc(p)} ${DAGAR[d % 7]}">+</button></td>`;
    const r = x && rs.has(p + ":" + d);
    const vv = !x && vvAlla[p].get(d);
    return `<td ${vv ? kl(d).replace('class="', 'class="vvdag ') : kl(d)}>${vv ? GRAF.vvMarke(vv, period) : ""}${x ? `<button class="pass ${x.dygnsdel}${r ? " resurs" : ""}${st.cell === n ? " vald" : ""}${x.manuell ? " manuell" : ""}" data-g="${st.red ? "red-cell" : "cell"}" data-c="${esc(n)}" aria-label="${esc(p)} ${DAGAR[d % 7]} ${x.start} till ${x.slut}${r ? ", resurspass" : ""}"><b>${kod[x.dygnsdel]}</b>${period ? "" : `<small>${x.start}–${x.slut}</small>`}${r && !period ? GRAF.resursMarke : ""}${period ? (x.aktiviteter ? `<i class="akt">★</i>` : "") : GRAF.aktMarke(x)}</button>` : ""}</td>`;
  }).join("") + `</tr>`;
  const rader = Math.max(0, ...dagar.map(d => vp[d].length));
  for (let r = 0; r < rader; r++) h += `<tr class="vakantrad"><td>Vakant</td>` + dagar.map(d => {
    const x = vp[d][r];
    return `<td ${kl(d)}>${x ? `<span class="pass vakant ${x.dygnsdel}" aria-label="Vakant ${DELAR[x.dygnsdel].toLowerCase()}pass ${x.start} till ${x.slut}"><b>${kod[x.dygnsdel]}</b>${period ? "" : `<small>${x.start}–${x.slut}</small>`}</span>` : ""}</td>`;
  }).join("") + `</tr>`;
  const bd = behovDag(st.korning.indata || st.enhet.indata);
  h += `<tr class="bem"><td>I tj.</td>` + dagar.map(d => {
    const c = { morgon: 0, kvall: 0, natt: 0 };
    pers.forEach(p => { const x = res.schema[p][d]; if (x) c[x.dygnsdel]++; });
    const over = ["morgon", "kvall", "natt"].reduce((s, k) => s + Math.max(0, c[k] - bd[d % 7][k]), 0);
    const marke = `${vak[d] ? `<span class="minus">−${vak[d]}</span>` : ""}${over ? `<span class="plus">+${over}</span>` : ""}`;
    return `<td ${kl(d).replace('class="', `class="${vak[d] ? "vakans " : over ? "over " : ""}`)}>${period ? (marke || "✓") : `D${c.morgon}<br>K${c.kvall}<br>N${c.natt}${marke ? "<br>" + marke : ""}`}</td>`;
  }).join("") + `</tr></tbody></table></div>`;
  return h;
}

function cellInfo() {
  if (!st.cell) return `<span class="dampad">Tryck på ett pass för tider och rast.</span>`;
  const [p, d] = st.cell.split("|"), x = st.korning.resultat.schema[p][+d];
  return `<b>${esc(p)}</b>, vecka ${Math.floor(d / 7) + 1} ${DAGAR[d % 7]}: ${DELAR[x.dygnsdel].toLowerCase()} <span class="mono">${x.start}–${x.slut}</span>, rast ${x.rast} min, arbetstid ${timmar(x.netto)}.${(x.aktiviteter || []).map(a => ` ★ ${esc(a.namn || a.id)} ${a.start}–${a.slut}.`).join("")}${GRAF.obPassText(p, +d, st.korning.resultat, st.korning.indata).replace("\n", " ")}`;
}

// ------------------------------------------------------------------ export
function tabellRader() {
  const res = st.korning.resultat, N = res.veckor * 7;
  const rader = [["Person", ...Array.from({ length: N }, (_, d) => `V${Math.floor(d / 7) + 1} ${DAGAR[d % 7]}`)]];
  for (const [p, rad] of Object.entries(res.schema)) rader.push([p, ...rad.map(x => x ? `${{ morgon: "D", kvall: "K", natt: "N" }[x.dygnsdel]} ${x.start}-${x.slut}` : "")]);
  for (const del of ["morgon", "kvall", "natt"]) rader.push([`I tjänst ${DELAR[del].toLowerCase()}`, ...Array.from({ length: N }, (_, d) => Object.values(res.schema).filter(r => r[d] && r[d].dygnsdel === del).length)]);
  return rader;
}

async function kopieraTabell() {
  const text = tabellRader().map(r => r.join("\t")).join("\n");
  try { await navigator.clipboard.writeText(text); meddela("Tabellen är kopierad. Klistra in i Excel eller Numbers."); }
  catch { meddela("Kopieringen tilläts inte här."); }
}

function laddaXlsx() {
  if (window.XLSX) return Promise.resolve();
  return new Promise((ja, nej) => {
    const s = document.createElement("script");
    s.src = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
    s.onload = ja; s.onerror = () => nej(new Error("Kunde inte ladda Excel-stödet."));
    document.head.appendChild(s);
  });
}

async function excel() {
  let dl = null;
  try { dl = window.claude && await window.claude.use("downloads"); } catch { dl = null; }
  if (!dl) { meddela("Nedladdning går inte här. Använd Kopiera tabell."); return; }
  try {
    await laddaXlsx();
    const res = st.korning.resultat, wb = XLSX.utils.book_new();
    const s1 = XLSX.utils.aoa_to_sheet(tabellRader()); s1["!cols"] = [{ wch: 14 }, ...Array(res.veckor * 7).fill({ wch: 13 })];
    XLSX.utils.book_append_sheet(wb, s1, "Schema");
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([["Person", "Pass", "Arbetstid (h)", "Mål (h)", "Kvällspass", "Helger"],
      ...Object.entries(res.personer).map(([p, x]) => [p, x.pass, +(x.minuter / 60).toFixed(2), +(x.mal_minuter / 60).toFixed(2), x.kvallspass, x.helggrupp || UNDANTAG[x.helgfrekvens] || ""])]), "Per person");
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([["Vecka", "Dag", "Dygnsdel", "Antal"], ...res.vakanser.map(x => [x.vecka, x.veckodag, DELAR[x.dygnsdel], x.antal])]), "Vakanser");
    const g = st.korning.granskning;
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([["Typ", "Regel", "Nivå", "Person", "Beskrivning"],
      ...(res.brott || []).concat(g.brott).map(b => ["Brott", b.regel, b.niva, b.person || "", b.text]),
      ...g.varningar.map(b => ["Att notera", b.regel, b.niva, b.person || "", b.text])]), "Granskning");
    const data = XLSX.write(wb, { type: "array", bookType: "xlsx" });
    const namn = (st.enhet.namn || "schema").replace(/[^\wåäöÅÄÖ -]/g, "").trim() || "schema";
    await dl.save({ filename: `${namn} – ${st.korning.namn}.xlsx`, data: new Uint8Array(data) });
  } catch (e) {
    if (e && e.code === "declined") return;
    meddela(e && e.message ? e.message : "Nedladdningen misslyckades.");
  }
}

// ------------------------------------------------------------------ schemaassistent (via Claude-kontot)
const chatt = { oppen: false, enhet: null, turer: [], visning: [], forslag: null, upptagen: false, text: "", notis: "" };
const FRAGOR = ["Hur många kvällar har var och en?", "Hur ser fredagskvällarna ut?", "Var finns vakanserna?", "Lägg till en person på 75 % som bara jobbar kväll"];
function chattKontext() {
  const k = st.korningar.find(x => x.status === "OK") || st.korningar[0];
  const d = k ? JSON.parse(k.data) : null;
  return { indata: st.enhet.indata, resultat: d ? d.resultat : null, granskning: d ? d.granskning : null, onForslag: f => { chatt.forslag = { ...f, korning: k }; } };
}
function ritaChatt() {
  $("#chatt-knapp").hidden = !st.enhet || chatt.oppen;
  $("#chatt").hidden = !chatt.oppen;
  if (!chatt.oppen) return;
  $("#chatt-enhet").textContent = st.enhet ? st.enhet.namn : "";
  let h = chatt.visning.length ? "" : `<p class="dampad liten">Jag svarar på frågor om personal, behov och det senaste schemat, och föreslår ändringar som du godkänner.</p><div class="chips">${FRAGOR.map(f => `<button class="liten" data-g="chatt-fraga">${esc(f)}</button>`).join("")}</div>`;
  for (const m of chatt.visning) h += m.roll === "verktyg" ? `<div class="chatt-verktyg">${esc(m.text)}</div>` : `<div class="bubbla${m.roll === "du" ? " du" : m.roll === "fel" ? " fel" : ""}">${esc(m.text)}</div>`;
  if (chatt.upptagen && chatt.text) h += `<div class="bubbla">${esc(chatt.text)}</div>`;
  if (chatt.forslag) h += `<div class="forslagskort"><b>${esc(chatt.forslag.sammanfattning)}</b><ul class="punkter liten">${chatt.forslag.texter.map(x => `<li>${esc(x)}</li>`).join("")}</ul><div class="chips"><button class="primar liten" data-g="chatt-godkann">Godkänn</button><button class="liten" data-g="chatt-avvisa">Avvisa</button></div></div>`;
  if (chatt.upptagen) h += `<div class="chatt-verktyg">${esc(chatt.status || "Tänker …")}</div>`;
  const l = $("#chatt-logg"); l.innerHTML = h; l.scrollTop = l.scrollHeight;
  $("#chatt-skicka").disabled = chatt.upptagen;
}
async function skickaChatt(text) {
  if (!st.enhet || chatt.upptagen || !text.trim()) return;
  let sample = null;
  try { sample = window.claude && await window.claude.use("sample"); } catch { sample = null; }
  if (!sample) { chatt.visning.push({ roll: "fel", text: "Assistenten fungerar bara när sidan är öppen i Claude." }); return ritaChatt(); }
  if (chatt.enhet !== st.enhet.id) { chatt.enhet = st.enhet.id; chatt.turer = []; chatt.visning = []; chatt.forslag = null; }
  chatt.visning.push({ roll: "du", text: text.trim() });
  chatt.turer.push({ role: "user", content: (chatt.notis ? chatt.notis + "\n\n" : "") + text.trim() }); chatt.notis = "";
  chatt.upptagen = true; chatt.text = ""; chatt.status = "Tänker …"; ritaChatt();
  const ctx = chattKontext();
  const tools = ASSISTENT.verktyg.map(v => ({ name: v.name, description: v.description, inputSchema: v.schema,
    execute: inp => { chatt.status = { las_enhet: "Läser personal och behov …", las_schema: "Läser schemat …", las_dagar: "Tittar på dagarna …", las_person: "Tittar på personen …", foresla_andringar: "Förbereder ett förslag …" }[v.name]; ritaChatt(); return v.kor(ctx, inp || {}); } }));
  const forsta = { role: "user", content: ASSISTENT.SYSTEM + "\n\nAnvändaren arbetar med enheten " + JSON.stringify(st.enhet.namn) + ". Första frågan:\n\n" + chatt.turer[0].content };
  try {
    const { text: svar } = await sample([forsta, ...chatt.turer.slice(1)], { tools, cache: false, onText: ({ text: t }) => { chatt.text = t; ritaChatt(); } });
    chatt.turer.push({ role: "assistant", content: svar || "(inget svar)" });
    chatt.visning.push({ roll: "assistent", text: svar });
  } catch (e) {
    chatt.turer.pop();
    chatt.visning.push({ roll: "fel", text: e.code === "not_granted" ? "Assistenten fick inte tillåtelse att fråga Claude." : e.code === "rate_limited" ? "För många frågor just nu. Vänta en stund." : "Det gick inte att fråga Claude just nu." });
  }
  chatt.upptagen = false; chatt.text = ""; ritaChatt();
}
$("#chatt-knapp").onclick = () => { chatt.oppen = true; ritaChatt(); $("#chatt-text").focus(); };
$("#chatt-stang").onclick = () => { chatt.oppen = false; ritaChatt(); };
$("#chatt-form").onsubmit = e => { e.preventDefault(); const t = $("#chatt-text").value; $("#chatt-text").value = ""; skickaChatt(t); };
$("#chatt-text").onkeydown = e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("#chatt-form").requestSubmit(); } };
document.addEventListener("click", async e => {
  const el = e.target.closest("[data-g^=chatt-]"); if (!el) return;
  if (el.dataset.g === "chatt-fraga") skickaChatt(el.textContent);
  if (el.dataset.g === "chatt-avvisa") { chatt.notis = "[Användaren avvisade förslaget.]"; chatt.visning.push({ roll: "verktyg", text: "Förslaget avvisades." }); chatt.forslag = null; ritaChatt(); }
  if (el.dataset.g === "chatt-godkann") {
    const f = chatt.forslag;
    try {
      if (f.pass) {
        // passen blir exakt så som användaren sa, som en ny körning; originalet finns kvar
        const d = JSON.parse(f.korning.data), schema = ASSISTENT.tillampaSchema(d.resultat.schema, f.andringar, d.resultat.veckor);
        const res = raknaOm(d.indata, schema, d.resultat), g = GRANSKNING.kontrollera(d.indata, res);
        const k = { id: nyttId(), enhet: st.enhet.id, namn: "Ändrad av 🤖", skapad: Date.now(), status: g.brott.length ? "BROTT" : "OK", vakanta: res.kpi.vakanta_pass,
          data: JSON.stringify({ resultat: res, granskning: g, balans: d.balans, indata: d.indata }) };
        st.korningar.unshift(k); await lager.sparaKorning(k);
        chatt.visning.push({ roll: "verktyg", text: `Godkänt. Schemat är ändrat precis så och sparat som en ny körning.${g.brott.length ? ` Granskningen hittar ${g.brott.length} brott mot hårda regler – se Regelkontroll.` : " Alla hårda regler följs."}` });
        chatt.notis = `[Användaren godkände passändringen. Den är sparad med ${g.brott.length} brott mot hårda regler.]`; chatt.forslag = null;
        st.rflik = "schema"; visaKorning(k);
      } else {
        ASSISTENT.tillampa(st.enhet.indata, f.andringar);
        chatt.visning.push({ roll: "verktyg", text: "Godkänt och sparat. Schemat läggs om nu …" });
        chatt.notis = "[Användaren godkände förslaget. Det är sparat och schemat läggs om.]"; chatt.forslag = null;
        clearTimeout(sparaTimer); await lager.sparaEnhet(st.enhet);
        await oppna(st.enhet); laggSchema();
      }
    } catch (err) { chatt.visning.push({ roll: "fel", text: "Kunde inte tillämpa: " + err.message }); }
    ritaChatt();
  }

});
setInterval(() => { if (!chatt.oppen) $("#chatt-knapp").hidden = !st.enhet; }, 800);

// ------------------------------------------------------------------ start
(async () => { await lager.init(); visaLista(); })();
