    const cyk = ind.cykliskt !== false;
    const heltid = ind.heltid_minuter_per_vecka || 2220;
    const np = (ind.nattpass && ind.nattpass[0]) || { start: "21:45", slut: "06:45", maltidsuppehall: true };
    const ns = tid(np.start); let ne = tid(np.slut); if (ne <= ns) ne += DYGN;
    const nRast = np.maltidsuppehall === false && ne - ns > r.rast_grans_minuter ? r.rast_minuter : 0;
    const nnet = ne - ns - nRast;
    const ms = tid(r.morgon_start), ks = tid(r.kvall_slut), kf = tid(r.kant_fran), kt = tid(r.kant_till);

    const behov = Array.from({ length: 7 }, () => [0, 0, 0, 0]);
    for (const [nyckel, v] of Object.entries(ind.behov || {})) {
      const idx = nyckel === "vardag" ? [0, 1, 2, 3, 4] : nyckel === "helg" ? [5, 6] : nyckel === "alla" ? [0, 1, 2, 3, 4, 5, 6] : [DAGAR.indexOf(nyckel)];
      if (idx[0] < 0) { fel.push(`Okänd dag i behovet: ${nyckel}.`); continue; }
      for (const i of idx) behov[i] = [0, v.morgon || 0, v.kvall || 0, v.natt || 0];
    }

    // AB 25 § 13 mom. 8 och verksamhetens beslut: 11 timmars dygnsvila är hård och kan inte låsas upp
    if (r.dygnsvila_minuter < 660) fel.push("Dygnsvilan är minst 11 timmar och kan inte låsas upp i schemaplaneringen (AB 25 § 13 mom. 8; verksamhetens beslut).");
    const pers = [], ids = new Set();
    let vaxel = 0;  // för perioder där antal pass inte går jämnt ut
    for (const p of ind.personal || []) {
      if (!p.id) { fel.push("En person saknar id."); continue; }
      if (ids.has(p.id)) fel.push(`Samma id finns två gånger: ${p.id}.`);
      ids.add(p.id);
      const delar = p.dygnsdelar || ["morgon", "kvall"];
      const natt = delar.length === 1 && delar[0] === "natt";
      if (!(p.grad > 0 && p.grad <= 1)) { fel.push(`${p.id}: sysselsättningsgraden måste vara mellan 1 och 100 %.`); continue; }
      // nattpersonal: heltid 34 h 20 min om inget annat anges (AB 25 § 13 mom. 2; verksamhetens beslut)
      const malMin = Math.round((p.heltid_minuter_per_vecka || (natt ? ind.heltid_natt_minuter_per_vecka || 2060 : heltid)) * p.grad * W);
      let P = Array.isArray(p.antal_pass) ? p.antal_pass.reduce((a, b) => a + b, 0) : p.antal_pass;
      if (P == null) {
        if (natt) P = Math.round(malMin / nnet);
        else {
          // går det inte jämnt ut (28,5 på 6 veckor) får dag/kväll växelvis nedåt och uppåt: 28, 29, 28 …
          const x = r.pass_per_vecka * W;
          P = Math.abs(x - Math.round(x)) < 1e-9 ? Math.round(x) : (vaxel % 2 === 0 ? Math.floor(x) : Math.ceil(x));
          vaxel++;
          if (r.min_passlangd_minuter && malMin / P < r.min_passlangd_minuter) P = Math.max(1, Math.floor(malMin / r.min_passlangd_minuter));
        }
      }
      if (!(P > 0)) { fel.push(`${p.id}: antal pass måste vara minst 1.`); continue; }
      const typer = natt ? [NT] : delar.map(d => d === "morgon" ? M : K);
      const L = malMin / P;
      let bas = natt ? nnet : Math.floor(L / 15) * 15, k = 0;
      if (!natt) {
        k = Math.max(0, Math.min(P, Math.round((malMin - P * bas) / 15)));
        for (const net of k ? [bas, bas + 15] : [bas]) {
          const o = onsite(net, r);
          const okM = ms + o >= kf && ms + o <= kt, okK = ks - o >= kf && ks - o <= kt;
          if ((typer.includes(M) && !okM) || (typer.includes(K) && !okK)) {
            fel.push(`${p.id}: passen blir ${Math.floor(net / 60)} h ${net % 60} min arbetstid, vilket inte ryms i fönstret ${r.kant_fran}–${r.kant_till}. Ändra antal pass eller sysselsättningsgrad.`);
            break;
          }
        }
      }
      const frek = p.helgfrekvens || r.helgfrekvens;
      const tol = p.tolerans_minuter ?? (natt ? Math.max(r.tolerans_minuter, Math.ceil(nnet / 2)) : r.tolerans_minuter);
      pers.push({ id: p.id, natt, typer, P, malMin, L, bas, k, tol, frek, grupp: p.helggrupp === "A" ? 0 : p.helggrupp === "B" ? 1 : null, grad: p.grad });
    }
    if (!pers.length) fel.push("Lägg till minst en person.");

    for (const p of pers) {
      if (p.frek === "2/4" && cyk && W % 2) fel.push(`Varannan helg kräver ett jämnt antal veckor (${p.id}).`);
      if ((p.frek === "1/4" || p.frek === "3/4") && W % 4) fel.push(`${p.id}: helgfrekvens ${p.frek} kräver 4, 8, 12 eller 16 veckor.`);
    }

    // helggrupper: lika många i varje grupp per klass (dag/natt); fasta grupper räknas in
    for (const natt of [false, true]) {
      for (const [frek, n] of [["2/4", 2], ["1/4", 4], ["3/4", 4]]) {
        const lista = pers.filter(p => p.natt === natt && p.frek === frek);
        const antal = Array(n).fill(0);
        lista.filter(p => p.grupp != null).forEach(p => { p.grupp = p.grupp % n; antal[p.grupp]++; });
        lista.filter(p => p.grupp == null).sort((a, b) => b.grad - a.grad).forEach(p => {
          const g = antal.indexOf(Math.min(...antal)); p.grupp = g; antal[g]++;
        });
      }
    }
    for (const p of pers) {
      p.helg = Array.from({ length: W }, (_, w) =>
        p.frek === "alla" ? true : p.frek === "ingen" ? false : p.frek === "2/4" ? w % 2 === p.grupp :
        p.frek === "1/4" ? w % 4 === p.grupp : p.frek === "3/4" ? w % 4 !== p.grupp : w % 2 === 0);
      const helgdagar = 2 * p.helg.filter(Boolean).length;
      const vardagar = Array.from({ length: N }, (_, d) => d).filter(d => d % 7 < 5 && tillatna(p, d, r, W).length).length;
      if (p.P < helgdagar) fel.push(`${p.id}: ${p.P} pass räcker inte till ${helgdagar} helgdagar.`);
      else if (p.P - helgdagar > vardagar) fel.push(`${p.id}: ${p.P} pass ryms inte på de vardagar som är tillåtna.`);
    }

    // önskemål
    const onsk = [];
    (ind.onskemal || []).forEach((o, i) => {
      const pi = pers.findIndex(p => p.id === o.person);
      if (pi < 0) { fel.push(`Önskemål ${o.id || i + 1} gäller ${o.person}, som inte finns.`); return; }
      const dagar = [];
      if (Array.isArray(o.dagindex)) o.dagindex.forEach(d => dagar.push(((d % N) + N) % N));
      else {
        const dd = o.dagar && o.dagar.length ? o.dagar : DAGAR;
        const vv = o.veckor || "alla";
        for (let w = 0; w < W; w++) {
          const nr = ind.start_iso_vecka ? ind.start_iso_vecka + w : w + 1;
          if (vv === "alla" || (vv === "jämna" && nr % 2 === 0) || (vv === "udda" && nr % 2 === 1) || (Array.isArray(vv) && vv.includes(w + 1)))
            dd.forEach(x => dagar.push(w * 7 + DAGAR.indexOf(x)));
        }
      }
      onsk.push({ ...o, id: o.id || `O${i + 1}`, pi, dagar, vikt: o.vikt || 1, krav: !!o.krav });
    });

    // aktiviteter (verksamhetens beslut): den som deltar arbetar hela aktivitetstiden
    const akt = [];
    const aIds = new Set();
    (ind.aktiviteter || []).forEach((a, i) => {
      const id = a.id || `A${i + 1}`;
      if (aIds.has(id)) fel.push(`Aktiviteten ${id} finns flera gånger.`);
      aIds.add(id);
      const a0 = tid(a.start), a1 = tid(a.slut);
      if (!(a1 > a0)) { fel.push(`Aktiviteten ${id} måste sluta efter att den börjar samma dag.`); return; }
      const okanda = (a.deltagare || []).filter(q => !ids.has(q));
      if (okanda.length) { fel.push(`Aktiviteten ${id} har deltagare som inte finns i personalen: ${okanda.join(", ")}.`); return; }
      const dagar = new Set();
      if (Array.isArray(a.dagindex)) a.dagindex.forEach(d => dagar.add(((d % N) + N) % N));
      else {
        const dd = a.dagar && a.dagar.length ? a.dagar : DAGAR, vv = a.veckor || "alla";
        for (let w = 0; w < W; w++) {
          const nr = ind.start_iso_vecka ? ind.start_iso_vecka + w : w + 1;
          if (vv === "alla" || (vv === "jämna" && nr % 2 === 0) || (vv === "udda" && nr % 2 === 1) || (Array.isArray(vv) && vv.includes(w + 1)))
            dd.forEach(x => dagar.add(w * 7 + DAGAR.indexOf(x)));
        }
      }
      const ryms = t => t === M ? ms <= a0 && a1 <= kt : t === K ? kf <= a0 && a1 <= ks
        : (ns <= a0 && a1 <= ne) || (ns <= a0 + DYGN && a1 + DYGN <= ne);
      const grupp = pers.map((p, pi) => pi).filter(pi => a.deltagare && a.deltagare.length ? a.deltagare.includes(pers[pi].id) : pers[pi].typer.some(ryms));
      const G = grupp.length, T = dagar.size;
      const onskat = a.antal ? a.antal : a.andel ? Math.ceil(a.andel * G - 1e-9) : a.varje_person && T ? Math.ceil(G * a.varje_person / T) : G;
      const antal = Math.min(onskat, G);
      const snitt = G ? antal * T / G : 0;
      akt.push({ id, namn: a.namn || id, start: a.start, slut: a.slut, a0, a1, dagar: [...dagar].sort((x, y) => x - y), grupp, antal, onskat,
        krav: !!a.krav, minst: a.minst_pa_golvet || 0, golv: a.fran_golvet !== false, lo: a.varje_person || Math.floor(snitt + 1e-9), hi: a.varje_person || Math.ceil(snitt - 1e-9) });
    });

    // dygnsbryt för sökningen: där flest dag- och kvällspass byts
    const raknare = {};
    for (const p of pers) if (!p.natt) {
      const o = onsite(p.bas, r);
      if (p.typer.includes(M)) raknare[ms + o] = (raknare[ms + o] || 0) + p.P;
      if (p.typer.includes(K)) raknare[ks - o] = (raknare[ks - o] || 0) + p.P;
    }
    let db = ms + 8 * 60, bast = -1;
    for (let t = kf; t <= kt; t += 15) {
      const v = Object.entries(raknare).reduce((s, [g, n]) => s + (Math.abs(g - t) <= 30 ? n : 0), 0);
      if (v > bast) { bast = v; db = t; }
    }
    return { fel, r, W, N, cyk, behov, pers, onsk, akt, ms, ks, ns, ne, nnet, nRast, db, nattDb: ne % DYGN, enhet: ind.enhet || "" };
  }

  function tillatna(p, d, r, W) {
    const w = Math.floor(d / 7), wd = d % 7;
    if (p.natt) {
      if (wd >= 5) return p.helg[w] ? [NT] : [];
      if (wd === 4) return p.helg[w] ? [NT] : [];   // fredagsnatt går in i helgen
      if (wd === 0) return [NT];
      return [NT];
    }
    if (wd >= 5) return p.helg[w] ? p.typer.slice() : [];
    if (wd === 4 && !p.helg[w] && r.ingen_fredagskvall_fore_ledig_helg) return p.typer.filter(t => t !== K);
    return p.typer.slice();
  }

  // ------------------------------------------------------------------ sökning
  function los(ind, opt = {}) {
    const pr = forbered(ind);
    if (pr.fel.length) return { status: "INDATAFEL", fel: pr.fel };
    const { r, W, N, cyk, behov, pers, onsk } = pr;
    const P = pers.length;
    const rnd = slump(opt.seed ?? 12345);
    const tidsgrans = opt.sekunder ?? 8;
    const rapport = opt.rapport || (() => {});
    const per = pers.map((p, pi) => ({ onsk: onsk.filter(o => o.pi === pi), tillat: Array.from({ length: N }, (_, d) => tillatna(p, d, r, W)) }));
    const prof = PROFIL[opt.profil] || PROFIL.standard;

    // passtider per person och typ (utan förlängning)
    const tider = pers.map(p => {
      const o = onsite(p.bas, r);
      return { 1: [pr.ms, pr.ms + o], 2: [pr.ks - o, pr.ks], 3: [pr.ns, pr.ne] };
    });

    // andel kvällar för rättvisa
    let mB = 0, kB = 0;
    for (let d = 0; d < N; d++) { mB += behov[d % 7][M]; kB += behov[d % 7][K]; }
    const kAndel = mB + kB ? kB / (mB + kB) : 0.5;

    function personKost(pi, x, ut) {
      const p = pers[pi], t = tider[pi];
      let hard = 0, block = 0, onskStraff = 0;
      const not = (regel, niva, text) => { if (ut) ut.push({ regel, niva, person: p.id, text }); };
      const dt = d => `vecka ${Math.floor(d / 7) + 1} ${DAGAR[d % 7]}`;
      // vila mellan pass: kväll följd av morgon
      for (let d = 0; d < N; d++) if (x[d] === K && (cyk || d < N - 1) && x[(d + 1) % N] === M) { hard++; not("DYGNSVILA", "avtal", `Kväll ${dt(d)} följs av morgon, för kort vila.`); }
      // block
      let start = -1;
      for (let d = 0; d < N; d++) if (!x[d]) { start = d; break; }
      if (start < 0) hard += 10;
      else {
        let len = 0;
        for (let i = 1; i <= N; i++) {
          const d = (start + i) % N;
          if (x[d]) len++;
          else if (len) {
            const kant = !cyk && (d - len <= 0 || d === N);
            if (len < r.block_min && !kant) { hard++; not("BLOCK_MIN", "lokal regel", `Enstaka arbetsdag ${dt((d - 1 + N) % N)}.`); }
            if (len > r.block_max) { hard += len - r.block_max; not("BLOCK_MAX", "lokal regel", `${len} arbetsdagar i följd fram till ${dt((d - 1 + N) % N)}.`); }
            // nattpersonal: högst natt_max_i_rad nätter i rad (lokal regel)
            if (p.natt && r.natt_max_i_rad && len > r.natt_max_i_rad) { hard += len - r.natt_max_i_rad; not("NATT_I_RAD", "lokal regel", `${len} nätter i rad fram till ${dt((d - 1 + N) % N)}.`); }
            if (len > r.block_rekommenderat) block++;
            len = 0;
          }
        }
      }
      // högst kvall_max_i_rad kvällar i rad (lokal regel, mjuk; räknas som blocklängd)
      if (r.kvall_max_i_rad && p.typer.includes(K)) {
        const km = r.kvall_max_i_rad;
        for (let d = 0; d < N; d++) {
          if (x[d] !== K || (cyk ? x[(d - 1 + N) % N] === K : d > 0 && x[d - 1] === K)) continue;
          let l = 0; while (l < N && x[(d + l) % N] === K && (cyk || d + l < N)) l++;
          if (l > km) block += l - km;
        }
      }
      // nattpersonal: minst natt_vila_mellan_block_minuter mellan två nattblock (lokal regel, mjuk)
      let nv = 0;
      if (p.natt && r.natt_vila_mellan_block_minuter) {
        const gap = k => k * DYGN + t[NT][0] - t[NT][1];
        for (let d = 0; d < N; d++) {
          if (!x[d] || (!cyk && d + 1 >= N) || x[(d + 1) % N]) continue;
          for (let k = 2; k < 8 && gap(k) < r.natt_vila_mellan_block_minuter; k++) {
            if (!cyk && d + k >= N) break;
            if (x[(d + k) % N]) { nv++; break; }
          }
        }
      }
      // veckovila och dygnsvila
      const iv = d => {
        const dd = ((d % N) + N) % N;
        if (!cyk && dd !== d) return null;
        const typ = x[dd]; if (!typ) return null;
        return [d * DYGN + t[typ][0], d * DYGN + t[typ][1]];
      };
      const lucka = (a, b, d0, d1) => {
        let pos = a, best = 0;
        for (let d = d0; d <= d1; d++) {
          const v = iv(d); if (!v || v[1] <= a || v[0] >= b) continue;
          best = Math.max(best, Math.max(v[0], a) - pos); pos = Math.max(pos, Math.min(v[1], b));
        }
        return Math.max(best, b - pos);
      };
      for (let w = 0; w < W; w++) {
        const a = w * 7 * DYGN;
        if (lucka(a, a + 7 * DYGN, w * 7 - 1, w * 7 + 7) < r.veckovila_minuter) { hard++; not("VECKOVILA", "avtal", `Mindre än 36 timmars veckovila vecka ${w + 1}.`); }
      }
      const db = p.natt ? pr.nattDb : pr.db;
      for (let d = 0; d < (cyk ? N : N - 1); d++) {
        const a = d * DYGN + db;
        if (lucka(a, a + DYGN, d - 1, d + 2) < r.dygnsvila_minuter) { hard++; not("DYGNSVILA", "avtal", `Mindre än ${r.dygnsvila_minuter / 60} timmars dygnsvila från ${dt(d)}.`); }
      }
      // önskemål
      for (const o of per[pi].onsk) {
        for (const d of o.dagar) {
          const typ = x[d];
          let bryt = false;
          if (o.typ === "ledig") bryt = !!typ;
          else if (o.typ === "arbetar") bryt = !typ;
          else if (typ && o.typ === "tidigast_start") bryt = t[typ][0] < tid(o.varde);
          else if (typ && o.typ === "senast_slut") bryt = t[typ][1] > tid(o.varde);
          else if (typ && o.typ === "endast_dygnsdel") bryt = ![].concat(o.varde).includes(DELNAMN[typ]);
          if (bryt) { if (o.krav) { hard++; not("KRAV", "önskemål som krav", `Krav ${o.id} (${o.typ.replace("_", " ")}) bryts ${dt(d)}.`); } else onskStraff += o.vikt; }
        }
      }
      // rättvisa
      let f = 0;
      if (p.typer.length > 1) {
        let kv = 0; for (let d = 0; d < N; d++) if (x[d] === K) kv++;
        f = (kv - p.P * kAndel) ** 2;
      }
      // spridning: veckor med bara morgnar eller bara kvällar
      let spr = 0;
      if (p.typer.length > 1 && r.spridning_kvallar !== "av" && W >= 2) {
        for (let w = 0; w < W; w++) {
          let km = 0, mm = 0;
          for (let d = w * 7; d < w * 7 + 7; d++) { if (x[d] === K) km++; else if (x[d] === M) mm++; }
          if (km + mm) { if (!km) spr++; if (!mm) spr++; if (Number(r.spridning_tolerans) < 1) spr += Math.max(0, Math.abs(km - mm) - 1); }
        }
      }
      const ws = r.spridning_kvallar === "stark" ? 400 : 25;
      // ekonomi: uppskattad OB för personens pass
      let eko = 0;
      if (prof.e) for (let d = 0; d < N; d++) if (x[d]) eko += obKronor(t[x[d]][0], t[x[d]][1], d % 7);
      return { hard, block, onsk: onskStraff, f, spr, nv, summa: hard * HW + block * WB + onskStraff * WO * prof.o + f * WF * prof.f + spr * ws * prof.s + nv * WNV + eko * prof.e };
    }

    function bygg() {
      const X = pers.map((p, pi) => {
        const x = new Array(N).fill(OFF);
        let kvar = p.P;
        for (let w = 0; w < W; w++) if (p.helg[w]) for (const d of [w * 7 + 5, w * 7 + 6]) {
          const a = per[pi].tillat[d]; x[d] = a[Math.floor(rnd() * a.length)]; kvar--;
        }
        const lediga = [];
        for (let d = 0; d < N; d++) if (d % 7 < 5 && per[pi].tillat[d].length) lediga.push(d);
        for (let i = lediga.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [lediga[i], lediga[j]] = [lediga[j], lediga[i]]; }
        for (let i = 0; i < Math.max(0, kvar); i++) {
          const d = lediga[i], a = per[pi].tillat[d]; x[d] = a[Math.floor(rnd() * a.length)];
        }
        return x;
      });
      return X;
    }

    // aktiviteter: minuter som passet behöver förlängas för att täcka aktiviteten (Infinity = går inte).
    // Under sökningen räknas bara pass som täcker med högst toleransen i förlängning.
    const aktiv = pr.akt.length > 0;
    function forlangning(pi, X, d, a) {
      const x = X[pi], p = pers[pi], t = tider[pi];
      const typ = x[d];
      if (typ === M && a.a0 >= pr.ms && a.a1 <= tid(r.kant_till)) return Math.max(0, a.a1 - t[M][1]);
      if (typ === K && a.a1 <= pr.ks && a.a0 >= tid(r.kant_fran)) return Math.max(0, t[K][0] - a.a0);
      if (typ === NT && t[NT][0] <= a.a0 && a.a1 <= t[NT][1]) return 0;
      const fore = cyk ? (d - 1 + N) % N : d - 1;
      if (fore >= 0 && x[fore] === NT && t[NT][0] <= a.a0 + DYGN && a.a1 + DYGN <= t[NT][1]) return 0;
      return Infinity;
    }
    function aktKost(X) {
      if (!aktiv) return 0;
      let k = 0;
      for (const a of pr.akt) {
        const mojlig = new Map();
        for (const d of a.dagar) {
          let n = 0;
          for (const pi of a.grupp) if (forlangning(pi, X, d, a) <= Math.max(pers[pi].tol, 120)) { n++; mojlig.set(pi, (mojlig.get(pi) || 0) + 1); }
          k += Math.max(0, a.antal - n) * (a.krav ? HW : WA);
          // minsta bemanning på golvet: utöver deltagarna behövs så många som kan vara kvar (behov, som vakanser)
          if (a.minst) k += (Math.max(0, a.antal + a.minst - n) - Math.max(0, a.antal - n)) * WV / 2;
        }
        // rättvisa: var och en ska kunna delta minst så många gånger som fördelningen kräver
        if (a.lo) for (const pi of a.grupp) k += Math.max(0, a.lo - (mojlig.get(pi) || 0)) * WA / 4;
      }
      return k;
    }

    function vakans(cnt, d, t) { return Math.max(0, behov[d % 7][t] - cnt[d][t]); }
    // jämn bemanning: det som blir över eller saknas på dag och kväll sprids jämnt (per vecka och för perioden),
    // och ett andra extra pass samma dag och dygnsdel kostar extra
    const medJamn = r.jamn_bemanning !== "av";
    function jamnKost(cnt) {
      if (!medJamn) return 0;
      let k = 0, toM = 0, toK = 0, tvM = 0, tvK = 0;
      for (let w = 0; w < W; w++) {
        let om = 0, ok = 0, vm = 0, vk = 0;
        for (let d = w * 7; d < w * 7 + 7; d++) {
          const bm = behov[d % 7][M], bk = behov[d % 7][K], nm = cnt[d][M], nk = cnt[d][K];
          const o1 = Math.max(0, nm - bm), o2 = Math.max(0, nk - bk);
          om += o1; ok += o2; vm += Math.max(0, bm - nm); vk += Math.max(0, bk - nk);
          // växande straff (kvadratiskt): +6 på ett pass och +2 på ett annat kostar mer än +4 och +4
          k += o1 * o1 + o2 * o2 + 2 * Math.max(0, bm - nm) ** 2 + 2 * Math.max(0, bk - nk) ** 2;
        }
        k += Math.abs(om - ok) + Math.abs(vm - vk); toM += om; toK += ok; tvM += vm; tvK += vk;
      }
      return (k + 2 * Math.abs(toM - toK) + 2 * Math.abs(tvM - tvK)) * WJ * prof.j;
    }

    let bastX = null, bastKost = Infinity;
    const start = Date.now();
    const omstarter = opt.omstarter ?? 3;
    for (let om = 0; om < omstarter; om++) {
      const X = bygg();
      const cnt = Array.from({ length: N }, () => [0, 0, 0, 0]);
      X.forEach(x => x.forEach((t, d) => { if (t) cnt[d][t]++; }));
      const pk = X.map((x, pi) => personKost(pi, x));
      let vak = 0;
      for (let d = 0; d < N; d++) for (let t = 1; t <= 3; t++) vak += vakans(cnt, d, t);
      let jk = jamnKost(cnt), ak = aktKost(X);
      let kost = pk.reduce((s, k) => s + k.summa, 0) + vak * WV + jk + ak;
      let lokalBast = kost, lokalX = X.map(x => x.slice());
      const budget = tidsgrans * 1000 / omstarter;
      const t0 = Date.now();
      let T = 3000, iter = 0;
      const Tslut = 0.3;
      while (true) {
        iter++;
        if ((iter & 1023) === 0) {
          const andel = (Date.now() - t0) / budget;
          if (andel >= 1) break;
          T = 3000 * Math.pow(Tslut / 3000, andel);
          if ((iter & 32767) === 0) rapport({ andel: (om + andel) / omstarter, kost: Math.min(lokalBast, bastKost) });
        }
        const pi = Math.floor(rnd() * P), x = X[pi], p = pers[pi];
        const v = rnd();
        let andrade = [];  // [pi, d, gammal]
        let pj = -1;
        if (v < 0.5) {  // flytta ett pass mellan två vardagar
          const d1 = Math.floor(rnd() * N), d2 = Math.floor(rnd() * N);
          if (d1 % 7 >= 5 || d2 % 7 >= 5 || !x[d1] || x[d2]) continue;
          const a = per[pi].tillat[d2]; if (!a.length) continue;
          andrade = [[pi, d1, x[d1]], [pi, d2, OFF]];
          x[d2] = a[Math.floor(rnd() * a.length)]; x[d1] = OFF;
        } else if (v < 0.75) {  // byt dygnsdel
          if (p.typer.length < 2) continue;
          const d = Math.floor(rnd() * N); if (!x[d]) continue;
          const a = per[pi].tillat[d].filter(t => t !== x[d]); if (!a.length) continue;
          andrade = [[pi, d, x[d]]]; x[d] = a[Math.floor(rnd() * a.length)];
        } else if (v < 0.9) {  // byt dygnsdel för en del av ett arbetsblock: kvällar sist och morgnar först, så att vilan håller
          if (p.typer.length < 2) continue;
          const d = Math.floor(rnd() * N); if (x[d] !== M && x[d] !== K) continue;
          const mal = x[d] === M ? K : M;
          let a = d, b = d; while (a > 0 && x[a - 1]) a--; while (b < N - 1 && x[b + 1]) b++;
          const dagar = []; if (mal === K) for (let i = d; i <= b; i++) dagar.push(i); else for (let i = a; i <= d; i++) dagar.push(i);
          if (dagar.length > 5 || dagar.some(i => !per[pi].tillat[i].includes(mal))) continue;
          andrade = dagar.filter(i => x[i] !== mal).map(i => [pi, i, x[i]]); if (!andrade.length) continue;
          for (const [, i] of andrade) x[i] = mal;
        } else {  // två personer byter dygnsdel samma dag
          pj = Math.floor(rnd() * P); if (pj === pi) continue;
          const d = Math.floor(rnd() * N), y = X[pj];
          if (!x[d] || !y[d] || x[d] === y[d]) continue;
          if (!per[pi].tillat[d].includes(y[d]) || !per[pj].tillat[d].includes(x[d])) continue;
          andrade = [[pi, d, x[d]], [pj, d, y[d]]];
          const tmp = x[d]; x[d] = y[d]; y[d] = tmp;
        }
        // delta
        let delta = 0;
        const vakFore = {}, berorda = new Set();
        for (const [q, d, gammal] of andrade) {
          berorda.add(q);
          for (const t of [gammal, X[q][d]]) if (t) { const n = d * 4 + t; if (!(n in vakFore)) vakFore[n] = vakans(cnt, d, t); }
        }
        for (const [q, d, gammal] of andrade) { if (gammal) cnt[d][gammal]--; if (X[q][d]) cnt[d][X[q][d]]++; }
        for (const n in vakFore) delta += (vakans(cnt, Math.floor(n / 4), n % 4) - vakFore[n]) * WV;
        const jkNy = medJamn ? jamnKost(cnt) : 0; delta += jkNy - jk;
        const akNy = aktiv ? aktKost(X) : 0; delta += akNy - ak;
        const nya = {};
        for (const q of berorda) { nya[q] = personKost(q, X[q]); delta += nya[q].summa - pk[q].summa; }
        if (delta <= 0 || rnd() < Math.exp(-delta / T)) {
          kost += delta; jk = jkNy; ak = akNy;
          for (const q of berorda) pk[q] = nya[q];
          if (kost < lokalBast - 1e-9) { lokalBast = kost; lokalX = X.map(x => x.slice()); }
        } else {
          for (const [q, d, gammal] of andrade) { if (X[q][d]) cnt[d][X[q][d]]--; if (gammal) cnt[d][gammal]++; }
          for (let i = andrade.length - 1; i >= 0; i--) { const [q, d, gammal] = andrade[i]; X[q][d] = gammal; }
        }
      }
      if (lokalBast < bastKost) { bastKost = lokalBast; bastX = lokalX; }
      if (bastKost < WV) break;  // inga hårda brott och inga vakanser: bra nog
    }
    rapport({ andel: 1, kost: bastKost });
    const res = resultat(pr, bastX, tider, personKost, (Date.now() - start) / 1000);
    res.profil = opt.profil || "standard";
    // uppskattad OB per vecka för jämförelsen (efter förlängningar)
    let ob = 0;
    for (const rad of Object.values(res.schema)) rad.forEach((v, d) => { if (v) { const s = tid(v.start); let e = tid(v.slut); if (e <= s) e += DYGN; ob += obKronor(s, e, d % 7); } });
    res.kpi.ob_kr_vecka = Math.round(ob / W);
    return res;
  }

  // ------------------------------------------------------------------ resultat och passlängder
  function resultat(pr, X, tider, personKost, sekunder) {
    const { r, W, N, cyk, behov, pers } = pr;
    const schema = {}, personer = {};
    let hardTotalt = 0, block = 0, onskStraff = 0, passlangd = 0, spridning = 0, nattVila = 0;
    const brott = [];
    const kvallar = [];
    pers.forEach((p, pi) => {
      const x = X[pi], k = personKost(pi, x, brott);
      hardTotalt += k.hard; block += k.block; onskStraff += k.onsk; spridning += k.spr; nattVila += k.nv;
      const rad = x.map((t, d) => {
        if (!t) return null;
        if (t === NT) return { mall: "N", dygnsdel: "natt", start: klocka(pr.ns), slut: klocka(pr.ne), rast: pr.nRast, netto: pr.nnet, ...(pr.nRast ? {} : { maltidsuppehall: true }) };
        const net = p.bas, o = onsite(net, r);
        const [s, e] = t === M ? [pr.ms, pr.ms + o] : [pr.ks - o, pr.ks];
        return { mall: (t === M ? "M" : "K") + klocka(s) + "-" + klocka(e), dygnsdel: DELNAMN[t], start: klocka(s), slut: klocka(e), rast: o - net, netto: net };
      });
      // förläng k pass med 15 minuter där vilan räcker
      if (!p.natt && p.k) {
        const dagar = rad.map((v, d) => v ? d : -1).filter(d => d >= 0);
        let kvar = p.k;
        const ordning = dagar.slice().sort((a, b) => ((a * 7919) % 97) - ((b * 7919) % 97));
        for (const d of ordning) {
          if (!kvar) break;
          const v = rad[d], net = v.netto + 15, o = onsite(net, r);
          const forsok = v.dygnsdel === "morgon" ? { ...v, slut: klocka(pr.ms + o) } : { ...v, start: klocka(pr.ks - o) };
          forsok.netto = net; forsok.rast = o - net; forsok.mall = (v.dygnsdel === "morgon" ? "M" : "K") + forsok.start + "-" + forsok.slut;
          const gammal = rad[d]; rad[d] = forsok;
          if (vilaOk(rad, pr, p)) kvar--; else rad[d] = gammal;
        }
      }
      schema[p.id] = rad;
    });
    const golvVak = [];
    const tillfallen = aktiviteter(pr, schema, brott, golvVak);
    for (const t of tillfallen) if (t.saknas && t.krav) hardTotalt++;
    pers.forEach(p => {
      const rad = schema[p.id];
      const minuter = rad.reduce((s, v) => s + (v ? v.netto : 0), 0);
      const kv = rad.filter(v => v && v.dygnsdel === "kvall").length;
      if (p.typer.length > 1) kvallar.push(kv);
      passlangd += rad.reduce((s, v) => s + (v ? Math.abs(v.netto - p.L) : 0), 0) + Math.abs(minuter - p.malMin);
      personer[p.id] = { pass: rad.filter(Boolean).length, minuter, mal_minuter: p.malMin, kvallspass: kv,
        helggrupp: p.frek === "2/4" ? (p.grupp === 0 ? "A" : "B") : null, helgfrekvens: p.frek,
        aktiviteter: rad.reduce((s, v) => s + (v && v.aktiviteter ? v.aktiviteter.length : 0), 0) };
    });
    const vakanser = [];
    let vak = 0;
    for (let d = 0; d < N; d++) for (let t = 1; t <= 3; t++) {
      const n = pers.reduce((s, p, pi) => s + (X[pi][d] === t ? 1 : 0), 0), b = behov[d % 7][t];
      if (n < b) { vak += b - n; vakanser.push({ dag: d, vecka: Math.floor(d / 7) + 1, veckodag: DAGAR[d % 7], dygnsdel: DELNAMN[t], tid: null, antal: b - n }); }
    }
    vakanser.push(...golvVak);
    const golv = golvVak.reduce((s, v) => s + v.antal, 0);
    return {
      status: hardTotalt ? "BROTT" : "OK", motor: "light", enhet: pr.enhet, veckor: W, cykliskt: cyk, sekunder: Math.round(sekunder * 10) / 10,
      kpi: { vakanser: vak + golv, vakanta_pass: vak, vakanta_tidpunkter: golv, blocklangd: block, passlangd: Math.round(passlangd),
        rattvisa: kvallar.length ? Math.max(...kvallar) - Math.min(...kvallar) : 0, spridning, onskemal: onskStraff, hardregelbrott: hardTotalt,
        aktivitet_saknas: tillfallen.reduce((s, t) => s + t.saknas, 0), natt_vila: nattVila },
      personer, vakanser, aktiviteter: tillfallen.map(({ krav, ...t }) => t), schema, brott,
    };
  }

  // Välj deltagare till varje aktivitetstillfälle bland dem som arbetar: först de vars pass redan täcker,
  // sedan de som har deltagit minst. Behöver passet förlängas kortas personens andra pass i steg om 15 minuter,
  // så att arbetstiden stämmer med kontraktet. Vilan kontrolleras efter varje ändring.
  function aktiviteter(pr, schema, brott, golvVak) {
    const { r, N, cyk, pers } = pr, kf = tid(r.kant_fran), kt = tid(r.kant_till);
    const ut = [];
    const satt = (v, o) => {
      const net = netto(o, r); if (net == null) return null;
      const n = { ...v, netto: net, rast: o - net };
      if (v.dygnsdel === "morgon") n.slut = klocka(pr.ms + o); else n.start = klocka(pr.ks - o);
      n.mall = (v.dygnsdel === "morgon" ? "M" : "K") + n.start + "-" + n.slut;
      return n;
    };
    const paPlats = v => { const s = tid(v.start); let e = tid(v.slut); if (e <= s) e += DYGN; return e - s; };
    const tackDag = (rad, d, a) => {
      const v = rad[d];
      if (v) { const s = tid(v.start); let e = tid(v.slut); if (e <= s) e += DYGN; if (s <= a.a0 && a.a1 <= e) return d; }
      const f = cyk ? (d - 1 + N) % N : d - 1, w = f >= 0 ? rad[f] : null;
      if (w && w.dygnsdel === "natt") { const s = tid(w.start); let e = tid(w.slut); if (e <= s) e += DYGN; if (s <= a.a0 + DYGN && a.a1 + DYGN <= e) return f; }
      return -1;
    };
    // försök förlänga passet dag d så att det täcker aktiviteten, och korta andra pass lika mycket
    const forlang = (p, rad, d, a, prova) => {
      const v = rad[d]; if (!v || (v.dygnsdel !== "morgon" && v.dygnsdel !== "kvall")) return false;
      const o = v.dygnsdel === "morgon" ? a.a1 - pr.ms : pr.ks - a.a0;
      if (o <= paPlats(v)) return false;
      if (v.dygnsdel === "morgon" ? (a.a0 < pr.ms || a.a1 > kt) : (a.a1 > pr.ks || a.a0 < kf)) return false;
      const ny = satt(v, o); if (!ny) return false;
      const kopia = rad.slice(); kopia[d] = ny;
      let over = kopia.reduce((s, x) => s + (x ? x.netto : 0), 0) - p.malMin;
      if (over > p.tol) {
        const andra = kopia.map((x, i) => i).filter(i => i !== d && kopia[i] && !kopia[i].aktiviteter && (kopia[i].dygnsdel === "morgon" || kopia[i].dygnsdel === "kvall"))
          .sort((i, j) => kopia[j].netto - kopia[i].netto);
        let andrat = true;
        while (over > 0 && andrat) {
          andrat = false;
          for (const i of andra) {
            if (over <= 0) break;
            const x = kopia[i], o2 = paPlats(x) - 15;
            const slut = x.dygnsdel === "morgon" ? pr.ms + o2 : pr.ks - o2;
            if (x.dygnsdel === "morgon" ? slut < kf : slut > kt) continue;
            const k = satt(x, o2); if (!k || k.netto < p.L - 120) continue;
            over -= x.netto - k.netto; kopia[i] = k; andrat = true;
          }
        }
        if (over > p.tol) return false;
      }
      if (!vilaOk(kopia, pr, p)) return false;
      if (!prova) kopia.forEach((x, i) => { rad[i] = x; });
      return true;
    };
    for (const a of pr.akt) {
      // vilka kan delta vid varje tillfälle (passet täcker, eller kan förlängas)
      const kan = a.dagar.map(d => new Set(a.grupp.filter(pi => {
        const rad = schema[pers[pi].id];
        return tackDag(rad, d, a) >= 0 || forlang(pers[pi], rad, d, a, true);
      })));
      const delt = a.dagar.map(() => []), n = new Map();
      const tilldela = (pi, i) => {
        const p = pers[pi], rad = schema[p.id], d = a.dagar[i];
        let dd = tackDag(rad, d, a);
        if (dd < 0) { if (!forlang(p, rad, d, a)) return false; dd = d; }
        rad[dd] = { ...rad[dd], aktiviteter: [...(rad[dd].aktiviteter || []), { id: a.id, namn: a.namn, start: a.start, slut: a.slut }] };
        delt[i].push(p.id); n.set(pi, (n.get(pi) || 0) + 1);
        return true;
      };
      // rättvis fördelning: varv för varv får var och en ett tillfälle, de med färst möjligheter först,
      // till det tillfälle som har minst deltagare hittills
      for (let varv = 1; varv <= a.hi; varv++) {
        const ordning = a.grupp.filter(pi => (n.get(pi) || 0) < varv)
          .sort((x, y) => kan.filter(k => k.has(x)).length - kan.filter(k => k.has(y)).length || x - y);
        for (const pi of ordning) {
          const val = a.dagar.map((d, i) => i).filter(i => kan[i].has(pi) && delt[i].length < a.antal && !delt[i].includes(pers[pi].id))
            .sort((i, j) => delt[i].length - delt[j].length || i - j);
          for (const i of val) if (tilldela(pi, i)) break;
        }
      }
      // fyll platser som är kvar med dem som har deltagit minst
      a.dagar.forEach((d, i) => {
        const resten = [...kan[i]].filter(pi => !delt[i].includes(pers[pi].id)).sort((x, y) => (n.get(x) || 0) - (n.get(y) || 0) || x - y);
        for (const pi of resten) { if (delt[i].length >= a.antal) break; tilldela(pi, i); }
      });
      // minsta bemanning på golvet: förläng pass för dem som inte deltar tills nog många är kvar varje kvart
      if (a.minst) a.dagar.forEach((d, i) => {
        const pagolv = t => {
          let n = 0;
          for (const p of pers) {
            const rad = schema[p.id];
            for (const dd of [d, cyk ? (d - 1 + N) % N : d - 1]) {
              const v = dd >= 0 ? rad[dd] : null; if (!v) continue;
              const s = tid(v.start); let e = tid(v.slut); if (e <= s) e += DYGN;
              const tt = dd === d ? t : t + DYGN;
              if (s <= tt && tt < e) { if (!(dd === d && a.golv && pr.akt.some(b => b.golv && b.a0 <= t && t < b.a1 && (v.aktiviteter || []).some(x => x.id === b.id)))) n++; break; }
            }
          }
          return n;
        };
        const brist = () => { let m = 0; for (let t = a.a0; t < a.a1; t += 15) m = Math.max(m, a.minst - pagolv(t)); return m; };
        const kand = pers.filter(p => !delt[i].includes(p.id) && schema[p.id][d] && !schema[p.id][d].aktiviteter
          && (schema[p.id][d].dygnsdel === "morgon" || schema[p.id][d].dygnsdel === "kvall"));
        for (const p of kand) { if (brist() <= 0) break; if (tackDag(schema[p.id], d, a) < 0) forlang(p, schema[p.id], d, a); }
        for (let t = a.a0; t < a.a1; t += 15) {
          const m = a.minst - pagolv(t);
          if (m > 0) golvVak.push({ dag: d, vecka: Math.floor(d / 7) + 1, veckodag: DAGAR[d % 7], dygnsdel: null, tid: klocka(t), antal: m });
        }
      });
      a.dagar.forEach((d, i) => {
        const saknas = a.onskat - delt[i].length;
        const dt = `vecka ${Math.floor(d / 7) + 1} ${DAGAR[d % 7]}`;
        if (saknas > 0 && a.krav) brott.push({ regel: "AKTIVITET", niva: "verksamhet", person: null, text: `${dt}: ${delt[i].length} deltar i ${a.namn}, behov ${a.onskat}.` });
        ut.push({ aktivitet: a.id, namn: a.namn, dag: d, vecka: Math.floor(d / 7) + 1, veckodag: DAGAR[d % 7], start: a.start, slut: a.slut,
          deltagare: delt[i], behov: a.onskat, saknas: Math.max(0, saknas), krav: a.krav });
      });
    }
    return ut;
  }

  function vilaOk(rad, pr, p) {
    const { r, N, W, cyk } = pr;
    const L = N * DYGN;
    let iv = [];
    rad.forEach((v, d) => { if (v) { const s = d * DYGN + tid(v.start); let e = d * DYGN + tid(v.slut); if (e <= s) e += DYGN; iv.push([s, e]); } });
    if (cyk) iv = iv.concat(iv.map(([s, e]) => [s - L, e - L]), iv.map(([s, e]) => [s + L, e + L]));
    iv.sort((a, b) => a[0] - b[0]);
    const lucka = (a, b) => { let pos = a, best = 0; for (const [s, e] of iv) { if (e <= a || s >= b) continue; best = Math.max(best, Math.max(s, a) - pos); pos = Math.max(pos, Math.min(e, b)); } return Math.max(best, b - pos); };
    for (let i = 1; i < iv.length; i++) if (iv[i][0] - iv[i - 1][1] < r.dygnsvila_minuter && iv[i][0] >= 0 && iv[i][0] < L) return false;
    for (let w = 0; w < W; w++) if (lucka(w * 7 * DYGN, (w + 1) * 7 * DYGN) < r.veckovila_minuter) return false;
    const db = p.natt ? pr.nattDb : pr.db;
    for (let d = 0; d < N; d++) if (lucka(d * DYGN + db, d * DYGN + db + DYGN) < r.dygnsvila_minuter) return false;
    return true;
  }

  // ------------------------------------------------------------------ bemanningsbalans
  function balans(ind) {
    const pr = forbered(ind);
    if (pr.fel.length) return { fel: pr.fel };
    const { r, W, N, behov, pers } = pr;
    const b = (d, t) => behov[d % 7][t];
    const dag = pers.filter(p => !p.natt), natt = pers.filter(p => p.natt);
    const sum = (l, f) => l.reduce((s, x) => s + f(x), 0);
    let behovDK = 0, behovN = 0, vardagDK = 0, vardagN = 0;
    for (let d = 0; d < N; d++) { behovDK += b(d, M) + b(d, K); behovN += b(d, NT); if (d % 7 < 5) { vardagDK += b(d, M) + b(d, K); vardagN += b(d, NT); } }
    const tillDK = sum(dag, p => p.P), tillN = sum(natt, p => p.P);
    let vakHelg = 0, fredag = 0, helgDK = 0, helgN = 0;
    const helger = [];
    for (let w = 0; w < W; w++) {
      const fre = w * 7 + 4, lor = w * 7 + 5, son = w * 7 + 6;
      const bada = dag.filter(p => p.helg[w] && p.typer.length > 1).length;
      const mo = dag.filter(p => p.helg[w] && p.typer.length === 1 && p.typer[0] === M).length;
      const kv = dag.filter(p => p.helg[w] && p.typer.length === 1 && p.typer[0] === K).length;
      const nw = natt.filter(p => p.helg[w]).length;
      const mB = Math.max(b(lor, M), b(son, M)), kB = Math.max(b(lor, K), b(son, K));
      const kF = r.ingen_fredagskvall_fore_ledig_helg ? Math.max(kB, b(fre, K)) : kB;

<script>"use strict";
// OB enligt AB 25 § 21 mom. 1 (Sveriges Kommuner och Regioner, lydelse 2025-04-01), kalenderstyrt.

//

const OB = (() => {
  const NIVAER = [
    { fran: "2025-04-01", till: "2026-03-31", A: 126.90, A_natt: 152.30, B: 66.10, B_natt: 76.00, C: 56.70, D: 25.60, kalla: "AB 25 § 21, fr.o.m. 2025-04-01" },

  const minut = s => { const [h, m] = s.split(":").map(Number); return h * 60 + m; };

  // Alla gränser i § 21 ligger på dessa klockslag, så kategorin är densamma inom varje intervall.
  const GRANSER = [0, 6 * 60, 7 * 60, 16 * 60, 17 * 60, 18 * 60, 19 * 60, 22 * 60, DYGN];
  const dagCache = new Map();
  function dagKategorier(n) {
    let k = dagCache.get(n);
    if (!k) { k = GRANSER.slice(0, -1).map(g => kategori(n * DYGN + g)); dagCache.set(n, k); }
    return k;
  }

  // OB-minuter för ett pass på dag n. Rasten antas ligga mitt i passet (den är inte arbetstid).
  function pass(n, p, prognos = 0) {
    const s = n * DYGN + minut(p.start); let e = n * DYGN + minut(p.slut); if (e <= s) e += DYGN;
    const rast = p.rast || 0, r0 = Math.round((s + e) / 2 - rast / 2), r1 = r0 + rast;
    const delar = rast ? [[s, r0], [r1, e]] : [[s, e]];
    const ut = [];  // {manad, kat, min, niva}
    for (const [a, b] of delar) {
      let t = a;
      while (t < b) {
        const dag = Math.floor(t / DYGN), m = t - dag * DYGN;
        let i = 0; while (GRANSER[i + 1] <= m) i++;
        const slut = Math.min(b, dag * DYGN + GRANSER[i + 1]), k = dagKategorier(dag)[i];
        if (k) {
          const man = manad(dag), nv = niva(dag, prognos), sista = ut[ut.length - 1];
          if (sista && sista.kat === k && sista.manad === man && sista.niva === nv) sista.min += slut - t;
          else ut.push({ manad: man, kat: k, min: slut - t, niva: nv });
        }
        t = slut;
      }
    }
    return ut;
  }

  // Summera segment per kalendermånad och kategori (A inklusive nattförhöjd tid, osv.), och räkna kronor.
  // avrunda: AB:s regel för utbetalning (uppåt till hel/halv timme per kategori och månad, under en timme ger inget).
  function summera(segment, { avrunda = false } = {}) {
    const perManad = {};
    let prognosMin = 0;
    for (const x of segment) {
      const bas = x.kat[0], m = (perManad[x.manad] = perManad[x.manad] || {});
      const k = (m[bas] = m[bas] || { min: 0, kr: 0, natt: 0, utanNiva: 0, prognos: 0 });
      if (x.niva?.prognos) { k.prognos += x.min; prognosMin += x.min; }
      k.min += x.min;
      if (x.kat.endsWith("_natt")) k.natt += x.min;
      if (x.niva) k.kr += x.min / 60 * x.niva[x.kat]; else k.utanNiva += x.min;
    }
    const tot = { A: { min: 0, kr: 0 }, B: { min: 0, kr: 0 }, C: { min: 0, kr: 0 }, D: { min: 0, kr: 0 } };
    let saknarNiva = 0;
    for (const m of Object.values(perManad)) for (const [bas, k] of Object.entries(m)) {
      let min = k.min, kr = k.kr;
      if (avrunda) {
        const rundat = Math.ceil(min / 30) * 30;
        if (rundat < 60) { min = 0; kr = 0; }
        else if (min > 0 && rundat > min && k.min > k.utanNiva) { kr += (rundat - min) / 60 * (kr / ((k.min - k.utanNiva) / 60) || 0); min = rundat; }
      }
      tot[bas].min += min; tot[bas].kr += kr; saknarNiva += k.utanNiva;
    }
    const kr = KATEGORIER.reduce((s, k) => s + tot[k].kr, 0), min = KATEGORIER.reduce((s, k) => s + tot[k].min, 0);
    return { kategorier: tot, min, kr, saknarNiva, prognosMin, perManad };
  }

  // Antaget startdatum när enheten saknar ett: den senaste måndagen där ett helt år (52 veckor) ryms inom
  // kontrollerade avtalsbelopp, så att årskostnaden inte blir för låg av tid utan belopp.
  function antagetStart(prognos = 0) {
    if (prognos > 0) { let n = Math.round(Date.now() / 864e5); while (veckodag(n) !== 0) n++; return iso(n); }
    let n = frånText(NIVAER[NIVAER.length - 1].till) - 52 * 7 + 1;
    while (veckodag(n) !== 0) n--;
    return iso(n);
  }

  // OB för ett grundschema: en period från startdatum och ett år (52 veckor, cykeln upprepad).
  // schema: {person: [pass eller null per dag i cykeln]}.
  function forSchema(schema, startdatum, { veckorAr = 52, prognos = 0 } = {}) {
    const start = frånText(startdatum), N = Object.values(schema)[0]?.length || 0;
    const ut = {};
    for (const [pid, rad] of Object.entries(schema)) {
      const period = [], helar = [], perPass = [];
      for (let d = 0; d < veckorAr * 7; d++) {
        const p = rad[d % N]; if (!p) continue;
        const seg = pass(start + d, p, prognos);
        helar.push(...seg);
        if (d < N) { period.push(...seg); perPass.push({ dag: d, datum: iso(start + d), seg }); }
      }
      ut[pid] = { period: summera(period), ar: summera(helar, { avrunda: true }), perPass };
    }
    return ut;
  }

  function dagInfo(n) { return { datum: iso(n), veckodag: veckodag(n), helgdag: arsdagar(ar(n)).helg.get(n) || null, afton: afton(n) }; }

  // Prognosprocent för en enhet: fältet ob_prognos_procent, annars standard (3 %). 0 stänger av.
  const prognosFor = indata => indata.ob_prognos_procent ?? STANDARD_PROGNOS;

  return { NIVAER, STANDARD_PROGNOS, prognosFor, prognosNiva, KATEGORIER, kategori, pass, summera, forSchema, niva, antagetStart, dagnr, iso, frånText, veckodag, dagInfo };
})();
if (typeof module !== "undefined") module.exports = OB;
</script>
<script>"use strict";
// Nyckeltal och grafer för ett lagt schema. Delas av webben (sidor.js) och lättversionen (light/sida.html),
// som assistent.js. Fristående: egna hjälpfunktioner, inga beroenden på resten av gränssnittet.
// Färgerna kommer från CSS-variablerna --morgon, --kvall, --natt, --over, --kritisk, --guld, --skog.
// Resurstid (det som ligger utöver behovet) visas svart: --resurs.

const GRAF = (() => {
const DAGAR = ["mån", "tis", "ons", "tor", "fre", "lör", "sön"];
const sv = (x, d = 2) => (Math.round(x * 10 ** d) / 10 ** d).toString().replace(".", ",");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function behovPerDag(indata) {
  const ut = Array.from({ length: 7 }, () => ({ morgon: 0, kvall: 0, natt: 0 }));
  for (const [k, v] of Object.entries(indata.behov || {})) {
    const idx = k === "vardag" ? [0, 1, 2, 3, 4] : k === "helg" ? [5, 6] : k === "alla" ? [0, 1, 2, 3, 4, 5, 6] : [DAGAR.indexOf(k)];
    idx.forEach(i => { if (i >= 0) ut[i] = { morgon: v.morgon || 0, kvall: v.kvall || 0, natt: v.natt || 0 }; });
  }
  return ut;
}

// Per dag: i tjänst (n), behov (b), vakanser och överbemanning per dygnsdel.
function bemanning(res, indata) {
  const N = res.veckor * 7, behov = behovPerDag(indata);
  return Array.from({ length: N }, (_, d) => {
    const n = { morgon: 0, kvall: 0, natt: 0 };
    for (const rad of Object.values(res.schema)) { const p = rad[d]; if (p && n[p.dygnsdel] !== undefined) n[p.dygnsdel]++; }
    const b = behov[d % 7], vak = {}, over = {};
    for (const k of ["morgon", "kvall", "natt"]) { vak[k] = Math.max(0, b[k] - n[k]); over[k] = Math.max(0, n[k] - b[k]); }
    return { d, n, b, vak, over };
  });
}

const PASSNAMN = { morgon: "Dag", kvall: "Kväll", natt: "Natt", jour: "Jour" };

// ---------------------------------------------------------------- nyckeltal ur en körning
function nyckeltalFor(k) {
  const res = k.resultat, ind = k.indata, W = res.veckor;
  const bem = bemanning(res, ind);
  const delar = ["morgon", "kvall", "natt"];
  let behov = 0, tackt = 0, vak = 0, over = 0;
  bem.forEach(x => delar.forEach(d => { behov += x.b[d]; tackt += Math.min(x.n[d], x.b[d]); vak += x.vak[d]; over += x.over[d]; }));
  const perVecka = Array.from({ length: W }, (_, w) => {
    const dagar = bem.slice(w * 7, w * 7 + 7);
    const b = dagar.reduce((s, x) => s + delar.reduce((a, d) => a + x.b[d], 0), 0);
    const t = dagar.reduce((s, x) => s + delar.reduce((a, d) => a + Math.min(x.n[d], x.b[d]), 0), 0);
    let min = 0;
    for (const rad of Object.values(res.schema)) rad.slice(w * 7, w * 7 + 7).forEach(p => { if (p) min += p.netto; });
    return { vecka: w + 1, grad: b ? t / b * 100 : 100, timmar: min / 60 };
  });
  const minuter = Object.values(res.personer).reduce((s, p) => s + p.minuter, 0);
  const overtid = Object.values(res.personer).reduce((s, p) => s + Math.max(0, p.minuter - p.mal_minuter), 0) / 60 / W;
  const pass = { morgon: 0, kvall: 0, natt: 0 };
  for (const rad of Object.values(res.schema)) rad.forEach(p => { if (p && pass[p.dygnsdel] !== undefined) pass[p.dygnsdel]++; });
  const timkostnad = Number(ind.timkostnad_kr) || null;
  const ob = obFor(res, ind), obVecka = ob ? Object.values(ob.per).reduce((s, x) => s + x.ar.kr, 0) / 52 : null;
  // resurspass: pass utöver behovet (se resurs nedan), antal och timmar per person och totalt
  const rs = resurs(res, ind), resursPer = {};
  let resursMin = 0;
  for (const nyckel of rs) { const i = nyckel.lastIndexOf(":"), pid = nyckel.slice(0, i), p = res.schema[pid][+nyckel.slice(i + 1)];
    resursPer[pid] = resursPer[pid] || { pass: 0, minuter: 0 }; resursPer[pid].pass++; resursPer[pid].minuter += p.netto || 0; resursMin += p.netto || 0; }
  return { bem, behov, tackt, vak, over, grad: behov ? tackt / behov * 100 : 100, perVecka, timmarVecka: minuter / 60 / W,
    resursPass: rs.size, resursTimmarVecka: resursMin / 60 / W, resursAndel: minuter ? resursMin / minuter * 100 : 0, resursPer,
    overtid, pass, timkostnad, obVecka, kostnadVecka: timkostnad ? minuter / 60 / W * timkostnad + (obVecka || 0) : null };
}

const kr = n => n >= 1e6 ? `${sv(n / 1e6, 2)} mkr` : n >= 1e4 ? `${sv(n / 1e3, 0)} tkr` : `${Math.round(n).toLocaleString("sv-SE")} kr`;

// ---------------------------------------------------------------- grafer
// Linjediagram med en serie: yta, linje, markeringar, betonad slutpunkt och verktygstips per punkt.
function linjegraf(punkter, { min = 0, max = null, format = v => sv(v, 1), enhet = "", mal = null, namn = "" } = {}) {
  if (!punkter.length) return "";
  const W = 520, H = 190, vX = 46, hX = 16, top = 14, bas = H - 30;
  const ymax = max ?? (Math.max(...punkter.map(p => p.y), mal ?? 0) * 1.12 || 1);
  const ymin = Math.min(min, ...punkter.map(p => p.y));
  const x = i => vX + (punkter.length === 1 ? (W - vX - hX) / 2 : i * (W - vX - hX) / (punkter.length - 1));
  const y = v => bas - (v - ymin) / (ymax - ymin || 1) * (bas - top);
  const steg = [ymin, (ymin + ymax) / 2, ymax];
  const linje = punkter.map((p, i) => `${i ? "L" : "M"}${x(i)},${y(p.y)}`).join(" ");
  return `<svg class="graf" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(namn)}">
    ${steg.map(v => `<line class="rutnat" x1="${vX}" x2="${W - hX}" y1="${y(v)}" y2="${y(v)}"/><text x="${vX - 8}" y="${y(v) + 4}" text-anchor="end">${format(v)}</text>`).join("")}
    ${mal != null ? `<line x1="${vX}" x2="${W - hX}" y1="${y(mal)}" y2="${y(mal)}" style="stroke:var(--guld);stroke-width:1.5;stroke-dasharray:5 4"/>` : ""}
    <path d="${linje} L${x(punkter.length - 1)},${bas} L${x(0)},${bas} Z" style="fill:var(--accent-svag)"/>
    <path d="${linje}" style="fill:none;stroke:var(--skog);stroke-width:2"/>
    ${punkter.map((p, i) => `<circle cx="${x(i)}" cy="${y(p.y)}" r="${i === punkter.length - 1 ? 5.5 : 4}" style="fill:${i === punkter.length - 1 ? "var(--skog)" : "var(--yta)"};stroke:var(--skog);stroke-width:2"/>
      <text x="${x(i)}" y="${H - 8}" text-anchor="middle">${esc(p.x)}</text>
      <rect class="traff" x="${x(i) - 18}" y="${top}" width="36" height="${bas - top}" data-tips="${esc(p.x)}: ${format(p.y)}${enhet}"/>`).join("")}
  </svg>`;
}

// Ringdiagram med 2 px mellanrum mellan delarna och summan i mitten.
function ringdiagram(delar, mitt) {
  const tot = delar.reduce((s, d) => s + d.varde, 0) || 1, R = 70, r = 46, C = 90;
  let vinkel = -Math.PI / 2, h = "";
  for (const d of delar.filter(d => d.varde)) {
    const v = d.varde / tot * Math.PI * 2, gap = delar.filter(x => x.varde).length > 1 ? 0.02 : 0;
    const a0 = vinkel + gap, a1 = vinkel + v - gap, stor = v > Math.PI ? 1 : 0;
    const p = (rad, a) => `${C + rad * Math.cos(a)},${C + rad * Math.sin(a)}`;
    h += `<path d="M${p(R, a0)} A${R},${R} 0 ${stor} 1 ${p(R, a1)} L${p(r, a1)} A${r},${r} 0 ${stor} 0 ${p(r, a0)} Z" style="fill:${d.farg}" data-tips="${d.namn}: ${d.varde} pass (${Math.round(d.varde / tot * 100)} %)"/>`;
    vinkel += v;
  }
  return `<div class="ring"><svg viewBox="0 0 180 180" role="img" aria-label="Passfördelning">${h}<text x="90" y="88" text-anchor="middle" class="ringtal">${mitt}</text><text x="90" y="108" text-anchor="middle" class="ringtext">pass</text></svg>
    <ul class="ringlegend">${delar.filter(d => d.varde).map(d => `<li><i style="background:${d.farg}"></i>${d.namn}<b>${Math.round(d.varde / tot * 100)} %</b></li>`).join("")}</ul></div>`;
}

// Värmekarta: dygnsdel × dag. Rött = underbemanning, sand = i balans, blått = överbemanning.
function varmekarta(bem, W) {
  const delar = ["morgon", "kvall", "natt"].filter(d => bem.some(x => x.b[d] || x.n[d]));
  const cell = (x, d) => {
    const diff = x.n[d] - x.b[d];
    const stil = diff < 0 ? `background:rgba(184,67,47,${Math.min(0.85, 0.3 + 0.25 * -diff)});color:#fff` : diff > 0 ? `background:rgba(20,20,20,${Math.min(0.9, 0.3 + 0.2 * diff)});color:#fff` : "background:var(--sand)";
    return `<td style="${stil}" data-tips="Vecka ${Math.floor(x.d / 7) + 1} ${DAGAR[x.d % 7]} ${PASSNAMN[d].toLowerCase()}\n${x.n[d]} i tjänst, behov ${x.b[d]}${diff < 0 ? ` – ${-diff} saknas` : diff > 0 ? ` – ${diff} resurspass utöver behovet` : ""}">${diff ? (diff > 0 ? "+" : "−") + Math.abs(diff) : ""}</td>`;
  };
  return `<div class="rull"><table class="varme"><thead><tr><th></th>${Array.from({ length: W }, (_, w) => `<th colspan="7" class="ny-vecka">V${w + 1}</th>`).join("")}</tr>
    <tr><th></th>${bem.map(x => `<th class="${x.d % 7 === 0 ? "ny-vecka" : ""}">${DAGAR[x.d % 7][0]}</th>`).join("")}</tr></thead>
    <tbody>${delar.map(d => `<tr><th>${PASSNAMN[d]}</th>${bem.map(x => cell(x, d).replace("<td ", `<td class="${x.d % 7 === 0 ? "ny-vecka" : ""}" `)).join("")}</tr>`).join("")}</tbody></table></div>
    <div class="legend" style="margin-top:8px"><span><i style="background:rgba(184,67,47,.7)"></i>Underbemanning</span><span><i style="background:var(--sand)"></i>I balans</span><span><i style="background:var(--resurs)"></i>Resurstid, utöver behovet</span></div>`;
}

// Staplar: planerad bemanning mot behov per dag (alla dygnsdelar).
function behovsstaplar(bem) {
  const N = bem.length, W = Math.max(520, N * 16 + 50), H = 200, vX = 30, hX = 6, top = 10, bas = H - 34;
  const delar = ["morgon", "kvall", "natt"];
  const tot = x => delar.reduce((s, d) => s + x.n[d], 0), beh = x => delar.reduce((s, d) => s + x.b[d], 0);
  const maxV = Math.max(1, ...bem.map(x => Math.max(tot(x), beh(x))));
  const kol = (W - vX - hX) / N, bred = Math.max(5, kol - 4), y = v => bas - v / maxV * (bas - top);
  let h = `<svg class="graf" viewBox="0 0 ${W} ${H}" role="img" aria-label="Planerad bemanning mot behov per dag">
    ${[0, Math.round(maxV / 2), maxV].map(v => `<line class="rutnat" x1="${vX}" x2="${W - hX}" y1="${y(v)}" y2="${y(v)}"/><text x="${vX - 6}" y="${y(v) + 4}" text-anchor="end">${v}</text>`).join("")}`;
  bem.forEach((x, i) => {
    const x0 = vX + i * kol + (kol - bred) / 2, t = tot(x), b = beh(x), vak = delar.reduce((s, d) => s + x.vak[d], 0);
    if (x.d % 7 > 4) h += `<rect x="${vX + i * kol}" y="${top}" width="${kol}" height="${bas - top}" style="fill:var(--helg)"/>`;
    // upp till behovet i grönt (rött vid vakans), resurstid utöver behovet i svart ovanpå
    const inom = Math.min(t, b);
    h += `<rect x="${x0}" y="${y(inom)}" width="${bred}" height="${Math.max(0, bas - y(inom))}" rx="3" style="fill:${vak ? "var(--kritisk)" : "var(--tackt)"};opacity:${vak ? .85 : .9}"/>`;
    if (t > b) h += `<rect x="${x0}" y="${y(t)}" width="${bred}" height="${Math.max(0, y(b) - y(t))}" rx="3" style="fill:var(--resurs);stroke:var(--text);stroke-width:.8"/>`;
    h += `<line x1="${x0 - 2}" x2="${x0 + bred + 2}" y1="${y(b)}" y2="${y(b)}" style="stroke:var(--text);stroke-width:2"/>`;
    h += `<rect class="traff" x="${vX + i * kol}" y="${top}" width="${kol}" height="${bas - top}" data-tips="Vecka ${Math.floor(x.d / 7) + 1} ${DAGAR[x.d % 7]}\nPlanerat ${t}, behov ${b}${vak ? ` – ${vak} saknas` : t > b ? ` – ${t - b} resurspass utöver behovet` : ""}"/>`;
    if (x.d % 7 === 0) h += `<text x="${vX + i * kol + 2}" y="${bas + 26}" style="font-weight:700;fill:var(--text)">v${Math.floor(x.d / 7) + 1}</text>`;
    if (N <= 42) h += `<text x="${vX + i * kol + kol / 2}" y="${bas + 13}" text-anchor="middle">${DAGAR[x.d % 7][0]}</text>`;
    if (N <= 42 && kol >= 14) h += `<text x="${vX + i * kol + kol / 2}" y="${y(Math.max(t, b)) - 4}" text-anchor="middle" style="font-size:10px;font-weight:700;fill:var(--text)">${t}</text>`;
  });
  return `<div class="rull">${h}<line class="axel" x1="${vX}" x2="${W - hX}" y1="${bas}" y2="${bas}"/></svg></div>
    <div class="legend" style="margin-top:6px"><span><i style="background:var(--tackt)"></i>Planerat, behovet täckt</span><span><i style="background:var(--resurs)"></i>Resurstid, utöver behovet</span><span><i style="background:var(--kritisk)"></i>Vakans</span><span><i style="background:var(--text);height:3px"></i>Behov</span></div>`;
}

function passring(n) {
  return ringdiagram([{ namn: "Dag", varde: n.pass.morgon, farg: "var(--morgon)" }, { namn: "Kväll", varde: n.pass.kvall, farg: "var(--kvall)" },
    { namn: "Natt", varde: n.pass.natt, farg: "var(--natt)" }], n.pass.morgon + n.pass.kvall + n.pass.natt);
}

function grafkort(k) {
  const n = nyckeltalFor(k), W = k.resultat.veckor;
  const kostnad = n.timkostnad ? linjegraf(n.perVecka.map(v => ({ x: "V" + v.vecka, y: v.timmar * n.timkostnad })), { format: v => kr(v), namn: "Personalkostnad per vecka",
    mal: k.indata.budget_timmar_vecka ? k.indata.budget_timmar_vecka * n.timkostnad : null })
    : linjegraf(n.perVecka.map(v => ({ x: "V" + v.vecka, y: v.timmar })), { format: v => sv(v, 0) + " h", namn: "Timmar per vecka", mal: k.indata.budget_timmar_vecka || null });
  return `<div class="tva">
    <section class="kort"><h2>Bemanningsgrad per vecka</h2><p class="dampad liten">Andel av behovet som är täckt. Guldlinjen är 100 %.</p>
      ${linjegraf(n.perVecka.map(v => ({ x: "V" + v.vecka, y: v.grad })), { min: Math.min(80, ...n.perVecka.map(v => v.grad)), max: 105, format: v => sv(v, 0) + " %", mal: 100, namn: "Bemanningsgrad per vecka" })}</section>
    <section class="kort"><h2>${n.timkostnad ? "Personalkostnad per vecka" : "Schemalagda timmar per vecka"}</h2><p class="dampad liten">${n.timkostnad ? `Med timkostnaden ${n.timkostnad} kr.` : `Ange en timkostnad för att se kronor.`}${k.indata.budget_timmar_vecka ? " Guldlinjen är budgeten." : ""}</p>${kostnad}</section>
  </div>
  <div class="tva">
    <section class="kort"><h2>Behov och planerad bemanning per dag</h2>${behovsstaplar(n.bem)}</section>
    <section class="kort"><h2>Passfördelning</h2>${passring(n)}</section>
  </div>

}

// ---------------------------------------------------------------- simulering
function analysstaplar(S, ordning, tk) {
  const stapel = (rubrik, f, enhet, klass) => {
    const max = Math.max(1, ...ordning.filter(n => S[n].konsekvenser?.status === "OK").map(n => f(n) || 0));
    return `<div><h3>${rubrik}</h3>${ordning.map(n => { const v = f(n) || 0, ok = S[n].konsekvenser?.status === "OK";
      return `<div class="hstapel"><span class="liten">${esc(S[n].namn)}</span>${ok ? `<div><i class="${klass}" style="width:${Math.max(v ? 2 : 0, v / max * 100)}%"></i></div><b class="liten">${sv(v, 1)}${enhet}</b>` : `<span class="liten minus" style="grid-column:span 2">Inget schema</span>`}</div>`; }).join("")}</div>`;
  };
  const k = n => S[n].konsekvenser || {};
  return `<div class="tva" style="margin-top:14px">${stapel("Vakanta pass", n => k(n).vakanta_pass, "", "vak")}${stapel("Överkapacitet, timmar per vecka", n => k(n).overkapacitet_timmar_vecka, " h", "over")}</div>
    <div style="margin-top:14px">${tk ? stapel("Personalkostnad per månad, tkr", n => S[n].kontrakt_timmar_vecka * tk * 52 / 12 / 1000, " tkr", "kost") : stapel("Kontrakterad tid, timmar per vecka", n => S[n].kontrakt_timmar_vecka, " h", "kost")}</div>`;
}

// Nuläge mot alternativ: skillnaden mot nuvarande bemanning, och förslag till förbättringar.
function nulage(S, ordning, tk, ikon = "") {
  const nu = S.findIndex(x => x.id === "nuvarande");
  if (nu < 0) return "";
  const k = n => S[n].konsekvenser || {}, alt = ordning.filter(n => n !== nu && k(n).status === "OK");
  if (k(nu).status !== "OK") {
    const ok = alt.length ? alt.slice().sort((a, b) => S[a].kontrakt_timmar_vecka - S[b].kontrakt_timmar_vecka)[0] : null;
    return `<section class="kort"><h2>Nuläge mot alternativ</h2><div class="banner varn">${ikon}<div><strong>Nuvarande bemanning går inte att lägga utan regelbrott</strong>
      ${ok != null ? `Det billigaste alternativet som går att lägga är <b>${esc(S[ok].namn)}</b> med ${sv(S[ok].kontrakt_timmar_vecka, 1)} h per vecka (nu ${sv(S[nu].kontrakt_timmar_vecka, 1)} h${tk ? `, ${S[ok].kontrakt_timmar_vecka >= S[nu].kontrakt_timmar_vecka ? "+" : "−"}${kr(Math.abs(S[ok].kontrakt_timmar_vecka - S[nu].kontrakt_timmar_vecka) * tk * 52 / 12)} per månad` : ""}).` : "Inget av alternativen gick heller att lägga."}</div></div></section>`;
  }
  if (!alt.length) return "";
  const matt = [
    ["Vakanta pass", n => k(n).vakanta_pass, v => `${v > 0 ? "+" : ""}${v}`, true],
    [tk ? "Kostnad per månad" : "Kontrakterad tid per vecka", n => tk ? S[n].kontrakt_timmar_vecka * tk * 52 / 12 : S[n].kontrakt_timmar_vecka, v => tk ? `${v > 0 ? "+" : "−"}${kr(Math.abs(v))}` : `${v > 0 ? "+" : ""}${sv(v, 1)} h`, true],
    ["Överkapacitet per vecka", n => k(n).overkapacitet_timmar_vecka, v => `${v > 0 ? "+" : ""}${sv(v, 1)} h`, true],
    ["Veckor utan blandning", n => k(n).veckor_utan_blandning, v => `${v > 0 ? "+" : ""}${v}`, true],
  ];
  const cell = (f, fmt, n) => {
    const d = f(n) - f(nu), max = Math.max(1e-9, ...alt.map(m => Math.abs(f(m) - f(nu))));
    const b = Math.abs(d) / max * 50, klass = Math.abs(d) < 1e-6 ? "" : d < 0 ? "battre" : "samre";
    return `<td><div class="divbar"><i class="${klass}" style="${d < 0 ? `right:50%;width:${b}%` : `left:50%;width:${b}%`}"></i></div><span class="liten ${klass}">${Math.abs(d) < 1e-6 ? "som nu" : fmt(d)}</span></td>`;
  };
  // förbättringsförslag
  const tips = [];
  const vakNu = k(nu).vakanta_pass;
  const farre = alt.filter(n => k(n).vakanta_pass < vakNu).sort((a, b) => k(a).vakanta_pass - k(b).vakanta_pass || S[a].kontrakt_timmar_vecka - S[b].kontrakt_timmar_vecka);
  if (farre.length) { const n = farre[0], dk = S[n].kontrakt_timmar_vecka - S[nu].kontrakt_timmar_vecka;
    tips.push(`<b>${esc(S[n].namn)}</b> minskar vakanserna från ${vakNu} till ${k(n).vakanta_pass}${Math.abs(dk) > 0.05 ? ` och ${dk > 0 ? "kostar" : "sparar"} ${tk ? kr(Math.abs(dk) * tk * 52 / 12) + " per månad" : sv(Math.abs(dk), 1) + " h per vecka"}` : " utan mer tid"}.`); }
  const billigare = alt.filter(n => k(n).vakanta_pass <= vakNu && S[n].kontrakt_timmar_vecka < S[nu].kontrakt_timmar_vecka - 0.05);
  if (billigare.length) { const n = billigare.sort((a, b) => S[a].kontrakt_timmar_vecka - S[b].kontrakt_timmar_vecka)[0];
    tips.push(`<b>${esc(S[n].namn)}</b> klarar behovet lika bra med ${sv(S[nu].kontrakt_timmar_vecka - S[n].kontrakt_timmar_vecka, 1)} h mindre per vecka.`); }
  if (k(nu).overkapacitet_timmar_vecka > 4) tips.push(`I nuläget är det ${sv(k(nu).overkapacitet_timmar_vecka, 1)} h per vecka mer i tjänst än behovet. Tiden kan läggas där behovet är störst, eller behovet höjas där det gör mest nytta.`);
  const vak = k(nu).vakanser || {};
  if (vak.fredagskvall) tips.push(`${vak.fredagskvall} vakanser i nuläget ligger på fredagskvällar. Fredagsregeln gör att den som arbetar fredag kväll också arbetar helgen; jämför alternativen som rör fredagen.`);
  if (vak.helg && !vak.fredagskvall) tips.push(`Vakanserna i nuläget ligger på helger. Fler personer per helg kräver fler som arbetar varannan helg.`);
  if (k(nu).veckor_utan_blandning > k(nu).personveckor * 0.3) tips.push(`Många veckor har bara morgnar eller bara kvällar. Inställningen ”Fördela morgon och kväll” under Inställningar kan sättas till stark.`);
  return `<section class="kort"><h2>Nuläge mot alternativ</h2><p class="dampad liten">Skillnad mot nuvarande bemanning. Grönt är bättre än i dag, rött sämre.</p>
    <div class="rull"><table class="nulage"><thead><tr><th></th>${matt.map(m => `<th>${m[0]}</th>`).join("")}</tr></thead><tbody>
    <tr class="nu"><td><b>Nuläge</b><div class="liten dampad">${esc(S[nu].sammanfattning)}</div></td>${matt.map(([, f], j) => `<td class="liten"><b>${j === 1 && tk ? kr(f(nu)) : sv(f(nu), 1) + (j === 2 || (j === 1 && !tk) ? " h" : "")}</b></td>`).join("")}</tr>
    ${alt.map(n => `<tr><td><b>${esc(S[n].namn)}</b></td>${matt.map(([, f, fmt]) => cell(f, fmt, n)).join("")}</tr>`).join("")}</tbody></table></div>
    ${tips.length ? `<h3>Förslag till förbättringar</h3><ul class="punkter">${tips.map(t => `<li>${t}</li>`).join("")}</ul>` : ""}</section>`;
}


// ---------------------------------------------------------------- OB och kostnad (kräver ob.js)
const obCache = new WeakMap();
// OB för alla i ett lagt schema: en period från startdatum och ett år (52 veckor). Null om ob.js saknas.
function obFor(res, indata) {
  if (typeof OB === "undefined") return null;
  let c = obCache.get(res);
  const prognos = OB.prognosFor(indata), start = indata.startdatum || OB.antagetStart(prognos);
  if (!c || c.start !== start || c.prognos !== prognos) { c = { start, prognos, antaget: !indata.startdatum, per: OB.forSchema(res.schema, start, { prognos }) }; obCache.set(res, c); }
  return c;
}

const KAT_TEXT = { A: "A – storhelg", B: "B – helg, fredag kväll, natt mot måndag", C: "C – vardagsnatt", D: "D – vardagskväll 19–22" };
const tim = min => sv(min / 60, 1) + " h";

function obKort(pid, res, indata, { installningar = "Period" } = {}) {

  return `<section class="kort"><h2>Timmar, OB och kostnad</h2>
    <p class="dampad liten">OB enligt AB 25 § 21, räknat på verkliga datum från ${esc(ob.start)}${ob.antaget ? ` (antaget – ange enhetens startdatum under ${installningar})` : ""}. Året är 52 veckor där schemat upprepas, med helgdagar och storhelger. Årets OB följer avtalets avrundning per kategori och månad.</p>
    <div class="kpi" style="margin-top:10px">
      <div><b>${tim(p.minuter)}</b><span>arbetstid på ${W} veckor</span></div>
      <div><b>${tim(p.minuter / W * 52)}</b><span>arbetstid per år</span></div>
      <div><b>${kr(x.ar.kr)}</b><span>OB per år${saknas ? " (delvis utan belopp)" : x.ar.prognosMin ? " (delvis prognos)" : ""}</span></div>
      ${tk ? `<div><b>${kr(lonAr + x.ar.kr)}</b><span>kostnad per år: ${kr(lonAr)} tid + ${kr(x.ar.kr)} OB</span></div>` : `<div><b>–</b><span>kostnad: ange timkostnad under ${installningar}</span></div>`}
    </div>
    <div class="rull" style="margin-top:12px"><table><thead><tr><th>OB-kategori</th><th class="tal">Tid, period</th><th class="tal">Kr, period</th><th class="tal">Tid, år</th><th class="tal">Kr, år</th></tr></thead><tbody>
      ${["A", "B", "C", "D"].map(rad).join("") || `<tr><td colspan="5" class="dampad">Ingen OB-tid.</td></tr>`}
      <tr><td><b>Totalt OB</b></td><td class="tal nw"><b>${tim(x.period.min)}</b></td><td class="tal nw"><b>${kr(x.period.kr)}</b></td><td class="tal nw"><b>${tim(x.ar.min)}</b></td><td class="tal nw"><b>${kr(x.ar.kr)}</b></td></tr>
      ${tk ? `<tr><td>Arbetstid × ${sv(tk, 0)} kr</td><td></td><td class="tal nw">${kr(lonPeriod)}</td><td></td><td class="tal nw">${kr(lonAr)}</td></tr>
      <tr><td><b>Kostnad totalt</b></td><td></td><td class="tal nw"><b>${kr(lonPeriod + x.period.kr)}</b></td><td></td><td class="tal nw"><b>${kr(lonAr + x.ar.kr)}</b></td></tr>` : ""}

    ${saknas ? `<p class="liten" style="color:var(--varn)">${tim(x.ar.saknarNiva)} OB-tid ligger efter 2027-03-31, där det inte finns något kontrollerat avtalsbelopp. Den tiden räknas utan kronor.</p>` : ""}
    <p class="dampad liten">Belopp: ${OB.NIVAER.map(n => `${n.kalla}`).join("; ")}${ob.prognos > 0 ? `; därefter prognos +${sv(ob.prognos, 1)} % per år` : ""}. Uppskattning för planering; utbetalningen följer lönesystemet och eventuella lokala avtal.</p></section>`;

// OB för ett pass i schemat, som text till verktygstips.
function obPassText(pid, d, res, indata) {
  const ob = obFor(res, indata); if (!ob) return "";
  const pp = ob.per[pid]?.perPass.find(x => x.dag === d); if (!pp || !pp.seg.length) return pp ? `\n${pp.datum}: ingen OB` : "";
  const sum = {}; pp.seg.forEach(s => (sum[s.kat] = (sum[s.kat] || 0) + s.min));
  return `\n${pp.datum}: OB ` + Object.entries(sum).map(([k, m]) => `${k.replace("_natt", " natt")} ${sv(m / 60, 2)} h`).join(", ");
}

// ---------------------------------------------------------------- dygnsvila och veckovila (visning)
// Visar vilan i ett lagt schema: tid mellan passen och längsta lediga tid per vecka från veckobrytet.
// Om reglerna följs avgör den fristående granskningen; det här är en överblick för användaren.
const DYGN_MIN = 1440, DAGNAMN = ["mån", "tis", "ons", "tor", "fre", "lör", "sön"];
const klockMin = t => { const [h, m] = t.split(":").map(Number); return h * 60 + m; };
function veckobrytMin(txt) {
  const m = /^(mån|tis|ons|tor|fre|lör|sön)\s+(\d{1,2}:\d{2})$/.exec(String(txt || "mån 00:00").trim());
  return m ? DAGNAMN.indexOf(m[1]) * DYGN_MIN + klockMin(m[2]) : 0;
}
function vila(rad, W, cykliskt = true, veckobryt = "mån 00:00") {
  const N = W * 7, L = N * DYGN_MIN, iv = [];
  rad.forEach((p, d) => { if (!p) return; const s = d * DYGN_MIN + klockMin(p.start); let e = d * DYGN_MIN + klockMin(p.slut); if (e <= s) e += DYGN_MIN; iv.push({ d, s, e, p }); });
  // tid mellan varje pass och nästa (över schemaskarven om schemat är cykliskt)
  const mellan = iv.map((x, i) => {
    const n = iv[i + 1] || (cykliskt && iv.length ? { ...iv[0], s: iv[0].s + L } : null);
    return n ? { dag: x.d, slut: x.p.slut, nastaDag: n.d, start: n.p.start, min: n.s - x.e } : null;
  }).filter(Boolean);
  // längsta lediga tid inom varje sjudagarsperiod från veckobrytet
  const alla = cykliskt ? [...iv.map(x => [x.s - L, x.e - L]), ...iv.map(x => [x.s, x.e]), ...iv.map(x => [x.s + L, x.e + L])] : iv.map(x => [x.s, x.e]);
  alla.sort((a, b) => a[0] - b[0]);
  const vb = veckobrytMin(veckobryt);
  const veckor = Array.from({ length: W }, (_, w) => {
    const a = w * 7 * DYGN_MIN + vb, b = a + 7 * DYGN_MIN;
    let langst = 0, fran = a, pos = a;
    for (const [s, e] of alla) { if (e <= a || s >= b) continue; const s2 = Math.max(s, a); if (s2 - pos > langst) { langst = s2 - pos; fran = pos; } pos = Math.max(pos, Math.min(e, b)); }
    if (b - pos > langst) { langst = b - pos; fran = pos; }
    return { vecka: w + 1, min: langst, fran };
  });
  return { mellan, veckor };
}
const tidText = t => { const d = ((Math.floor(t / DYGN_MIN) % 7) + 7) % 7, m = ((t % DYGN_MIN) + DYGN_MIN) % DYGN_MIN; return `${DAGNAMN[d]} ${String(Math.floor(m / 60)).padStart(2, "0")}:${String(m % 60).padStart(2, "0")}`; };
const regelVarde = (indata, k, std) => indata.regler?.[k] ?? std;

// ---------------------------------------------------------------- sammanställning per rad i schemat
// Räknas för de dagar som visas (en vecka eller hela perioden): pass, dag/kväll/natt, helgdagar, resurspass,
// aktiviteter, arbetstid, kortaste vila mellan pass och kortaste veckovila.
function radSumma(res, indata, pid, dagar, rs) {
  const rad = res.schema[pid], i = new Set(dagar), l = dagar.map(d => rad[d]).filter(Boolean);
  const v = vila(rad, res.veckor, res.cykliskt !== false, regelVarde(indata, "veckobryt", "mån 00:00"));
  const mel = v.mellan.filter(x => i.has(x.dag)), veckor = new Set(dagar.map(d => Math.floor(d / 7)));
  const vv = v.veckor.filter(x => veckor.has(x.vecka - 1));
  return { pass: l.length, morgon: l.filter(p => p.dygnsdel === "morgon").length, kvall: l.filter(p => p.dygnsdel === "kvall").length,
    natt: l.filter(p => p.dygnsdel === "natt").length, helg: dagar.filter(d => rad[d] && d % 7 > 4).length,
    resurs: dagar.filter(d => rad[d] && rs.has(pid + ":" + d)).length, akt: l.reduce((s, p) => s + (p.aktiviteter || []).length, 0),
    minuter: l.reduce((s, p) => s + (p.netto || 0), 0), dygnsvila: mel.length ? Math.min(...mel.map(x => x.min)) : null,
    veckovila: vv.length ? Math.min(...vv.map(x => x.min)) : null };
}
const SUMMAKOL = [["pass", "Pass", "Antal pass"], ["morgon", "D", "Dagpass (morgon)"], ["kvall", "K", "Kvällspass"], ["natt", "N", "Nattpass"],
  ["helg", "Hlg", "Arbetade helgdagar (lör och sön)"], ["resurs", "◼R", "Resurspass, utöver behovet"], ["akt", "★", "Aktiviteter (APT, utbildning …)"],
  ["minuter", "Tid", "Arbetstid"], ["dygnsvila", "Vila", "Kortaste vila mellan två pass"], ["veckovila", "V-vila", "Kortaste veckovila (sammanhängande ledighet per vecka)"]];
// vilka kolumner som behövs: natt och aktiviteter bara när de finns
function summaKol(res) {
  const rader = Object.values(res.schema);
  const natt = rader.some(r => r.some(p => p && p.dygnsdel === "natt")), akt = rader.some(r => r.some(p => p && p.aktiviteter));
  return SUMMAKOL.filter(([k]) => (k !== "natt" || natt) && (k !== "akt" || akt));
}
function summaHuvud(kol) { return kol.map(([k, t, tips], i) => `<th class="summa${i ? "" : " forsta"}" title="${tips}">${t}</th>`).join(""); }
function summaCeller(s, kol, indata) {
  const dv = regelVarde(indata, "dygnsvila_minuter", 660), wv = regelVarde(indata, "veckovila_minuter", 2160);
  const h = m => sv(m / 60, 1);
  return kol.map(([k], i) => {
    const v = s[k], f = i ? "" : " forsta";
    if (k === "minuter") return `<td class="summa nw${f}">${Math.floor(v / 60)}:${String(v % 60).padStart(2, "0")}</td>`;
    if (k === "dygnsvila" || k === "veckovila") {
      if (v == null) return `<td class="summa${f}">–</td>`;
      const fel = v < (k === "dygnsvila" ? dv : wv);
      return `<td class="summa nw${f}${fel ? " fel" : ""}" title="${fel ? "Under gränsen" : "Inom gränsen"} (${h(k === "dygnsvila" ? dv : wv)} h)">${h(v)} h</td>`;
    }
    return `<td class="summa${f}${k === "resurs" && v ? " res" : ""}">${k === "resurs" && v ? "◼ " : ""}${v || (k === "pass" ? 0 : "")}</td>`;
  }).join("");
}
// summa för raden "I tjänst": totalt för alla personer
function summaTotal(res, indata, dagar, rs, kol) {
  const t = {}; Object.keys(res.schema).forEach(pid => { const s = radSumma(res, indata, pid, dagar, rs); for (const [k] of kol) if (typeof s[k] === "number" && !k.includes("vila")) t[k] = (t[k] || 0) + s[k]; });
  return kol.map(([k], i) => `<td class="summa${i ? "" : " forsta"}">${k.includes("vila") ? "" : k === "minuter" ? Math.round((t[k] || 0) / 60) + " h" : t[k] || 0}</td>`).join("");
}

// Sammanställningen som egen tabell (för smala skärmar): en rad per person.
function summaTabell(res, indata, dagar, rs, rubrik) {
  const kol = summaKol(res), pers = Object.keys(res.schema);
  return `<div class="rull"><table class="schema summatabell"><thead><tr><th>${rubrik || ""}</th>${summaHuvud(kol).replace(/ forsta/g, "")}</tr></thead><tbody>
