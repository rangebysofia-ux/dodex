      for (const k of nyckel) ut.push({ dagar: k, fran: tider[del][0], till: tider[del][1], rast_minuter: tider[del][2], antal: +antal });
    }
  }
  return ut;
}

// ---------------------------------------------------------------- gränssnitt
// rita(ind, opt): hela sidan som HTML. opt.personalLank(pid) ger länk till medarbetaren; opt.import = true visar import.
function rita(ind, opt = {}) {
  const bb = ind.bemanningsbalans || {}, r = berakna(ind), v = r.vecka, p = r.period, H = r.heltid_timmar;
  const pass = bb.pass || [], ovrig = bb.ovrig_tid || [];
  const tal = (f, varde, steg, bredd = 90, attr = "") => `<input type="number" inputmode="decimal" step="${steg}" data-bb="${f}" value="${varde ?? ""}" style="width:${bredd}px"${attr}>`;
  const diffKlass = x => x < -0.005 ? "plus" : x > 0.005 ? "minus" : "";
  let h = `<section class="kort bb"><h2>1. Budget</h2>
    <div class="falt"><div><label>Årsarbetare (ÅA) i budget</label>${tal("budget_aa", ind.budget_timmar_vecka ? Math.round(ind.budget_timmar_vecka / H * 1000) / 1000 : "", "0.01", 120, ' placeholder="ingen"')}</div>
      <div><label>Buffert, %</label>${tal("buffert_procent", bb.buffert_procent ?? "", "0.5", 120, ' placeholder="0"')}</div>
      <div><label>Heltid per vecka</label><div class="mono" style="padding:8px 0">${sv(H)} h</div></div><div><label>Veckor i perioden</label><div class="mono" style="padding:8px 0">${r.veckor}</div></div></div>
    ${v.budget ? `<p class="dampad liten">Budget ${sv(v.budget.brutto)} h per vecka${v.budget.buffert ? `, buffert ${sv(v.budget.buffert)} h, kvar ${sv(v.budget.timmar)} h` : ""}.</p>` : ""}</section>`;

  h += `<section class="kort bb"><h2>2. Bemanningsbehov</h2>
    <p class="dampad liten">Pass som behövs, med tider, rast och antal personer per dag. Jour räknas med den arbetstid ni anger (till exempel 3 h av 6).</p>
    <div class="rull"><table class="form bbtabell"><thead><tr><th>Dagar</th><th>Från</th><th>Till</th><th>Rast, min</th><th>Antal</th><th>Typ</th><th>Räknad tid</th><th class="tal">Arbetstid</th><th></th></tr></thead><tbody>
    ${pass.map((x, i) => `<tr>
      <td><select data-bb="pass.${i}.dagar">${Object.entries(DAGVAL).map(([k, t]) => `<option value="${k}"${k === (x.dagar || "mån-sön") ? " selected" : ""}>${t}</option>`).join("")}</select></td>
      <td><input type="time" data-bb="pass.${i}.fran" value="${esc(x.fran)}"></td><td><input type="time" data-bb="pass.${i}.till" value="${esc(x.till)}"></td>
      <td>${tal(`pass.${i}.rast_minuter`, x.rast_minuter ?? 0, "5", 74)}</td><td>${tal(`pass.${i}.antal`, x.antal ?? 1, "1", 64)}</td>
      <td><select data-bb="pass.${i}.typ"><option value="pass"${x.typ !== "jour" ? " selected" : ""}>Pass</option><option value="jour"${x.typ === "jour" ? " selected" : ""}>Jour</option></select></td>
      <td>${x.typ === "jour" ? `<input type="time" data-bb="pass.${i}.raknad" value="${x.raknad_minuter != null ? String(Math.floor(x.raknad_minuter / 60)).padStart(2, "0") + ":" + String(x.raknad_minuter % 60).padStart(2, "0") : ""}" title="Arbetstid som räknas">` : ""}</td>
      <td class="tal mono">${hm(passtid(x) / 60)}</td><td><button class="liten fara" data-bbg="ta-bort-pass" data-n="${i}" aria-label="Ta bort">×</button></td></tr>`).join("")}
    </tbody></table></div>
    <p class="chips" style="margin-top:8px"><button data-bbg="nytt-pass">+ Pass</button><button data-bbg="nytt-jour">+ Jour</button>${opt.franBehov ? `<button data-bbg="fran-behov" title="Ett pass per dygnsdel och antal enligt behovet, med enhetens vanliga tider">Fyll i från behovet</button>` : ""}</p>
    <div class="rull"><table class="lista"><thead><tr><th></th>${DAGAR.map(d => `<th class="tal">${d}</th>`).join("")}<th class="tal">Vecka</th></tr></thead><tbody>
      <tr><td>Timmar</td>${r.dagar.map(d => `<td class="tal mono">${hm(d.timmar)}</td>`).join("")}<td class="tal mono"><b>${hm(v.bemanning.brukarnara)}</b></td></tr>
      <tr><td>Pass</td>${r.dagar.map(d => `<td class="tal">${sv(d.pass)}</td>`).join("")}<td class="tal"><b>${sv(r.dagar.reduce((s, d) => s + d.pass, 0))}</b></td></tr></tbody></table></div></section>`;

  h += `<section class="kort bb"><h2>3. Personal</h2>
    <p class="dampad liten">Hämtas från enhetens medarbetare. Antal pass är det motorn räknar med (eller det ni har angett).</p>
    <div class="rull"><table class="lista"><thead><tr><th>Id</th><th class="tal">SSG</th><th>Arbetar</th><th class="tal">Helger</th><th class="tal">Pass/period</th><th class="tal">Tim/vecka</th><th class="tal">Tim/period</th></tr></thead><tbody>
    ${r.personal.map(x => `<tr><td>${opt.personalLank ? opt.personalLank(x.id) : esc(x.id)}</td><td class="tal">${sv(x.grad * 100, 0)} %</td><td>${x.natt ? "Natt" : "Dag/kväll"}</td><td class="tal">${esc(x.helgfrekvens)}</td><td class="tal">${x.pass}</td><td class="tal">${sv(x.timmar_vecka)}</td><td class="tal">${sv(x.timmar_period)}</td></tr>`).join("")}
    <tr class="summa"><td><b>Summa</b></td><td class="tal"><b>${sv(v.personal.aa)} ÅA</b></td><td></td><td class="tal"><b>${sv(p.personal.helg)}</b></td><td class="tal"><b>${p.personal.pass}</b></td><td class="tal"><b>${sv(v.personal.timmar)}</b></td><td class="tal"><b>${sv(p.personal.timmar)}</b></td></tr></tbody></table></div></section>`;

  h += `<section class="kort bb"><h2>4. Övrig arbetstid</h2>
    <p class="dampad liten">Arbetstid som inte ingår i bemanningskravet, till exempel APT, utbildning och schemaombud.</p>
    <div class="rull"><table class="form bbtabell"><thead><tr><th>Aktivitet</th><th>Tillfällen/år</th><th>Tim/tillfälle</th><th>Antal pers</th><th class="tal">H/vecka</th><th class="tal">H/period</th><th class="tal">H/år</th><th></th></tr></thead><tbody>
    ${ovrig.map((o, i) => `<tr><td><input data-bb="ovrig.${i}.namn" value="${esc(o.namn)}" style="width:170px"></td><td>${tal(`ovrig.${i}.tillfallen_ar`, o.tillfallen_ar, "1", 80)}</td><td>${tal(`ovrig.${i}.timmar`, o.timmar, "0.5", 80)}</td><td>${tal(`ovrig.${i}.personer`, o.personer, "1", 70)}</td>
      <td class="tal">${sv(r.ovrig[i].timmar_vecka)}</td><td class="tal">${sv(r.ovrig[i].timmar_period)}</td><td class="tal">${sv(r.ovrig[i].timmar_ar, 1)}</td><td><button class="liten fara" data-bbg="ta-bort-ovrig" data-n="${i}" aria-label="Ta bort">×</button></td></tr>`).join("")}
    ${ovrig.length ? `<tr class="summa"><td><b>Summa</b></td><td></td><td></td><td></td><td class="tal"><b>${sv(v.bemanning.ovrig)}</b></td><td class="tal"><b>${sv(v.bemanning.ovrig * r.veckor)}</b></td><td class="tal"><b>${sv(r.ovrig.reduce((s, o) => s + o.timmar_ar, 0), 1)}</b></td><td></td></tr>` : ""}
    </tbody></table></div>
    <p class="chips" style="margin-top:8px"><button data-bbg="ny-ovrig">+ Rad</button>${(ind.aktiviteter || []).length ? `<button data-bbg="fran-aktiviteter">Hämta från aktiviteterna i schemat</button>` : ""}</p></section>`;

  const rad = (namn, tim, aa, klass = "") => `<tr class="${klass}"><td>${namn}</td><td class="tal mono">${tim}</td><td class="tal mono">${aa}</td></tr>`;
  h += `<section class="kort bb"><h2>5. Resultat</h2>
    <div class="banner ${r.vakanta_timmar.vecka > 0.005 ? "dalig" : r.overkapacitet.vecka > 0.005 ? "varn" : "ok"}"><strong>${r.vakanta_timmar.vecka > 0.005 ? `Personalen räcker inte: ${sv(r.vakanta_timmar.vecka)} vakanta timmar per vecka` : r.overkapacitet.vecka > 0.005 ? `Överkapacitet: ${sv(r.overkapacitet.vecka)} h per vecka (${sv(r.overkapacitet.period)} h per period)` : "Personalen motsvarar bemanningen"}</strong>
      <span class="liten">${v.budget ? `Bemanningen är ${sv(Math.abs(v.diff_budget.timmar))} h per vecka ${v.diff_budget.timmar < 0 ? "över" : "under"} budget.` : "Ange årsarbetare i budget för att jämföra med budgeten."}</span></div>
    <div class="tva" style="margin-top:12px"><div><h3>Vecka</h3><table class="lista"><thead><tr><th></th><th class="tal">Timmar</th><th class="tal">ÅA</th></tr></thead><tbody>
      ${v.budget ? rad("Budget, inklusive buffert", sv(v.budget.timmar), sv(v.budget.timmar / H, 3)) : ""}
      ${rad("Bemanning", sv(v.bemanning.timmar), sv(v.bemanning.aa, 3))}
      ${rad("<span class=\"dampad\">varav brukarnära</span>", sv(v.bemanning.brukarnara), "")}${rad("<span class=\"dampad\">varav övrig arbetstid</span>", sv(v.bemanning.ovrig), "")}
      ${rad("Personalresurser", sv(v.personal.timmar), sv(v.personal.aa, 3))}
      ${v.budget ? rad("Budget − bemanning", `<span class="${diffKlass(v.diff_budget.timmar) === "plus" ? "minus" : ""}">${sv(v.diff_budget.timmar)}</span>`, sv(v.diff_budget.aa, 3), "summa") : ""}
      ${rad("Bemanning − personal", `<span class="${diffKlass(v.diff_personal.timmar)}">${sv(v.diff_personal.timmar)}</span>`, `${sv(-v.diff_personal.aa, 3)}`, "summa")}
      </tbody></table><p class="dampad liten">Negativt för bemanning − personal betyder överkapacitet (${sv(v.diff_personal.procent, 1)} % mer personal än bemanning).</p></div>
    <div><h3>Period (${r.veckor} veckor)</h3><table class="lista"><thead><tr><th></th><th class="tal">Timmar</th><th class="tal">Pass</th><th class="tal">Snitt/pass</th><th class="tal">Helg</th></tr></thead><tbody>
      <tr><td>Bemanningskrav</td><td class="tal mono">${sv(p.bemanning.timmar)}</td><td class="tal">${sv(p.bemanning.pass)}</td><td class="tal mono">${hm(p.bemanning.snitt_pass_timmar)}</td><td class="tal">${sv(p.bemanning.helg)}</td></tr>
      <tr><td>Personalresurser</td><td class="tal mono">${sv(p.personal.timmar)}</td><td class="tal">${p.personal.pass}</td><td class="tal mono">${hm(p.personal.snitt_pass_timmar)}</td><td class="tal">${sv(p.personal.helg)}</td></tr>
      ${p.diff_budget_timmar != null ? `<tr class="summa"><td>Budget − bemanning</td><td class="tal mono">${sv(p.diff_budget_timmar)}</td><td></td><td></td><td></td></tr>` : ""}
      <tr class="summa"><td>Personal − krav</td><td class="tal mono">${sv(-p.diff_personal.timmar)}</td><td class="tal">${sv(p.diff_personal.pass)}</td><td class="tal mono">${hm(p.diff_personal.snitt_pass_timmar)}</td><td class="tal">${sv(p.diff_personal.helg)}</td></tr>
      </tbody></table><p class="dampad liten">Helg: personer per helgdag som behövs, mot personal som arbetar helg (varannan helg räknas som en halv). Snitt/pass i timmar:minuter.</p></div></div>
    <p class="dampad liten" style="margin-top:8px">Bemanningsbalansen påverkar inte schemaläggningen. Den räknar som verksamhetens Excel-mall: budget i årsarbetare, bemanningsbehov per dag, personal och övrig arbetstid.</p></section>`;
  if (opt.import) h += `<section class="kort bb"><h2>Importera från Excel</h2>
    <p class="dampad liten">Läs in en ifylld bemanningsbalans (Excel-mallen). Budget, buffert, pass, jour och övrig arbetstid ersätter det som står här. Medarbetarna kan också läsas in; namnen ersätts då med id-koder och sparas inte.</p>
    <p class="chips"><input type="file" id="bb-fil" accept=".xlsx"><label class="check"><input type="checkbox" id="bb-personal"> Ersätt medarbetarna med Excel-filens</label><button data-bbg="importera">Importera</button></p></section>`;
  return h;
}

// koppla(rot, ind, andrad, opt): kopplar fälten. andrad(rita) anropas efter varje ändring; opt.importera(fil, personal) för import.
function koppla(rot, ind, andrad, opt = {}) {
  const bb = () => (ind.bemanningsbalans = ind.bemanningsbalans || { pass: [], ovrig_tid: [] });
  rot.querySelectorAll("[data-bb]").forEach(el => el.onchange = () => {
    const f = el.dataset.bb.split("."), v = el.value, b = bb();
    if (f[0] === "budget_aa") { const x = parseFloat(v.replace(",", ".")); if (x > 0) ind.budget_timmar_vecka = Math.round(x * (ind.heltid_minuter_per_vecka || 2220) / 60 * 100) / 100; else delete ind.budget_timmar_vecka; }
    else if (f[0] === "buffert_procent") { const x = parseFloat(v.replace(",", ".")); if (x > 0) b.buffert_procent = x; else delete b.buffert_procent; }
    else if (f[0] === "pass") {
      const p = b.pass[+f[1]], k = f[2];
      if (k === "rast_minuter" || k === "antal") p[k] = Math.max(0, parseFloat(v.replace(",", ".")) || 0);
      else if (k === "typ") { if (v === "jour") { p.typ = "jour"; if (p.raknad_minuter == null) p.raknad_minuter = Math.round(passtid({ ...p, raknad_minuter: null }) / 2); } else { delete p.typ; delete p.raknad_minuter; } }
      else if (k === "raknad") { if (v) p.raknad_minuter = min(v); else delete p.raknad_minuter; }
      else if (v) p[k] = v;
    } else if (f[0] === "ovrig") {
      const o = b.ovrig_tid[+f[1]], k = f[2];
      o[k] = k === "namn" ? v : Math.max(0, parseFloat(v.replace(",", ".")) || 0);
    }
    andrad(true);
  });
  rot.querySelectorAll("[data-bbg]").forEach(el => el.onclick = async ev => {
    ev.preventDefault();
    const b = bb(), n = +el.dataset.n;
    switch (el.dataset.bbg) {
      case "nytt-pass": (b.pass = b.pass || []).push({ dagar: "vardag", fran: "07:00", till: "16:00", rast_minuter: 30, antal: 1 }); break;
      case "nytt-jour": (b.pass = b.pass || []).push({ dagar: "mån-sön", fran: "00:00", till: "06:00", rast_minuter: 0, antal: 1, typ: "jour", raknad_minuter: 180 }); break;
      case "ta-bort-pass": b.pass.splice(n, 1); break;
      case "ny-ovrig": (b.ovrig_tid = b.ovrig_tid || []).push({ namn: "", tillfallen_ar: 10, timmar: 2, personer: 1 }); break;
      case "ta-bort-ovrig": b.ovrig_tid.splice(n, 1); break;
      case "fran-aktiviteter": {
        const nya = franAktiviteter(ind), namn = new Set((b.ovrig_tid || []).map(o => o.namn));
        b.ovrig_tid = (b.ovrig_tid || []).concat(nya.filter(o => !namn.has(o.namn))); break;
      }
      case "fran-behov": if (opt.franBehov) b.pass = opt.franBehov(); break;
      case "importera": {
        const fil = rot.querySelector("#bb-fil")?.files?.[0];
        if (!fil || !opt.importera) return;
        await opt.importera(fil, rot.querySelector("#bb-personal")?.checked);
        return;
      }
      default: return;
    }
    andrad(true);
  });
}

return { berakna, rita, koppla, franAktiviteter, behovSomPass, passtid };
})();
if (typeof module !== "undefined") module.exports = BB;
</script>
<script>"use strict";
// Startguiden: det första man möter. ”Vad vill du göra?” och en frågeguide som ställer en fråga i taget:
// gruppen, antal medarbetare, sysselsättning, undantag, behov, tider för passen, period, och till sist hur
// schemat ska läggas (🤖 lägger det, eller man lägger det själv). Delas av webben och lättversionen.
// Guiden räknar bara fram förslag och tips; schemat läggs och granskas som vanligt efteråt.

const GUIDE = (() => {
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const sv = (x, d = 1) => (Math.round(x * 10 ** d) / 10 ** d).toString().replace(".", ",");
  const HELTID = 37, PASS_PER_VECKA = 4.75;
  const ARBETAR = { "morgon,kvall": "Dag och kväll", morgon: "Bara dag", kvall: "Bara kväll", natt: "Natt" };
  const HELGER = { "2/4": "Varannan helg", "1/4": "Var fjärde", "3/4": "Tre av fyra", alla: "Alla helger", ingen: "Inga helger" };
  const FRAGOR = ["Gruppen", "Medarbetare", "Sysselsättning", "Undantag", "Behov", "Tider", "Period", "Lägg schemat"];
  const SISTA = FRAGOR.length;

  function ny() {
    return { steg: 1, namn: "", antalDag: 8, antalNatt: 2, gradSatt: "samma", grad: 100, budget: "", personer: [], harUndantag: false,
      behov: { vardag: { morgon: 2, kvall: 2, natt: 1 }, helg: { morgon: 2, kvall: 2, natt: 1 } },
      tider: { morgon: "07:00", kvall: "22:00", nattStart: "21:45", nattSlut: "06:45" }, veckor: 4, startdatum: "", timkostnad: "" };
  }

  // Personlistan följer antalet: A1, A2 … för dag och kväll, N1, N2 … för natt. Ändrade värden ligger kvar.
  function synka(g) {
    const gamla = new Map(g.personer.map(p => [p.id, p]));
    g.personer = [...Array.from({ length: g.antalDag }, (_, i) => `A${i + 1}`), ...Array.from({ length: g.antalNatt }, (_, i) => `N${i + 1}`)]
      .map(id => gamla.get(id) || { id, grad: g.grad, arbetar: id[0] === "N" ? "natt" : "morgon,kvall", helg: "2/4" });
  }

  const nattTimmarPass = g => { const m = t => { const [h, x] = t.split(":").map(Number); return h * 60 + x; };
    let d = m(g.tider.nattSlut) - m(g.tider.nattStart); if (d <= 0) d += 1440; return d / 60; };

  // Vad behovet kräver: pass och timmar per vecka, och minsta antal med varannan helg och fredagsregeln.
  function berakna(g) {
    const v = g.behov.vardag, h = g.behov.helg;
    const dagPass = 5 * (v.morgon + v.kvall) + 2 * (h.morgon + h.kvall), natter = 5 * v.natt + 2 * h.natt;
    const dagTimmar = dagPass * HELTID / PASS_PER_VECKA, nattTimmar = natter * nattTimmarPass(g);
    const perHelg = h.morgon + Math.max(h.kvall, v.kvall);
    return { dagPass, natter, dagTimmar, nattTimmar, behovTimmar: dagTimmar + nattTimmar, perHelg, fredagStyr: v.kvall > h.kvall,
      minDag: dagPass ? Math.max(Math.ceil(dagPass / PASS_PER_VECKA), perHelg * 2) : 0,
      minNatt: natter ? Math.max(Math.ceil(nattTimmar / HELTID), Math.max(h.natt, v.natt) * 2) : 0 };
  }

  const steg5 = x => Math.max(0.05, Math.min(1, Math.floor(x / 0.05 + 1e-9) * 0.05));
  // Grad per person i procent, efter valt sätt: samma för alla, var och en för sig, eller fördela en budget.
  function grader(g) {
    synka(g);
    if (g.gradSatt === "olika") return Object.fromEntries(g.personer.map(p => [p.id, p.grad]));
    if (g.gradSatt === "budget" && Number(g.budget)) {
      const r = berakna(g), natt = g.antalNatt ? Math.min(1, Math.ceil(r.nattTimmar / HELTID / g.antalNatt * 20) / 20) : 0;
      const dag = g.antalDag ? steg5((Number(g.budget) - natt * g.antalNatt * HELTID) / HELTID / g.antalDag) : 0;
      return Object.fromEntries(g.personer.map(p => [p.id, Math.round((p.id[0] === "N" ? natt : dag) * 100)]));
    }
    return Object.fromEntries(g.personer.map(p => [p.id, g.grad]));
  }
  const kontrakt = g => Object.values(grader(g)).reduce((s, x) => s + x / 100 * HELTID, 0);

  function indata(g) {
    const gr = grader(g);
    const personal = g.personer.map(p => {
      const ut = { id: p.id, grad: Math.round(gr[p.id]) / 100 };
      const arb = g.harUndantag || p.id[0] === "N" ? p.arbetar : p.id[0] === "N" ? "natt" : "morgon,kvall";
      if (arb !== "morgon,kvall") ut.dygnsdelar = arb.split(",");
      if (g.harUndantag && p.helg !== "2/4") ut.helgfrekvens = p.helg;
      return ut;
    });
    const ut = { enhet: g.namn || "Ny enhet", veckor: Number(g.veckor) || 4, cykliskt: true, behov: structuredClone(g.behov), personal, onskemal: [] };
    const regler = {};
    if (g.tider.morgon !== "07:00") regler.morgon_start = g.tider.morgon;
    if (g.tider.kvall !== "22:00") regler.kvall_slut = g.tider.kvall;
    if (Object.keys(regler).length) ut.regler = regler;
    if (g.tider.nattStart !== "21:45" || g.tider.nattSlut !== "06:45") ut.nattpass = [{ id: "N", start: g.tider.nattStart, slut: g.tider.nattSlut, maltidsuppehall: true }];
    if (g.startdatum) ut.startdatum = g.startdatum;
    if (Number(g.budget)) ut.budget_timmar_vecka = Number(g.budget);
    if (Number(g.timkostnad)) ut.timkostnad_kr = Number(g.timkostnad);
    return ut;
  }

  // Den tomma enheten som AI-assistenten fyller i tillsammans med användaren.
  function tomIndata(namn) { return { enhet: namn || "Ny enhet", veckor: 4, cykliskt: true, behov: {}, personal: [], onskemal: [] }; }
  const AI_START = "Jag vill lägga in en ny enhet. Fråga mig steg för steg om medarbetare, sysselsättningsgrad, undantag, bemanningsbehov och tider, och föreslå sedan indata som jag kan godkänna.";

  // Ett tomt grundschema för den som vill lägga schemat själv.
  function tomtSchema(ind) { const N = (ind.veckor || 4) * 7; return Object.fromEntries(ind.personal.map(p => [p.id, Array(N).fill(null)])); }

  // ---------------------------------------------------------------- startsidan
  function val({ harEnheter = false } = {}) {
    const ruta = (g, ikon, rubrik, text, extra = "") => `<button class="valruta${extra}" data-guide="${g}"><span class="valikon" aria-hidden="true">${ikon}</span><b>${rubrik}</b><span>${text}</span></button>`;
    return `<section class="kort"><h1>Vad vill du göra?</h1><p class="dampad" style="margin:6px 0 14px">Välj en väg. Allt går att ändra efteråt.</p>
      <div class="valrutor">
        ${ruta("ny", "✚", "Skapa ny enhet", "Svara på några frågor om gruppen, behovet och tiderna. Välj sedan om 🤖 lägger schemat eller om du gör det själv.", " huvud")}
        ${ruta("ai", "🤖", "Berätta för AI-assistenten", "Börja med en tom enhet och beskriv med egna ord. Assistenten föreslår, du godkänner.")}
        ${ruta("exempel", "◎", "Börja från ett exempel", "Färdiga testfall att pröva systemet med.")}
        ${harEnheter ? ruta("enheter", "▤", "Fortsätt med en enhet", "Öppna en enhet du redan har.") : ""}
      </div>
      <details class="nyttigt"><summary>Bra att veta</summary><ul class="punkter liten">
        <li>Reglerna (dygnsvila 11 h, veckovila 36 h, rast, varannan helg) gäller från start. Ändra under Inställningar eller Regler.</li>
        <li>Behovet är det som styr. Räcker inte personalen blir det en synlig vakans, aldrig ett avtalsbrott.</li>
        <li>Med 4,75 pass per vecka går 4, 8 och 12 veckor jämnt ut. Vid till exempel 6 veckor får hälften 28 pass och hälften 29.</li>
        <li>Ange startdatum och timkostnad så räknas OB och personalkostnad.</li>
        <li>🤖 finns på varje sida. Fråga till exempel ”hur många kvällar har var och en?”.</li>
      </ul></details></section>`;
  }

  // ---------------------------------------------------------------- frågorna
  function html(g) {
    synka(g);
    const r = berakna(g), gr = grader(g), k = kontrakt(g), budget = Number(g.budget) || 0;
    const tips = (t, varn = false) => `<div class="guidetips${varn ? " varn" : ""}">${varn ? "⚠" : "💡"} ${t}</div>`;
    const fraga = (t, under = "") => `<p class="guidefraga-nr">Fråga ${g.steg} av ${SISTA}</p><h2 class="guidefraga">${t}</h2>${under ? `<p class="dampad">${under}</p>` : ""}`;
    const valknapp = (falt, varde, text, aktiv) => `<button class="valknapp" data-guide="satt" data-falt="${falt}" data-varde="${varde}" aria-pressed="${aktiv}">${text}</button>`;
    const tal = (id, falt, varde, etikett, max = 80) => `<div><label for="${id}">${etikett}</label><input id="${id}" type="number" min="0" max="${max}" inputmode="numeric" data-gf="${falt}" value="${varde}"></div>`;
    let h = "";
    switch (g.steg) {
      case 1: h = fraga("Vad heter gruppen?", "Till exempel avdelningen, boendet eller arbetslaget.") +
        `<input id="g-namn" data-gf="namn" value="${esc(g.namn)}" placeholder="Solgården avd 2" style="max-width:420px">`; break;
      case 2: h = fraga("Hur många medarbetare är det i gruppen?") +
        `<div class="falt" style="max-width:520px">${tal("g-dk", "antalDag", g.antalDag, "Arbetar dag och kväll")}${tal("g-natt", "antalNatt", g.antalNatt, "Arbetar natt", 40)}</div>` +
        tips(`Ni är ${g.antalDag + g.antalNatt} totalt. De får id-koder (A1, A2 … och N1, N2 …) i stället för namn.`); break;
      case 3: h = fraga("Vilken sysselsättningsgrad har de?") +
        `<div class="valknappar">${valknapp("gradSatt", "samma", "Samma för alla", g.gradSatt === "samma")}${valknapp("gradSatt", "olika", "Olika per person", g.gradSatt === "olika")}${valknapp("gradSatt", "budget", "Fördela en budget i timmar", g.gradSatt === "budget")}</div>` +
        (g.gradSatt === "samma" ? `<div style="max-width:220px;margin-top:12px"><label for="g-grad">Sysselsättningsgrad, %</label><input id="g-grad" type="number" min="10" max="100" step="5" data-gf="grad" value="${g.grad}"></div>` : "") +
        (g.gradSatt === "budget" ? `<div style="max-width:260px;margin-top:12px"><label for="g-budget">Timmar per vecka i budget</label><input id="g-budget" type="number" min="0" step="0.5" inputmode="decimal" data-gf="budget" value="${esc(g.budget)}"></div>` : "") +
        (g.gradSatt === "olika" ? `<div class="rull" style="margin-top:12px"><table class="guidetabell"><thead><tr><th>Medarbetare</th><th>Grad %</th></tr></thead><tbody>${g.personer.map((p, i) => `<tr><th>${esc(p.id)}</th><td><input type="number" min="10" max="100" step="5" data-gp="${i}.grad" value="${p.grad}" aria-label="Grad för ${esc(p.id)}"></td></tr>`).join("")}</tbody></table></div>` : "") +
        tips(`Kontrakterad tid blir <b>${sv(k)} h per vecka</b> (${sv(k / HELTID, 2)} årsarbetare)${budget && g.gradSatt === "budget" ? ` av budgeten ${sv(budget)} h` : ""}.`); break;
      case 4: h = fraga("Finns det undantag?", "Till exempel någon som bara arbetar kväll, bara natt, eller inte varannan helg.") +
        `<div class="valknappar">${valknapp("harUndantag", "nej", "Nej, alla arbetar som vanligt", !g.harUndantag)}${valknapp("harUndantag", "ja", "Ja, några har undantag", g.harUndantag)}</div>` +
        (g.harUndantag ? `<div class="rull" style="margin-top:12px"><table class="guidetabell"><thead><tr><th>Medarbetare</th><th>Arbetar</th><th>Helger</th></tr></thead><tbody>${g.personer.map((p, i) => `<tr><th>${esc(p.id)}</th>
          <td><select data-gp="${i}.arbetar" aria-label="Arbetar, ${esc(p.id)}">${Object.entries(ARBETAR).map(([a, t]) => `<option value="${a}"${p.arbetar === a ? " selected" : ""}>${t}</option>`).join("")}</select></td>
          <td><select data-gp="${i}.helg" aria-label="Helger, ${esc(p.id)}">${Object.entries(HELGER).map(([a, t]) => `<option value="${a}"${p.helg === a ? " selected" : ""}>${t}</option>`).join("")}</select></td></tr>`).join("")}</tbody></table></div>` +
          tips("Undantag från varannan helg görs per person och visas som undantag i schemat. Enhetens regel är fortfarande varannan helg.") : tips("Alla med dag och kväll arbetar båda, och alla arbetar varannan helg.")); break;
      case 5: h = fraga("Hur ser behovet ut i veckan?", "Hur många behöver vara i tjänst per pass?") +
        `<div class="rull"><table class="guidetabell"><thead><tr><th></th><th>Dag</th><th>Kväll</th><th>Natt</th></tr></thead><tbody>
        ${[["vardag", "Vardag (mån–fre)"], ["helg", "Helg (lör–sön)"]].map(([d, t]) => `<tr><th>${t}</th>${["morgon", "kvall", "natt"].map(x => `<td><input type="number" min="0" max="30" inputmode="numeric" data-gb="${d}.${x}" value="${g.behov[d][x]}" aria-label="${t} ${x}"></td>`).join("")}</tr>`).join("")}</tbody></table></div>` +
        tips(`Det blir ${r.dagPass} dag- och kvällspass och ${r.natter} nätter per vecka, ungefär <b>${sv(r.behovTimmar)} h per vecka</b>. För helgerna behövs minst <b>${r.minDag} med dag och kväll</b> och <b>${r.minNatt} med natt</b>${r.fredagStyr ? " (fredagskvällen styr: den som arbetar fredag kväll arbetar helgen)" : ""}.`) +
        (g.antalDag < r.minDag || g.antalNatt < r.minNatt ? tips(`Ni är ${g.antalDag} med dag och kväll och ${g.antalNatt} med natt. Färre än minsta antal ger vakanser på helgerna. <button class="liten" data-guide="minsta">Ändra till ${r.minDag} och ${r.minNatt}</button>`, true) : "") +
        (k < r.behovTimmar - 0.5 ? tips(`Kontrakterad tid (${sv(k)} h) är mindre än behovet (${sv(r.behovTimmar)} h). Räkna med vakanser.`, true) : ""); break;
      case 6: h = fraga("Vilka tider gäller för passen?") +
        `<div class="falt" style="max-width:640px"><div><label for="g-ms">Dagpass börjar</label><input id="g-ms" type="time" data-gt="morgon" value="${g.tider.morgon}"></div>
          <div><label for="g-ks">Kvällspass slutar</label><input id="g-ks" type="time" data-gt="kvall" value="${g.tider.kvall}"></div>
          <div><label for="g-ns">Nattpass börjar</label><input id="g-ns" type="time" data-gt="nattStart" value="${g.tider.nattStart}"></div>
          <div><label for="g-ne">Nattpass slutar</label><input id="g-ne" type="time" data-gt="nattSlut" value="${g.tider.nattSlut}"></div></div>` +
        tips("Dagpassets slut och kvällspassets start anpassas efter sysselsättningsgraden, med passbyte mellan kl. 12 och 18. Nattpasset är " + sv(nattTimmarPass(g)) + " h med måltidsuppehåll."); break;
      case 7: h = fraga("Hur lång är schemaperioden, och när börjar den?") +
        `<div class="falt" style="max-width:640px"><div><label for="g-veckor">Period</label><select id="g-veckor" data-gf="veckor">${[4, 6, 8, 12].map(v => `<option value="${v}"${+g.veckor === v ? " selected" : ""}>${v} veckor</option>`).join("")}</select></div>
          <div><label for="g-start">Startdatum, måndag (valfritt)</label><input id="g-start" type="date" data-gf="startdatum" value="${esc(g.startdatum)}"></div>
          <div><label for="g-tk">Timkostnad, kr (valfritt)</label><input id="g-tk" type="number" min="0" inputmode="decimal" data-gf="timkostnad" value="${esc(g.timkostnad)}"></div></div>` +
        tips("Startdatum och timkostnad behövs för OB och personalkostnad. De kan anges senare."); break;
      default: h = fraga("Hur vill du lägga schemat?") +
        `<ul class="punkter liten"><li><b>${esc(g.namn || "Ny enhet")}</b>, ${g.veckor} veckor${g.startdatum ? ` från ${esc(g.startdatum)}` : ""}</li>
          <li>${g.antalDag} med dag och kväll, ${g.antalNatt} med natt, ${sv(k)} h kontrakterat per vecka${g.harUndantag ? `, ${g.personer.filter(p => p.helg !== "2/4" || (p.id[0] === "A" && p.arbetar !== "morgon,kvall")).length} med undantag` : ""}</li>
          <li>Behov vardag ${g.behov.vardag.morgon}/${g.behov.vardag.kvall}/${g.behov.vardag.natt}, helg ${g.behov.helg.morgon}/${g.behov.helg.kvall}/${g.behov.helg.natt} (dag/kväll/natt), ungefär ${sv(r.behovTimmar)} h per vecka</li>
          <li>Dag från ${g.tider.morgon}, kväll till ${g.tider.kvall}, natt ${g.tider.nattStart}–${g.tider.nattSlut}</li></ul>
        <div class="valrutor" style="margin-top:14px">
          <button class="valruta huvud" data-guide="skapa-ai"><span class="valikon" aria-hidden="true">🤖</span><b>Låt AI lägga schemat</b><span>Ett schema som följer reglerna, med så få vakanser som möjligt och jämn fördelning. Du kan justera det efteråt.</span></button>
          <button class="valruta" data-guide="skapa-manuellt"><span class="valikon" aria-hidden="true">✋</span><b>Lägg schemat själv</b><span>Börja med ett tomt schema och lägg passen. Varje pass granskas direkt mot reglerna.</span></button>
        </div>
        <p style="margin-top:12px"><button class="lank" data-guide="skapa">Bara skapa enheten, lägg schemat senare</button></p>`;
    }
    const nav = `<div class="guidenav">${g.steg > 1 ? `<button data-guide="tillbaka">‹ Tillbaka</button>` : `<button data-guide="avbryt">Avbryt</button>`}
      ${g.steg < SISTA ? `<button class="primar" data-guide="nasta">Nästa ›</button>` : ""}</div>`;
    const prickar = `<div class="guideprickar" aria-hidden="true">${FRAGOR.map((t, i) => `<i class="${i + 1 === g.steg ? "aktiv" : i + 1 < g.steg ? "klar" : ""}" title="${t}"></i>`).join("")}</div>`;
    return `<section class="kort guide">${prickar}${h}${nav}</section>`;
  }

  // Läs ett fält i guiden till tillståndet. Returnerar true om något ändrades.
  function las(g, el) {
    if (el.dataset.gb) { const [d, k] = el.dataset.gb.split("."); g.behov[d][k] = Math.max(0, parseInt(el.value) || 0); return true; }
    if (el.dataset.gt) { if (el.value) g.tider[el.dataset.gt] = el.value; return true; }
    if (el.dataset.gp) { const [i, k] = el.dataset.gp.split("."); g.personer[+i][k] = k === "grad" ? Math.max(0, parseInt(el.value) || 0) : el.value; return true; }
    const f = el.dataset.gf; if (!f) return false;
    if (["antalDag", "antalNatt", "grad", "veckor"].includes(f)) g[f] = Math.max(0, parseInt(el.value) || 0);
    else g[f] = el.value;
    if (f === "grad") g.personer.forEach(p => (p.grad = g.grad));
    return true;
  }

  function satt(g, falt, varde) { g[falt] = falt === "harUndantag" ? varde === "ja" : varde; }

  // Kontroll innan nästa fråga; returnerar ett felmeddelande eller null.
  function kontrollera(g) {
    if (g.steg === 2 && !g.antalDag && !g.antalNatt) return "Lägg till minst en medarbetare.";
    if (g.steg === 3) {
      const gr = Object.values(grader(g));
      if (g.gradSatt === "budget" && !Number(g.budget)) return "Ange budgeten i timmar per vecka.";
      if (gr.some(x => x < 10 || x > 100)) return "Sysselsättningsgraden ska vara 10–100 %.";
    }
    if (g.steg === 7 && g.startdatum && new Date(g.startdatum + "T00:00:00Z").getUTCDay() !== 1) return "Startdatum ska vara en måndag.";
    return null;
  }

  return { ny, html, las, satt, kontrollera, indata, tomIndata, tomtSchema, val, berakna, grader, synka, AI_START, SISTA };
})();
if (typeof module !== "undefined") module.exports = GUIDE;
</script>
<script>"use strict";
// Konsekvensanalys i lättversionen: en översättning av schemamotor/analys.py (underlag, förslag,
// konsekvenser, rangordning). Schemat för varje förslag läggs av motor.js och granskas av granskning.js.
// Ändras analys.py ska den här filen ändras på samma sätt; tests/js/analys_test.js jämför dem.

const ANALYS = (() => {
  const DAGNAMN = ["mån", "tis", "ons", "tor", "fre", "lör", "sön"];
  const FORSTA_HELTID = 2220;
  const STD = { pass_per_vecka: 4.75, ingen_fredagskvall_fore_ledig_helg: true, helgfrekvens: "2/4" };
  const kopia = x => JSON.parse(JSON.stringify(x));
  const tid = s => { const [h, m] = s.split(":").map(Number); return h * 60 + m; };
  // som Pythons round(): halvor avrundas till jämnt tal
  const avrunda = (x, d) => {
    const exakt = Math.abs(x).toFixed(Math.min(100, d + 30)), svans = exakt.slice(exakt.indexOf(".") + 1 + d);
    if (!/^50*$/.test(svans)) return Number(x.toFixed(d));
    const f = 10 ** d, g = Math.floor(Math.abs(x) * f);
    return Math.sign(x) * (g % 2 === 0 ? g : g + 1) / f;
  };
  const r1 = x => avrunda(x, 1), r2 = x => avrunda(x, 2);
  // som Pythons sum() (Neumaier-summering), så att avrundningen blir densamma
  const summa = lista => { let s = 0, c = 0; for (const x of lista) { const t = s + x; c += Math.abs(s) >= Math.abs(x) ? (s - t) + x : (x - t) + s; s = t; } return s + c; };

  function dagvarden(spec) {
    const ut = Array.from({ length: 7 }, () => ({}));
    for (const [k, v] of Object.entries(spec || {})) {
      const idx = k === "vardag" ? [0, 1, 2, 3, 4] : k === "helg" ? [5, 6] : k === "alla" ? [0, 1, 2, 3, 4, 5, 6] : [DAGNAMN.indexOf(k)];
      idx.forEach(i => { if (i >= 0) ut[i] = v; });
    }
    return ut;
  }
  const regler = ind => ({ ...STD, ...(ind.regler || {}) });

  function underlag(indata, budget) {
    const r = regler(indata);
    let W = indata.veckor;
    const ppv = r.pass_per_vecka;
    const heltid = (indata.heltid_minuter_per_vecka || FORSTA_HELTID) / 60, heltidNatt = (indata.heltid_natt_minuter_per_vecka || 2060) / 60;
    const behov = dagvarden(indata.behov), b = (d, k) => behov[d][k] || 0;
    const np = (indata.nattpass || [{ start: "21:45", slut: "06:45" }])[0];
    const s = tid(np.start), e = tid(np.slut), nattlangd = (e + (e <= s ? 1440 : 0) - s) / 60;
    const nattVecka = [0, 1, 2, 3, 4, 5, 6].reduce((a, d) => a + b(d, "natt"), 0);
    const fredagsregel = r.ingen_fredagskvall_fore_ledig_helg;
    const nattHelg = Math.max(fredagsregel ? b(4, "natt") : 0, b(5, "natt"), b(6, "natt"));
    const nattTimmar = (nattVecka * W + (nattVecka ? 2 : 0)) * nattlangd / W;
    const dagPass = [0, 1, 2, 3, 4, 5, 6].reduce((a, d) => a + b(d, "morgon") + b(d, "kvall"), 0);
    const kvallHelg = Math.max(b(5, "kvall"), b(6, "kvall"));
    const freKvall = fredagsregel ? b(4, "kvall") : 0;
    const perHelg = Math.max(b(5, "morgon"), b(6, "morgon")) + Math.max(kvallHelg, freKvall);
    const andel = { "2/4": 0.5, "1/4": 0.25, "3/4": 0.75, alla: 1.0 }[r.helgfrekvens] ?? 0.5;
    const minDag = dagPass ? Math.max(Math.ceil(dagPass / ppv), Math.ceil(perHelg / andel)) : 0;
    const minNatt = nattVecka ? Math.max(Math.ceil(nattTimmar / heltidNatt), Math.ceil(nattHelg / andel)) : 0;
    const kontrakt = summa((indata.personal || []).map(p => (p.grad ?? 1) * (p.heltid_minuter_per_vecka || (arNatt(p) ? heltidNatt : heltid) * 60) / 60));
    budget = Number(budget || indata.budget_timmar_vecka || r1(kontrakt) || 0);
    return {
      veckor: W, heltid_timmar: heltid, heltid_natt_timmar: heltidNatt, budget_timmar_vecka: budget, arsarbetare_budget: r2(budget / heltid),
      dag_pass_vecka: dagPass, personer_per_helg_dag: perHelg, fredagskvall_styr: freKvall > kvallHelg,
      minsta_antal_dag: minDag, natt_timmar_vecka: r1(nattTimmar), minsta_antal_natt: minNatt,
      dag_timmar_vecka: r1(budget - nattTimmar), pass_per_vecka: ppv, timmar_per_pass_heltid: r2(heltid / ppv),
      behov_timmar_vecka: r1(Math.max(dagPass * heltid / ppv, minDag * 0.5 * heltid) + nattTimmar),
    };
  }

  function grader(summa, antal, steg = 0.05, golv = 0.5) {
    if (antal <= 0) return [];
    const g = Math.min(1, Math.floor(summa / antal / steg) * steg);
    return g >= golv ? Array(antal).fill(r2(g)) : [];
  }

  const arNatt = p => !!(p.dygnsdelar && p.dygnsdelar.length === 1 && p.dygnsdelar[0] === "natt");

  function heltidsnorm(summa, minst, steg = 0.05, golv = 0.5) {
    for (let heltider = Math.min(Math.floor(summa), 60); heltider >= 0; heltider--) {
      const rest = summa - heltider, restAntal = Math.max(minst - heltider, rest >= golv ? 1 : 0);
      if (restAntal === 0) return Array(heltider).fill(1);
      const g = Math.min(1, Math.floor(rest / restAntal / steg) * steg);
      if (g >= golv) return [...Array(heltider).fill(1), ...Array(restAntal).fill(r2(g))];
    }
    return [];
  }

  const personal = (dag, natt) => [...dag.map((g, i) => ({ id: `A${i + 1}`, grad: g })), ...natt.map((g, i) => ({ id: `N${i + 1}`, grad: g, dygnsdelar: ["natt"] }))];

  function graderText(lista) {
    const c = {};
    lista.forEach(p => { const g = Math.round((p.grad ?? 1) * 100); c[g] = (c[g] || 0) + 1; });
    return Object.keys(c).map(Number).sort((a, b) => b - a).map(g => `${c[g]} × ${g} %`);
  }

  function forslag(indata, budget) {
    const u = underlag(indata, budget), ht = u.heltid_timmar;
    const bas = {};
    for (const [k, v] of Object.entries(indata)) if (!["personal", "onskemal", "beskrivning", "forvantat"].includes(k)) bas[k] = kopia(v);
    bas.veckor = u.veckor; bas.budget_timmar_vecka = u.budget_timmar_vecka; bas.onskemal = [];
    const nattSumma = u.natt_timmar_vecka / u.heltid_natt_timmar;
    let natt = [];
    if (u.minsta_antal_natt) {
      natt = heltidsnorm(nattSumma, u.minsta_antal_natt, 0.05, 0.4);
      if (!natt.length) natt = grader(nattSumma, u.minsta_antal_natt, 0.05, 0.3);
      natt = natt.map(g => Math.min(1, Math.ceil(g * 20) / 20));
    }
    const nattTimmar = summa(natt) * u.heltid_natt_timmar;
    const dagSumma = Math.max(0, (u.budget_timmar_vecka - nattTimmar) / ht);
    const n = Math.max(u.minsta_antal_dag, 1);
    const kand = [];
    if (indata.personal?.length) kand.push(["nuvarande", "Nuvarande bemanning", "Personalen som finns i enheten i dag, för jämförelse.", kopia(indata.personal), kopia(indata.onskemal || []), {}]);
    kand.push(["heltid", "Heltid som norm", `Så många heltider som budgeten räcker till, resten deltider. Minst ${n} med dag och kväll för att täcka helgerna.`, personal(heltidsnorm(dagSumma, n), natt), [], {}]);
    kand.push(["jamn", "Lika deltider", `${n} personer med samma sysselsättningsgrad. Ger jämn arbetsbörda men kortare pass.`, personal(grader(dagSumma, n), natt), [], {}]);
    kand.push(["fler", "Fler personer, lägre grad", `${n + 2} personer med dag och kväll. Fler som kan arbeta varje helg och mer flexibilitet, men fler deltider.`, personal(grader(dagSumma, n + 2), natt), [], {}]);
    const behovDag = Math.max(0, (u.behov_timmar_vecka - nattTimmar) / ht);
    if (behovDag < dagSumma - 0.25) {
      const g = heltidsnorm(behovDag, n);
      kand.push(["behovet", "Bara behovet", `Den minsta bemanning som täcker behovet: ${n} personer med dag och kväll. Visar hur mycket av budgeten som inte behövs (${r1((dagSumma - behovDag) * ht)} h per vecka).`,
        personal(g.length ? g : grader(behovDag, n), natt), [], {}]);
    }
    if (u.fredagskvall_styr) {
      const minst = ind2 => Math.max(underlag(ind2, u.budget_timmar_vecka).minsta_antal_dag, 1);
      const behov = kopia(indata.behov || {}), helg = behov.helg || {};
      const fre = { ...(behov.fre || behov.vardag || {}) };
      fre.kvall = helg.kvall ?? fre.kvall ?? 0;
      behov.fre = fre;
      const nFre = minst({ ...indata, behov });
      kand.push(["fredag", "Fredagskväll som helgkväll", `Behovet fredag kväll sänks till helgens nivå (${fre.kvall}). Då krävs minst ${nFre} personer med dag och kväll för helgerna i stället för ${n}. Budgeten fördelas med heltid som norm.`,
        personal(heltidsnorm(dagSumma, nFre), natt), [], { behov }]);
      const reg = { ...(indata.regler || {}), ingen_fredagskvall_fore_ledig_helg: false };
      const nRegel = minst({ ...indata, regler: reg });
      kand.push(["utan_fredagsregel", "Utan fredagsregeln", `Den lokala regeln om ingen fredagskväll före ledig helg stängs av, så fredagskvällen kan tas av den som är ledig helgen. Då krävs minst ${nRegel} personer för helgerna. Kräver ett beslut i verksamheten, eftersom det är en lokal regel.`,
        personal(heltidsnorm(dagSumma, nRegel), natt), [], { regler: reg }]);
    }
    const scenarier = [];
    for (const [nyckel, namn, beskr, pers, onsk, extra] of kand) {
      if (!pers.some(p => !p.dygnsdelar) && u.dag_pass_vecka) continue;
      const ind = { ...kopia(bas), ...kopia(extra), personal: pers, onskemal: onsk };
      if (nyckel === "nuvarande") {
        ind.veckor = indata.veckor; delete ind.budget_timmar_vecka;
        if (indata.budget_timmar_vecka) ind.budget_timmar_vecka = indata.budget_timmar_vecka;
      }
      const kontrakt = summa(pers.map(p => (p.grad ?? 1) * (arNatt(p) ? u.heltid_natt_timmar : ht)));
      const dag = pers.filter(p => !(p.dygnsdelar && p.dygnsdelar.length === 1 && p.dygnsdelar[0] === "natt"));
      const nat = pers.filter(p => p.dygnsdelar && p.dygnsdelar.length === 1 && p.dygnsdelar[0] === "natt");
      const sammanfattning = `${dag.length} dag/kväll (${graderText(dag).join(", ")})` + (nat.length ? ` och ${nat.length} natt (${graderText(nat).join(", ")})` : "");
      scenarier.push({ id: nyckel, namn, beskrivning: beskr, sammanfattning, kontrakt_timmar_vecka: r1(kontrakt), indata: ind });
    }
    return { underlag: u, scenarier };
  }

  function konsekvenser(indata, res, granskning, budget) {
    const W = res.veckor, N = W * 7, r = regler(indata);
    const ht = (indata.heltid_minuter_per_vecka || FORSTA_HELTID) / 60;
    const htn = (indata.heltid_natt_minuter_per_vecka || 2060) / 60;
    const kontrakt = summa(indata.personal.map(p => (p.grad ?? 1) * (p.heltid_minuter_per_vecka || (arNatt(p) ? htn : ht) * 60) / 60));
    budget = budget || indata.budget_timmar_vecka;
    const ut = { status: res.status, personer: indata.personal.length, heltider: indata.personal.filter(p => (p.grad ?? 1) >= 0.999).length,
      kontrakt_timmar_vecka: r1(kontrakt), arsarbetare: r2(kontrakt / ht), budget_timmar_vecka: budget, budget_kvar: budget ? r1(budget - kontrakt) : null };
    if (res.status !== "OK") return ut;
    const behov = dagvarden(indata.behov);
    const vak = { vardag: 0, fredagskvall: 0, helg: 0, natt: 0 };
    let over = 0, overTim = 0;
    const langd = {};
    for (const rad of Object.values(res.schema)) for (const p of rad) if (p) (langd[p.dygnsdel] = langd[p.dygnsdel] || []).push(p.netto);
    const snitt = {};
    for (const [k, v] of Object.entries(langd)) snitt[k] = summa(v) / v.length;
    for (let d = 0; d < N; d++) for (const del of ["morgon", "kvall", "natt"]) {
      const n = Object.values(res.schema).filter(rad => rad[d] && rad[d].dygnsdel === del).length, b = behov[d % 7][del] || 0;
      if (n < b) vak[del === "natt" ? "natt" : d % 7 >= 5 ? "helg" : d % 7 === 4 && del === "kvall" ? "fredagskvall" : "vardag"] += b - n;
      else if (n > b) { over += n - b; overTim += (n - b) * (snitt[del] || 0) / 60; }
    }
    const helg = Array.from({ length: W }, (_, w) => Object.values(res.schema).filter(rad => rad[w * 7 + 5] || rad[w * 7 + 6]).length);
    let ensidiga = 0;
    const kvallar = [];
    for (const [pid, rad] of Object.entries(res.schema)) {
      const p = indata.personal.find(q => q.id === pid) || {}, delar = p.dygnsdelar || ["morgon", "kvall"];
      if (delar.includes("morgon") && delar.includes("kvall")) {
        kvallar.push(rad.filter(x => x && x.dygnsdel === "kvall").length);
        for (let w = 0; w < W; w++) {
          const typer = rad.slice(w * 7, w * 7 + 7).filter(Boolean).map(x => x.dygnsdel);
          if (typer.length && (!typer.includes("kvall") || !typer.includes("morgon"))) ensidiga++;
        }
      }
    }
    const alla = Object.values(langd).flat(), dagL = [...(langd.morgon || []), ...(langd.kvall || [])];
    Object.assign(ut, {
      vakanta_pass: res.kpi.vakanta_pass, vakanser: vak, overkapacitet_pass: over, overkapacitet_timmar_vecka: r1(overTim / W),
      helg_personer_min: helg.length ? Math.min(...helg) : 0, helg_personer_max: helg.length ? Math.max(...helg) : 0,
      kvallar_skillnad: kvallar.length ? Math.max(...kvallar) - Math.min(...kvallar) : 0,
      veckor_utan_blandning: ensidiga, personveckor: kvallar.length * W,
      kortaste_pass: dagL.length ? Math.min(...dagL) : alla.length ? Math.min(...alla) : 0, langsta_pass: dagL.length ? Math.max(...dagL) : 0,
      brott: granskning ? granskning.brott.length : null, upplasta_regler: [...(indata.avvikelser || [])], fredagsregel: r.ingen_fredagskvall_fore_ledig_helg,
    });
    return ut;
  }

  function rangordna(rader) {
    const nyckel = x => {
      const k = x.konsekvenser || {};
      if (k.status !== "OK") return [1, 1e6, 0, 0, 0, 0];
      return [k.brott ? 1 : 0, k.vakanta_pass || 0, Math.max(0, -(k.budget_kvar || 0)), Math.round((k.overkapacitet_timmar_vecka || 0) / 10), k.veckor_utan_blandning || 0, k.overkapacitet_timmar_vecka || 0];
    };
    const jfr = (a, b) => { for (let i = 0; i < a.length; i++) if (a[i] !== b[i]) return a[i] - b[i]; return 0; };
    return rader.map((_, i) => i).sort((a, b) => jfr(nyckel(rader[a]), nyckel(rader[b])) || a - b);
  }

  return { underlag, forslag, konsekvenser, rangordna };
})();
if (typeof module !== "undefined") module.exports = ANALYS;

// I Claude: privat i ditt konto (syns i mobil och dator). Annars: bara i den här webbläsaren.
const lager = {
  typ: "lokal", db: null, bas: null,
  async init() {
    try {
      const use = window.claude && window.claude.use;
      if (use) {
        const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
        const uid = user ? await user.id() : null;
        if (db && uid) { this.db = db; this.bas = "data/users/" + uid; this.typ = "konto"; }
      }

  },
  lokal() { try { return JSON.parse(localStorage.getItem("schema-light") || '{"enheter":{},"korningar":{}}'); } catch { return { enheter: {}, korningar: {} }; } },
  lokalSpara(d) { try { localStorage.setItem("schema-light", JSON.stringify(d)); } catch { meddela("Kunde inte spara i webbläsaren."); } },
  async enheter() {
    if (this.db) {
      const s = await medTidsgrans(this.db.collection(this.bas).get());
      return s.docs.filter(d => d.id.startsWith("e_")).map(d => ({ id: d.id.slice(2), ...d.data() })).sort((a, b) => b.andrad - a.andrad);

  async sparaEnhet(e) {
    const rad = { id: e.id, namn: e.namn, indata: e.indata, andrad: Date.now() };

    const d = this.lokal(); d.enheter[e.id] = rad; this.lokalSpara(d);
  },
  async taBortEnhet(id) {
    if (this.db) {
      const k = await this.db.collection(`${this.bas}/e_${id}/korningar`).get();
      for (const d of k.docs) await this.db.doc(`${this.bas}/e_${id}/korningar/${d.id}`).delete();
      return this.db.doc(`${this.bas}/e_${id}`).delete();
    }
    const d = this.lokal(); delete d.enheter[id];
    Object.keys(d.korningar).forEach(k => { if (d.korningar[k].enhet === id) delete d.korningar[k]; }); this.lokalSpara(d);
  },
  async korningar(eid) {
    if (this.db) {
      const s = await medTidsgrans(this.db.collection(`${this.bas}/e_${eid}/korningar`).get());

    if (this.db) return this.db.doc(`${this.bas}/e_${k.enhet}/korningar/${k.id}`).set(k);

async function skapa(namn, indata) {
  const e = { id: nyttId(), namn, indata: structuredClone(indata) };
  delete e.indata.losare; delete e.indata.tidpunkter; delete e.indata.delperioder;
  try { await lager.sparaEnhet(e); } catch (err) { meddela("Kunde inte spara: " + err.message); }
  oppna(e);
}

// ------------------------------------------------------------------ vy: enhet
// Öppna en enhet: direkt till senaste schemat om det finns ett; annars (eller med opt.installningar) inställningarna.
async function oppna(e, opt = {}) {
  if (!opt.installningar) {
    let kor = [];
    try { kor = await lager.korningar(e.id); } catch { kor = []; }
    if (kor.length) { st.enhet = e; st.korningar = kor; st.rflik = "schema"; return visaKorning(kor[0]); }
  }
  if (opt.flik) st.flik = opt.flik;
  st.vy = "enhet"; st.enhet = e; st.onskForm = null; st.aktForm = null; st.korning = null;
  $("#sida").innerHTML = `
    <header class="kort"><div class="rad"><button class="lank" data-g="tillbaka">‹ Enheter</button><span class="dampad liten">${lager.typ === "konto" ? "Sparas automatiskt" : "Sparas i webbläsaren"}</span></div>
      <label for="namn" style="margin-top:6px">Enhet</label><input id="namn" value="${esc(e.namn)}" style="font-weight:600;font-size:18px">
      <div class="chips" style="margin-top:10px"><button class="primar" data-g="senaste" id="senaste-knapp" hidden>‹ Till schemat</button><button data-g="simulering">Simulering</button><button data-g="till-aktiviteter">★ Aktiviteter (APT m.m.)</button></div></header>
    <section class="kort" id="kontroll"></section>
    <section class="kort"><div class="flikar" role="tablist">${[["personal", "Personal"], ["behov", "Behov"], ["onskemal", "Önskemål"], ["aktiviteter", "Aktiviteter"], ["balans", "Bemanningsbalans"], ["regler", "Regler"], ["period", "Period"]].map(([k, t]) =>
      `<button role="tab" data-g="flik" data-f="${k}" aria-selected="${st.flik === k}">${t}</button>`).join("")}</div><div id="flik"></div></section>
    <section class="kort" id="korningar"><h2>Körningar</h2><p class="dampad liten">Laddar …</p></section>`;
  $("#namn").oninput = ev => { st.enhet.namn = ev.target.value; andrad(false); };
  ritaFlik(); ritaKontroll(); ritaFot();
  try { st.korningar = await lager.korningar(e.id); } catch { st.korningar = []; }
  ritaKorningar();
  const sk = $("#senaste-knapp"); if (sk) sk.hidden = !st.korningar.length;
}

function ritaKontroll() {
  const el = $("#kontroll"); if (!el) return;
  const b = MOTOR_HUVUD.balans(st.enhet.indata);
  if (b.fel) { el.innerHTML = `<div class="banner dalig"><strong>Rätta först</strong></div><ul class="punkter liten" style="margin-top:8px">${b.fel.map(f => `<li>${esc(f)}</li>`).join("")}</ul>`; return; }
  const und = st.enhet.indata.personal.filter(p => p.helgfrekvens && p.helgfrekvens !== "2/4");
  const ht = (st.enhet.indata.heltid_minuter_per_vecka || 2220) / 60;
  const htn = (st.enhet.indata.heltid_natt_minuter_per_vecka || 2060) / 60, arNatt = p => p.dygnsdelar && p.dygnsdelar.length === 1 && p.dygnsdelar[0] === "natt";
  const kontr = Math.round(st.enhet.indata.personal.reduce((s, p) => s + (p.grad ?? 1) * ((p.heltid_minuter_per_vecka || 0) / 60 || (arNatt(p) ? htn : ht)), 0) * 100) / 100;
  const bud = st.enhet.indata.budget_timmar_vecka;
  const budText = bud ? `<p class="liten" style="margin:8px 0 0;${kontr > bud + 0.05 ? "color:var(--dalig)" : ""}">Kontrakterad tid ${sv(kontr)} h per vecka av budgeten ${sv(bud)} h${Math.abs(kontr - bud) < 0.05 ? "." : kontr > bud ? `: ${sv(Math.round((kontr - bud) * 100) / 100)} h över.` : `: ${sv(Math.round((bud - kontr) * 100) / 100)} h kvar.`}</p>` : `<p class="liten dampad" style="margin:8px 0 0">Kontrakterad tid ${sv(kontr)} h per vecka.</p>`;
  el.innerHTML = `<div class="banner ${b.forvantade_vakanser ? "varn" : "ok"}"><strong>${b.forvantade_vakanser ? `Cirka ${vakText(b.forvantade_vakanser)}` : "Personalen räcker"}</strong>

}

function beskriv(o) {
  const vill = o.krav ? "måste" : "vill";
  const vad = o.typ === "ledig" ? "vara ledig" : o.typ === "arbetar" ? "arbeta" : o.typ === "tidigast_start" ? `börja tidigast ${o.varde}` : o.typ === "senast_slut" ? `sluta senast ${o.varde}` : `bara arbeta ${(DELAR[o.varde] || o.varde).toLowerCase()}`;
  let nar = Array.isArray(o.dagindex) ? o.dagindex.map(d => `v${Math.floor(d / 7) + 1} ${DAGAR[d % 7]}`).join(", ") : (o.dagar && o.dagar.length ? o.dagar.join(", ") : "alla dagar");
  if (o.veckor === "jämna" || o.veckor === "udda") nar += `, ${o.veckor} veckor`;
  else if (Array.isArray(o.veckor)) nar += `, vecka ${o.veckor.join(", ")}`;
  return `${o.person} ${vill} ${vad} – ${nar}${!o.krav && (o.vikt || 1) > 1 ? ` (vikt ${o.vikt})` : ""}`;
}

const AKTTYP = { apt: "APT", utbildning: "Utbildning", mote: "Möte", studier: "Studier", dokumentation: "Dokumentation", handledning: "Handledning", annat: "Annat" };
function aktBeskriv(a) {
  const vv = Array.isArray(a.veckor) ? `vecka ${a.veckor.join(", ")}` : a.veckor === "jämna" ? "jämna veckor" : a.veckor === "udda" ? "udda veckor" : "varje vecka";
  const vem = a.antal ? `${a.antal} personer` : a.andel ? `${Math.round(a.andel * 100)} % av gruppen` : a.varje_person ? `alla, ${a.varje_person} ${a.varje_person === 1 ? "gång" : "gånger"} var` : "alla";
  return `${a.namn || a.id} ${a.start}–${a.slut}, ${(a.dagar || []).join(", ") || "alla dagar"}, ${vv}: ${vem}${a.deltagare?.length ? ` bland ${a.deltagare.join(", ")}` : ""}${a.fran_golvet === false ? " (räknas på golvet)" : ""}${a.minst_pa_golvet ? `. Minst ${a.minst_pa_golvet} kvar på golvet` : ""}`;
}

function kopplaAkt() {
  const f = $("#af"); if (!f) return;
  const a = st.aktForm.data;
  $("#af-w").onchange = () => ($("#af-wl").hidden = $("#af-w").value !== "vissa");
  $("#af-typ").onchange = () => { const n = $("#af-n"); if (!n.value.trim() || Object.values(AKTTYP).includes(n.value.trim())) n.value = $("#af-typ").value === "annat" ? "" : AKTTYP[$("#af-typ").value]; };
  $("#af-v").onchange = () => {
    const v = $("#af-v").value; $("#af-tal").hidden = v === "alla";
    $("#af-tl").textContent = v === "andel" ? "Andel, %" : v === "antal" ? "Antal per tillfälle" : "Gånger per person";
    $("#af-t").value = v === "andel" ? 50 : 1;
  };
  f.onsubmit = ev => {
    ev.preventDefault();
    const namn = $("#af-n").value.trim() || "Aktivitet", ids = new Set((st.enhet.indata.aktiviteter || []).map(x => x.id));
    let id = a.id; if (!id) { const bas = (namn.normalize("NFD").replace(/[^A-Za-z0-9]/g, "").toUpperCase() || "AKT").slice(0, 8); id = bas; let k = 2; while (ids.has(id)) id = bas + k++; }
    const n = { id, typ: $("#af-typ").value, namn, start: $("#af-s").value, slut: $("#af-e").value };
    if (!(n.slut > n.start)) return meddela("Aktiviteten måste sluta efter att den börjar, samma dag.");
    n.dagar = [...f.querySelectorAll("[name=af-d]:checked")].map(x => x.value);
    if (!n.dagar.length) return meddela("Välj minst en dag.");
    const w = $("#af-w").value;
    if (w === "vissa") { const l = $("#af-wlista").value.split(/[,; ]+/).map(Number).filter(x => x > 0); if (!l.length) return meddela("Ange vilka veckor."); n.veckor = l; }
    else if (w !== "alla") n.veckor = w;
    const v = $("#af-v").value, t = +$("#af-t").value || 1;
    if (v === "andel") n.andel = Math.max(5, Math.min(100, t)) / 100;
    if (v === "antal") n.antal = Math.max(1, Math.round(t));
    if (v === "varje") n.varje_person = Math.max(1, Math.round(t));
    const p = [...f.querySelectorAll("[name=af-p]:checked")].map(x => x.value); if (p.length) n.deltagare = p;
    if (!$("#af-g").checked) n.fran_golvet = false;
    const m = parseInt($("#af-m").value); if (m > 0) n.minst_pa_golvet = m;
    if ($("#af-k").checked) n.krav = true;
    const l = st.enhet.indata.aktiviteter || (st.enhet.indata.aktiviteter = []);
    if (st.aktForm.n == null) l.push(n); else l[st.aktForm.n] = n;
    st.aktForm = null; andrad(true);
  };
}

document.addEventListener("input", ev => {

    else if (el.value === "") delete i[k]; else i[k] = ["budget_timmar_vecka", "timkostnad_kr", "ob_prognos_procent"].includes(k) ? parseFloat(el.value.replace(",", ".")) : parseInt(el.value);

    }
    case "andra-akt": st.aktForm = { n: +el.dataset.n, data: structuredClone(i.aktiviteter[+el.dataset.n]) }; return ritaFlik();
    case "avbryt-akt": st.aktForm = null; return ritaFlik();
    case "ta-bort-akt": i.aktiviteter.splice(+el.dataset.n, 1); if (!i.aktiviteter.length) delete i.aktiviteter; return andrad(true);

let arbetare = null;

// ------------------------------------------------------------------ tre alternativ
const PROFILER = {
  medarbetare: ["Medarbetarstyrt", "Rättvist: alla så lika som möjligt, och önskemål före passlängd."],
  verksamhet: ["Verksamhetsstyrt", "Behovet först: det som blir över eller saknas sprids jämnt."],
  ekonomi: ["Ekonomistyrt", "Lägsta OB-kostnad: extra pass där OB är lägst."],
};
function korProfil(indata, profil, rapport) {
  return new Promise(ok => {
    const reserv = () => setTimeout(() => ok(MOTOR_HUVUD.los(indata, { sekunder: st.sekunder, profil, seed: Date.now() % 100000 })), 30);
    try {
      const w = new Worker(URL.createObjectURL(new Blob([$("#motor-kod").textContent], { type: "text/javascript" })));
      w.onmessage = e => { if (e.data.typ === "framsteg") rapport(e.data.andel); else { w.terminate(); e.data.typ === "klar" ? ok(e.data.resultat) : reserv(); } };
      w.onerror = () => { w.terminate(); reserv(); };
      w.postMessage({ indata, sekunder: st.sekunder, seed: Date.now() % 100000, profil });
    } catch { reserv(); }
  });
}
async function treAlternativ() {
  const ind = st.enhet.indata, b = MOTOR_HUVUD.balans(ind);
  if (b.fel) return meddela("Rätta felen i inställningarna först.");
  st.vy = "jamfor"; $("#fot").hidden = true;
  const nya = [];
  const profiler = Object.keys(PROFILER);
  for (const [i, p] of profiler.entries()) {
    $("#sida").innerHTML = `<section class="kort"><h1>Tre alternativ</h1><div class="banner info" style="margin-top:10px"><strong>Lägger ${PROFILER[p][0].toLowerCase()} schema (${i + 1} av 3) …</strong><span class="liten">${PROFILER[p][1]}</span><div class="matare"><div id="matare"></div></div></div></section>`;
    const res = await korProfil(ind, p, a => { const m = $("#matare"); if (m) m.style.width = Math.round(a * 100) + "%"; });
    if (res.status === "INDATAFEL") return meddela(res.fel[0]);

function laggSchema() {

// Lägg schemat själv: en körning med tomt schema som öppnas i redigeringsläge.
async function laggManuellt() {
  const ind = st.enhet.indata, W = ind.veckor || 4, ht = ind.heltid_minuter_per_vecka || 2220;
  const grund = { status: "OK", motor: "manuell", enhet: ind.enhet, veckor: W, cykliskt: ind.cykliskt !== false, sekunder: 0,
    kpi: { vakanta_pass: 0, blocklangd: 0, rattvisa: 0, onskemal: 0 }, vakanser: [], schema: {},
    personer: Object.fromEntries(ind.personal.map(p => [p.id, { pass: 0, minuter: 0, mal_minuter: Math.round((p.heltid_minuter_per_vecka || (p.dygnsdelar && p.dygnsdelar[0] === "natt" && p.dygnsdelar.length === 1 ? ind.heltid_natt_minuter_per_vecka || 2060 : ht)) * (p.grad ?? 1) * W), kvallspass: 0, helgfrekvens: p.helgfrekvens || null }])) };
  const res = raknaOm(ind, GUIDE.tomtSchema(ind), grund), g = GRANSKNING.kontrollera(ind, res);
  const k = { id: nyttId(), enhet: st.enhet.id, namn: `Körning ${st.korningar.length + 1} (manuell)`, skapad: Date.now(), status: "BROTT", vakanta: res.kpi.vakanta_pass,
    data: JSON.stringify({ resultat: res, granskning: g, balans: 0, indata: ind }) };
  st.korningar.unshift(k);
  try { await lager.sparaKorning(k); } catch (e) { meddela("Kunde inte spara: " + e.message); }
  visaKorning(k); st.rflik = "schema";
  st.red = { schema: structuredClone(res.schema), historik: [], andringar: 0, panel: null }; raknaOmUtkast();
}

// ------------------------------------------------------------------ justera ett färdigt schema
// Utkastet räknas om (rast, arbetstid, vakanser) och granskas av den fristående granskningen efter varje ändring.
function raknaOm(indata, schema, grund) {
  const r = indata.regler || {}, rg = r.rast_grans_minuter ?? 300, rl = r.rast_minuter ?? 30;
  const maltid = (indata.nattpass?.[0]?.maltidsuppehall) !== false;
  const min = t => { const [a, b] = t.split(":").map(Number); return a * 60 + b; };
  const nytt = {};
  for (const [pid, rad] of Object.entries(schema)) nytt[pid] = rad.map(p => {
    if (!p) return null;
    const s = min(p.start); let e = min(p.slut); if (e <= s) e += 1440;
    const langd = e - s, rast = p.dygnsdel === "natt" && maltid ? 0 : langd > rg ? rl : 0;
    return { ...p, rast, netto: langd - rast };
  });
  const N = grund.veckor * 7, bd = behovDag(indata), vakanser = [];
  for (let d = 0; d < N; d++) for (const del of ["morgon", "kvall", "natt"]) {
    const n = Object.values(nytt).filter(rad => rad[d]?.dygnsdel === del).length, b = bd[d % 7][del];
    if (n < b) vakanser.push({ dag: d, vecka: Math.floor(d / 7) + 1, veckodag: DAGAR[d % 7], dygnsdel: del, antal: b - n });
  }
  const personer = {};
  for (const [pid, rad] of Object.entries(nytt)) {
    const l = rad.filter(Boolean);
    personer[pid] = { ...grund.personer[pid], pass: l.length, minuter: l.reduce((a, q) => a + q.netto, 0), kvallspass: l.filter(q => q.dygnsdel === "kvall").length };
  }
  // aktivitetstillfällen: vem som har aktiviteten på passet som täcker dagen
  const aktiviteter = (grund.aktiviteter || []).map(t => {
    const delt = Object.keys(nytt).filter(pid => [t.dag, (t.dag - 1 + N) % N].some(dd => (nytt[pid][dd]?.aktiviteter || []).some(a => a.id === t.aktivitet)
      && (dd === t.dag ? nytt[pid][dd].dygnsdel !== "natt" || min(nytt[pid][dd].start) <= min(t.start) : nytt[pid][dd].dygnsdel === "natt")));
    return { ...t, deltagare: delt, saknas: Math.max(0, t.behov - delt.length) };
  });
  return { ...grund, schema: nytt, personer, vakanser, aktiviteter, brott: [], justerat: true,
    kpi: { ...grund.kpi, vakanta_pass: vakanser.reduce((a, v) => a + v.antal, 0), aktivitet_saknas: aktiviteter.reduce((a, t) => a + t.saknas, 0) } };
}

function raknaOmUtkast() {
  const k = st.korning;
  st.red.res = raknaOm(k.indata, st.red.schema, k.resultat);
  st.red.g = GRANSKNING.kontrollera(k.indata, st.red.res);
  ritaResultat();
}

function andraUtkast(fn) {
  st.red.historik.push(structuredClone(st.red.schema));
  fn(st.red.schema); st.red.andringar++;
  raknaOmUtkast();
}

function redigeringsrad() {
  const r = st.red, brott = r.g.brott.length, b0 = st.korning.granskning.brott.length + (st.korning.resultat.brott || []).length;
  const v0 = st.korning.resultat.kpi.vakanta_pass, v = r.res.kpi.vakanta_pass;
  const diff = (nu, fore) => nu === fore ? "" : ` (${nu > fore ? "+" : "−"}${Math.abs(nu - fore)})`;
  return `<section class="kort" style="border:2px solid var(--guld)"><h2 style="margin:0">Du justerar schemat</h2>
    <p class="dampad liten" style="margin:4px 0 0">Varje ändring granskas direkt. Originalet finns kvar; justeringen sparas som en ny körning.</p>
    <div class="kpi"><div><b>${r.andringar}</b><span>ändringar</span></div><div class="${brott ? "fel" : ""}"><b>${brott}</b><span>regelbrott${diff(brott, b0)}</span></div><div class="${v ? "fel" : ""}"><b>${v}</b><span>vakanta pass${diff(v, v0)}</span></div></div>
    ${brott ? `<details class="liten" style="margin-top:6px"><summary>Visa regelbrotten</summary><ul class="punkter">${r.g.brott.slice(0, 20).map(b => `<li><b>${esc(b.person || "")}</b> ${esc(b.text)}</li>`).join("")}</ul></details>` : ""}

}

function redigeringspanel(res) {
  const [pid, ds] = st.red.panel.c.split("|"), d = +ds, p = st.red.schema[pid][d], N = res.veckor * 7;
  const tider = { morgon: ["07:00", "15:00"], kvall: ["14:00", "22:00"], natt: ["21:45", "06:45"] };
  for (const rad of Object.values(st.red.schema)) for (const q of rad) if (q) tider[q.dygnsdel] = [q.start, q.slut];
  const v = p || { dygnsdel: "morgon", start: tider.morgon[0], slut: tider.morgon[1] };
  return `<div class="bladpanel" role="dialog" aria-label="${p ? "Ändra pass" : "Nytt pass"}"><div class="rad"><b>${p ? "Ändra pass" : "Nytt pass"} – ${esc(pid)}, V${Math.floor(d / 7) + 1} ${DAGAR[d % 7]}</b><button class="lank" data-g="red-stang" aria-label="Stäng">✕</button></div>

function sparaPass() {

  const v = { dygnsdel: $("#rp-del").value, start: $("#rp-start").value, slut: $("#rp-slut").value };

}

// i tur och ordning och granskas av den fristående granskningen.
function korMotor(indata, sekunder) {
  return new Promise(klar => {
    try {
      const w = new Worker(URL.createObjectURL(new Blob([$("#motor-kod").textContent], { type: "text/javascript" })));
      w.onmessage = e => { if (e.data.typ === "framsteg") return; w.terminate(); klar(e.data.typ === "klar" ? e.data.resultat : { status: "FEL", fel: [e.data.fel] }); };
      w.onerror = () => { w.terminate(); klar(MOTOR_HUVUD.los(indata, { sekunder })); };
      w.postMessage({ indata, sekunder, seed: Date.now() % 100000 });
    } catch { setTimeout(() => klar(MOTOR_HUVUD.los(indata, { sekunder, seed: Date.now() % 100000 })), 30); }
  });
}

      <div><label for="s-bud">Budget, timmar per vecka</label><input id="s-bud" type="number" inputmode="decimal" step="0.5" min="1" value="${S ? S.underlag.budget_timmar_vecka : (i.budget_timmar_vecka ?? Math.round(kontr * 10) / 10)}"></div>

      <div><b>${u.personer_per_helg_dag}</b><span>dag/kväll varje helg</span></div>
      <div><b>${u.minsta_antal_dag}</b><span>minsta antal med dag/kväll</span></div></div>
    <p class="liten" style="margin-top:10px">${diff >= 0 ? `Budgeten är <b>${sv(diff)} h större</b> än behovet kräver.` : `Budgeten är <b>${sv(-diff)} h mindre</b> än behovet kräver. Räkna med vakanser.`}${u.fredagskvall_styr ? " <b>Fredagskvällen styr helgbemanningen.</b>" : ""}</p></section>`;
  const sc = S.scenarier, ordning = S.klar ? S.ordning : sc.map((_, n) => n), tk = S.tk;

async function simulera() {
  const budget = parseFloat($("#s-bud").value.replace(",", ".")) || null, tk = parseFloat($("#s-tk").value.replace(",", ".")) || null, sek = +$("#s-sek").value;
  const f = ANALYS.forslag(st.enhet.indata, budget);
  const S = st.sim = { enhet: st.enhet.id, underlag: f.underlag, scenarier: f.scenarier, tk, klar: false, pagar: 0 };
  ritaSimulering();
  for (let n = 0; n < S.scenarier.length; n++) {
    if (st.sim !== S) return;
    S.pagar = n; if (st.vy === "simulering") ritaSimulering();
    const x = S.scenarier[n], res = await korMotor(x.indata, sek);
    const harSchema = res.status === "OK" || res.status === "BROTT";  // BROTT: schema finns men bryter hårda regler
    const g = harSchema ? GRANSKNING.kontrollera(x.indata, res) : null;
    if (g) g.brott = g.brott.concat(res.brott || []);
    x.resultat = harSchema ? res : null; x.granskning = g;
    x.konsekvenser = ANALYS.konsekvenser(x.indata, { ...res, status: harSchema ? "OK" : "INFEASIBLE" }, g, S.underlag.budget_timmar_vecka);
  }
  S.klar = true; S.pagar = null; S.ordning = ANALYS.rangordna(S.scenarier);
  if (st.vy === "simulering") ritaSimulering();
}

async function anvandForslag(n) {

  }

}
