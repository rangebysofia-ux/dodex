<style>
/* Layout: en kolumn för mobilen; kontroll överst, flikar för indata, fast knapp för att lägga schemat. */

  --accent: #6fb0e0; --accent-text: #0c1620; --accent-svag: #1b2b3a;
  --morgon: #4b3b10; --morgon-text: #ffe2a0; --kvall: #1d3359; --kvall-text: #d2e2ff; --natt: #4a4590; --natt-text: #f0eeff;
  --bra: #6fd39a; --bra-bg: #163023; --dalig: #ff8080; --dalig-bg: #3b1d20; --varn: #ffcf70; --varn-bg: #3a3018; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #12161c; --yta: #1a2029; --yta2: #161b23; --text: #e5e9ef; --dampad: #97a2b3; --linje: #2c3440; --helg: #20262f;
  --accent: #6fb0e0; --accent-text: #0c1620; --accent-svag: #1b2b3a;
  --morgon: #4b3b10; --morgon-text: #ffe2a0; --kvall: #1d3359; --kvall-text: #d2e2ff; --natt: #4a4590; --natt-text: #f0eeff;

.sida { max-width: 820px; margin: 0 auto; padding-block: 14px 110px; display: grid; gap: 14px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

.kpi b { display: block; font-size: 21px; font-variant-numeric: tabular-nums; }
.kpi span { color: var(--dampad); font-size: 12.5px; line-height: 1.3; display: block; }
.kpi .fel b { color: var(--dalig); }
.veckor { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.veckor button { border-radius: 999px; padding: 4px 11px; font-size: 13px; }
.veckor button[aria-pressed="true"] { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
table.schema { table-layout: fixed; }
table.schema th, table.schema td { text-align: center; padding: 2px; font-size: 12px; }
table.schema th:first-child, table.schema td:first-child { text-align: left; width: 40px; font-weight: 600; padding-left: 3px; overflow: hidden; text-overflow: ellipsis; }
table.schema .helg { background: var(--helg); }
.pass { border: 0; width: 100%; border-radius: 5px; padding: 4px 1px; line-height: 1.15; font: inherit; cursor: pointer; display: block; }
.pass b { display: block; font-size: 12.5px; } .pass small { font: 10.5px var(--mono); }
.pass.morgon { background: var(--morgon); color: var(--morgon-text); } .pass.kvall { background: var(--kvall); color: var(--kvall-text); } .pass.natt { background: var(--natt); color: var(--natt-text); }
.pass.vald { outline: 2px solid var(--accent); outline-offset: 1px; }
tr.bem td { font-size: 11px; color: var(--dampad); border-top: 2px solid var(--linje); line-height: 1.25; }
tr.bem td.vakans { color: var(--dalig); font-weight: 700; background: var(--dalig-bg); }
.mono { font-family: var(--mono); font-size: 13px; }
.fot { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; background: var(--yta); border-top: 1px solid var(--linje);
  padding-block: 10px max(10px, env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.fot > div { max-width: 820px; margin: 0 auto; display: flex; gap: 10px; align-items: center; }
.fot button.primar { flex: 1; padding: 11px; font-size: 16px; }
.fot select { width: auto; }
.matare { height: 6px; background: var(--linje); border-radius: 3px; overflow: hidden; margin-top: 8px; }
.matare div { height: 100%; background: var(--accent); width: 0; transition: width .3s; }
.onsk { display: flex; gap: 10px; justify-content: space-between; align-items: flex-start; padding: 8px 0; border-bottom: 1px solid var(--linje); }
.formular { background: var(--yta2); border: 1px solid var(--linje); border-radius: 8px; padding: 12px; display: grid; gap: 10px; margin-bottom: 10px; }
.status { font-size: 12px; font-weight: 600; padding: 1px 8px; border-radius: 10px; white-space: nowrap; }
.status.ok { background: var(--bra-bg); color: var(--bra); } .status.dalig { background: var(--dalig-bg); color: var(--dalig); } .status.varn { background: var(--varn-bg); color: var(--varn); }
#meddelande { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(80px + env(safe-area-inset-bottom, 0px)); background: var(--text); color: var(--bg);
  border-radius: 8px; padding: 9px 14px; font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .2s; max-width: calc(100% - 32px); z-index: 20; }
#meddelande.syns { opacity: 1; }
.pass.vakant { background: none; border: 2px dashed; padding: 2px 0; cursor: default; }
.pass.vakant.morgon { border-color: var(--morgon-text); color: var(--morgon-text); } .pass.vakant.kvall { border-color: var(--kvall-text); color: var(--kvall-text); } .pass.vakant.natt { border-color: var(--natt); color: var(--text); }
tr.vakantrad td:first-child { color: var(--dalig); }
.minus { color: var(--dalig); font-weight: 800; } .plus { color: var(--accent); font-weight: 800; } tr.bem td.over { background: var(--accent-svag); }
table.schema.period th:first-child, table.schema.period td:first-child { position: sticky; left: 0; background: var(--yta); z-index: 1; }
table.schema.period td, table.schema.period th { padding: 1px; } table.schema.period .ny-vecka { border-left: 2px solid var(--linje); }
@media (max-width: 560px) { .pass small { display: none; } .pass { padding: 6px 0; } }
@media (prefers-reduced-motion: reduce) { .matare div, #meddelande { transition: none; } }
details summary { cursor: pointer; color: var(--dampad); }

<script type="text/plain" id="motor-kod">// Schemamotor light: lägger cykliska grundscheman i webbläsaren utan server.
// Heuristik (simulerad glödgning) i stället för OR-Tools. Hårda regler (avtal, lag, kontrakt och
// lokala regler) väger mycket tyngre än vakanser; vakanser tyngre än block, rättvisa och önskemål.
// Fungerar i en Web Worker (postMessage) och i Node (module.exports) för tester.
"use strict";

const MOTOR = (() => {
  const DYGN = 1440;
  const DAGAR = ["mån", "tis", "ons", "tor", "fre", "lör", "sön"];
  const STD = {
    dygnsvila_minuter: 660, veckovila_minuter: 2160, rast_grans_minuter: 300, rast_minuter: 30,
    pass_per_vecka: 4.75, morgon_start: "07:00", kvall_slut: "22:00", kant_fran: "12:00", kant_till: "18:00",
    block_min: 2, block_max: 5, block_rekommenderat: 4, helgfrekvens: "2/4", hel_helg: true,
    ingen_fredagskvall_fore_ledig_helg: true, tolerans_minuter: 60, min_passlangd_minuter: 300,
  };
  const OFF = 0, M = 1, K = 2, NT = 3;
  const DELNAMN = { 1: "morgon", 2: "kvall", 3: "natt" };
  const HW = 1e6;      // hård regel
  const WV = 1e3;      // vakant pass
  const WB = 60;       // arbetsdagar i följd över rekommenderat
  const WF = 8;        // rättvisa (kvadratisk avvikelse i antal kvällar)
  const WO = 4;        // brutet önskemål per vikt

  const tid = s => { const [h, m] = String(s).split(":").map(Number); return h * 60 + m; };
  const klocka = m => { m = ((m % DYGN) + DYGN) % DYGN; return String(m / 60 | 0).padStart(2, "0") + ":" + String(m % 60).padStart(2, "0"); };
  const onsite = (net, r) => net > r.rast_grans_minuter ? net + r.rast_minuter : net;

  function slump(seed) {  // mulberry32
    let a = seed >>> 0;
    return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  }

  // ------------------------------------------------------------------ förberedelse
  function forbered(ind) {
    const fel = [];
    const r = { ...STD, ...(ind.regler || {}) };
    const W = ind.veckor | 0, N = W * 7;
    if (!(W >= 1 && W <= 16)) fel.push("Perioden måste vara 1–16 veckor.");
    const cyk = ind.cykliskt !== false;
    const heltid = ind.heltid_minuter_per_vecka || 2220;
    const np = (ind.nattpass && ind.nattpass[0]) || { start: "21:45", slut: "07:15", maltidsuppehall: true };
    const ns = tid(np.start); let ne = tid(np.slut); if (ne <= ns) ne += DYGN;
    const nRast = np.maltidsuppehall === false && ne - ns > r.rast_grans_minuter ? r.rast_minuter : 0;
    const nnet = ne - ns - nRast;
    const ms = tid(r.morgon_start), ks = tid(r.kvall_slut), kf = tid(r.kant_fran), kt = tid(r.kant_till);

    const behov = Array.from({ length: 7 }, () => [0, 0, 0, 0]);
    for (const [nyckel, v] of Object.entries(ind.behov || {})) {
      const idx = nyckel === "vardag" ? [0, 1, 2, 3, 4] : nyckel === "helg" ? [5, 6] : nyckel === "alla" ? [0, 1, 2, 3, 4, 5, 6] : [DAGAR.indexOf(nyckel)];
      if (idx[0] < 0) { fel.push(`Okänd dag i behovet: ${nyckel}.`); continue; }
      for (const i of idx) behov[i] = [0, v.morgon || 0, v.kvall || 0, v.natt || 0];
    }

    const pers = [], ids = new Set();
    for (const p of ind.personal || []) {
      if (!p.id) { fel.push("En person saknar id."); continue; }
      if (ids.has(p.id)) fel.push(`Samma id finns två gånger: ${p.id}.`);
      ids.add(p.id);
      const delar = p.dygnsdelar || ["morgon", "kvall"];
      const natt = delar.length === 1 && delar[0] === "natt";
      if (!(p.grad > 0 && p.grad <= 1)) { fel.push(`${p.id}: sysselsättningsgraden måste vara mellan 1 och 100 %.`); continue; }
      const malMin = Math.round((p.heltid_minuter_per_vecka || heltid) * p.grad * W);
      let P = Array.isArray(p.antal_pass) ? p.antal_pass.reduce((a, b) => a + b, 0) : p.antal_pass;
      if (P == null) {
        if (natt) P = Math.round(malMin / nnet);
        else {
          const x = r.pass_per_vecka * W;
          if (Math.abs(x - Math.round(x)) > 1e-9) {
            fel.push(`${p.id}: ${W} veckor × ${String(r.pass_per_vecka).replace(".", ",")} pass = ${String(x).replace(".", ",")}, inte ett heltal. Välj 4, 8, 12 eller 16 veckor, eller ange antal pass.`);
            continue;
          }
          P = Math.round(x);
          if (r.min_passlangd_minuter && malMin / P < r.min_passlangd_minuter) P = Math.max(1, Math.floor(malMin / r.min_passlangd_minuter));
        }
      }
      if (!(P > 0)) { fel.push(`${p.id}: antal pass måste vara minst 1.`); continue; }
      const typer = natt ? [NT] : delar.map(d => d === "morgon" ? M : K);
      const L = malMin / P;
      let bas = natt ? nnet : Math.floor(L / 15) * 15, k = 0;
      if (!natt) {
        k = Math.max(0, Math.min(P, Math.round((malMin - P * bas) / 15)));
        for (const net of k ? [bas, bas + 15] : [bas]) {
          const o = onsite(net, r);
          const okM = ms + o >= kf && ms + o <= kt, okK = ks - o >= kf && ks - o <= kt;
          if ((typer.includes(M) && !okM) || (typer.includes(K) && !okK)) {
            fel.push(`${p.id}: passen blir ${Math.floor(net / 60)} h ${net % 60} min arbetstid, vilket inte ryms i fönstret ${r.kant_fran}–${r.kant_till}. Ändra antal pass eller sysselsättningsgrad.`);
            break;
          }
        }
      }
      const frek = p.helgfrekvens || r.helgfrekvens;
      const tol = p.tolerans_minuter ?? (natt ? Math.max(r.tolerans_minuter, Math.ceil(nnet / 2)) : r.tolerans_minuter);
      pers.push({ id: p.id, natt, typer, P, malMin, L, bas, k, tol, frek, grupp: p.helggrupp === "A" ? 0 : p.helggrupp === "B" ? 1 : null, grad: p.grad });
    }
    if (!pers.length) fel.push("Lägg till minst en person.");

    for (const p of pers) {
      if (p.frek === "2/4" && cyk && W % 2) fel.push(`Varannan helg kräver ett jämnt antal veckor (${p.id}).`);
      if ((p.frek === "1/4" || p.frek === "3/4") && W % 4) fel.push(`${p.id}: helgfrekvens ${p.frek} kräver 4, 8, 12 eller 16 veckor.`);
    }

    // helggrupper: lika många i varje grupp per klass (dag/natt); fasta grupper räknas in
    for (const natt of [false, true]) {
      for (const [frek, n] of [["2/4", 2], ["1/4", 4], ["3/4", 4]]) {
        const lista = pers.filter(p => p.natt === natt && p.frek === frek);
        const antal = Array(n).fill(0);
        lista.filter(p => p.grupp != null).forEach(p => { p.grupp = p.grupp % n; antal[p.grupp]++; });
        lista.filter(p => p.grupp == null).sort((a, b) => b.grad - a.grad).forEach(p => {
          const g = antal.indexOf(Math.min(...antal)); p.grupp = g; antal[g]++;
        });
      }
    }
    for (const p of pers) {
      p.helg = Array.from({ length: W }, (_, w) =>
        p.frek === "alla" ? true : p.frek === "ingen" ? false : p.frek === "2/4" ? w % 2 === p.grupp :
        p.frek === "1/4" ? w % 4 === p.grupp : p.frek === "3/4" ? w % 4 !== p.grupp : w % 2 === 0);
      const helgdagar = 2 * p.helg.filter(Boolean).length;
      const vardagar = Array.from({ length: N }, (_, d) => d).filter(d => d % 7 < 5 && tillatna(p, d, r, W).length).length;
      if (p.P < helgdagar) fel.push(`${p.id}: ${p.P} pass räcker inte till ${helgdagar} helgdagar.`);
      else if (p.P - helgdagar > vardagar) fel.push(`${p.id}: ${p.P} pass ryms inte på de vardagar som är tillåtna.`);
    }

    // önskemål
    const onsk = [];
    (ind.onskemal || []).forEach((o, i) => {
      const pi = pers.findIndex(p => p.id === o.person);
      if (pi < 0) { fel.push(`Önskemål ${o.id || i + 1} gäller ${o.person}, som inte finns.`); return; }
      const dagar = [];
      if (Array.isArray(o.dagindex)) o.dagindex.forEach(d => dagar.push(((d % N) + N) % N));
      else {
        const dd = o.dagar && o.dagar.length ? o.dagar : DAGAR;
        const vv = o.veckor || "alla";
        for (let w = 0; w < W; w++) {
          const nr = ind.start_iso_vecka ? ind.start_iso_vecka + w : w + 1;
          if (vv === "alla" || (vv === "jämna" && nr % 2 === 0) || (vv === "udda" && nr % 2 === 1) || (Array.isArray(vv) && vv.includes(w + 1)))
            dd.forEach(x => dagar.push(w * 7 + DAGAR.indexOf(x)));
        }
      }
      onsk.push({ ...o, id: o.id || `O${i + 1}`, pi, dagar, vikt: o.vikt || 1, krav: !!o.krav });
    });

    // dygnsbryt för sökningen: där flest dag- och kvällspass byts
    const raknare = {};
    for (const p of pers) if (!p.natt) {
      const o = onsite(p.bas, r);
      if (p.typer.includes(M)) raknare[ms + o] = (raknare[ms + o] || 0) + p.P;
      if (p.typer.includes(K)) raknare[ks - o] = (raknare[ks - o] || 0) + p.P;
    }
    let db = ms + 8 * 60, bast = -1;
    for (let t = kf; t <= kt; t += 15) {
      const v = Object.entries(raknare).reduce((s, [g, n]) => s + (Math.abs(g - t) <= 30 ? n : 0), 0);
      if (v > bast) { bast = v; db = t; }
    }
    return { fel, r, W, N, cyk, behov, pers, onsk, ms, ks, ns, ne, nnet, nRast, db, nattDb: ne % DYGN, enhet: ind.enhet || "" };
  }

  function tillatna(p, d, r, W) {
    const w = Math.floor(d / 7), wd = d % 7;
    if (p.natt) {
      if (wd >= 5) return p.helg[w] ? [NT] : [];
      if (wd === 4) return p.helg[w] ? [NT] : [];   // fredagsnatt går in i helgen
      if (wd === 0) return [NT];
      return [NT];
    }
    if (wd >= 5) return p.helg[w] ? p.typer.slice() : [];
    if (wd === 4 && !p.helg[w] && r.ingen_fredagskvall_fore_ledig_helg) return p.typer.filter(t => t !== K);
    return p.typer.slice();
  }

  // ------------------------------------------------------------------ sökning
  function los(ind, opt = {}) {
    const pr = forbered(ind);
    if (pr.fel.length) return { status: "INDATAFEL", fel: pr.fel };
    const { r, W, N, cyk, behov, pers, onsk } = pr;
    const P = pers.length;
    const rnd = slump(opt.seed ?? 12345);
    const tidsgrans = opt.sekunder ?? 8;
    const rapport = opt.rapport || (() => {});
    const per = pers.map((p, pi) => ({ onsk: onsk.filter(o => o.pi === pi), tillat: Array.from({ length: N }, (_, d) => tillatna(p, d, r, W)) }));

    // passtider per person och typ (utan förlängning)
    const tider = pers.map(p => {
      const o = onsite(p.bas, r);
      return { 1: [pr.ms, pr.ms + o], 2: [pr.ks - o, pr.ks], 3: [pr.ns, pr.ne] };
    });

    // andel kvällar för rättvisa
    let mB = 0, kB = 0;
    for (let d = 0; d < N; d++) { mB += behov[d % 7][M]; kB += behov[d % 7][K]; }
    const kAndel = mB + kB ? kB / (mB + kB) : 0.5;

    function personKost(pi, x, ut) {
      const p = pers[pi], t = tider[pi];
      let hard = 0, block = 0, onskStraff = 0;
      const not = (regel, niva, text) => { if (ut) ut.push({ regel, niva, person: p.id, text }); };
      const dt = d => `vecka ${Math.floor(d / 7) + 1} ${DAGAR[d % 7]}`;
      // vila mellan pass: kväll följd av morgon
      for (let d = 0; d < N; d++) if (x[d] === K && (cyk || d < N - 1) && x[(d + 1) % N] === M) { hard++; not("DYGNSVILA", "avtal", `Kväll ${dt(d)} följs av morgon, för kort vila.`); }
      // block
      let start = -1;
      for (let d = 0; d < N; d++) if (!x[d]) { start = d; break; }
      if (start < 0) hard += 10;
      else {
        let len = 0;
        for (let i = 1; i <= N; i++) {
          const d = (start + i) % N;
          if (x[d]) len++;
          else if (len) {
            const kant = !cyk && (d - len <= 0 || d === N);
            if (len < r.block_min && !kant) { hard++; not("BLOCK_MIN", "lokal regel", `Enstaka arbetsdag ${dt((d - 1 + N) % N)}.`); }
            if (len > r.block_max) { hard += len - r.block_max; not("BLOCK_MAX", "lokal regel", `${len} arbetsdagar i följd fram till ${dt((d - 1 + N) % N)}.`); }
            if (len > r.block_rekommenderat) block++;
            len = 0;
          }
        }
      }
      // veckovila och dygnsvila
      const iv = d => {
        const dd = ((d % N) + N) % N;
        if (!cyk && dd !== d) return null;
        const typ = x[dd]; if (!typ) return null;
        return [d * DYGN + t[typ][0], d * DYGN + t[typ][1]];
      };
      const lucka = (a, b, d0, d1) => {
        let pos = a, best = 0;
        for (let d = d0; d <= d1; d++) {
          const v = iv(d); if (!v || v[1] <= a || v[0] >= b) continue;
          best = Math.max(best, Math.max(v[0], a) - pos); pos = Math.max(pos, Math.min(v[1], b));
        }
        return Math.max(best, b - pos);
      };
      for (let w = 0; w < W; w++) {
        const a = w * 7 * DYGN;
        if (lucka(a, a + 7 * DYGN, w * 7 - 1, w * 7 + 7) < r.veckovila_minuter) { hard++; not("VECKOVILA", "avtal", `Mindre än 36 timmars veckovila vecka ${w + 1}.`); }
      }
      const db = p.natt ? pr.nattDb : pr.db;
      for (let d = 0; d < (cyk ? N : N - 1); d++) {
        const a = d * DYGN + db;
        if (lucka(a, a + DYGN, d - 1, d + 2) < r.dygnsvila_minuter) { hard++; not("DYGNSVILA", "avtal", `Mindre än 11 timmars dygnsvila från ${dt(d)}.`); }
      }
      // önskemål
      for (const o of per[pi].onsk) {
        for (const d of o.dagar) {
          const typ = x[d];
          let bryt = false;
          if (o.typ === "ledig") bryt = !!typ;
          else if (o.typ === "arbetar") bryt = !typ;
          else if (typ && o.typ === "tidigast_start") bryt = t[typ][0] < tid(o.varde);
          else if (typ && o.typ === "senast_slut") bryt = t[typ][1] > tid(o.varde);
          else if (typ && o.typ === "endast_dygnsdel") bryt = ![].concat(o.varde).includes(DELNAMN[typ]);
          if (bryt) { if (o.krav) { hard++; not("KRAV", "önskemål som krav", `Krav ${o.id} (${o.typ.replace("_", " ")}) bryts ${dt(d)}.`); } else onskStraff += o.vikt; }
        }
      }
      // rättvisa
      let f = 0;
      if (p.typer.length > 1) {
        let kv = 0; for (let d = 0; d < N; d++) if (x[d] === K) kv++;
        f = (kv - p.P * kAndel) ** 2;
      }
      return { hard, block, onsk: onskStraff, f, summa: hard * HW + block * WB + onskStraff * WO + f * WF };
    }

    function bygg() {
      const X = pers.map((p, pi) => {
        const x = new Array(N).fill(OFF);
        let kvar = p.P;
        for (let w = 0; w < W; w++) if (p.helg[w]) for (const d of [w * 7 + 5, w * 7 + 6]) {
          const a = per[pi].tillat[d]; x[d] = a[Math.floor(rnd() * a.length)]; kvar--;
        }
        const lediga = [];
        for (let d = 0; d < N; d++) if (d % 7 < 5 && per[pi].tillat[d].length) lediga.push(d);
        for (let i = lediga.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [lediga[i], lediga[j]] = [lediga[j], lediga[i]]; }
        for (let i = 0; i < Math.max(0, kvar); i++) {
          const d = lediga[i], a = per[pi].tillat[d]; x[d] = a[Math.floor(rnd() * a.length)];
        }
        return x;
      });
      return X;
    }

    function vakans(cnt, d, t) { return Math.max(0, behov[d % 7][t] - cnt[d][t]); }

    let bastX = null, bastKost = Infinity;
    const start = Date.now();
    const omstarter = opt.omstarter ?? 3;
    for (let om = 0; om < omstarter; om++) {
      const X = bygg();
      const cnt = Array.from({ length: N }, () => [0, 0, 0, 0]);
      X.forEach(x => x.forEach((t, d) => { if (t) cnt[d][t]++; }));
      const pk = X.map((x, pi) => personKost(pi, x));
      let vak = 0;
      for (let d = 0; d < N; d++) for (let t = 1; t <= 3; t++) vak += vakans(cnt, d, t);
      let kost = pk.reduce((s, k) => s + k.summa, 0) + vak * WV;
      let lokalBast = kost, lokalX = X.map(x => x.slice());
      const budget = tidsgrans * 1000 / omstarter;
      const t0 = Date.now();
      let T = 3000, iter = 0;
      const Tslut = 0.3;
      while (true) {
        iter++;
        if ((iter & 1023) === 0) {
          const andel = (Date.now() - t0) / budget;
          if (andel >= 1) break;
          T = 3000 * Math.pow(Tslut / 3000, andel);
          if ((iter & 32767) === 0) rapport({ andel: (om + andel) / omstarter, kost: Math.min(lokalBast, bastKost) });
        }
        const pi = Math.floor(rnd() * P), x = X[pi], p = pers[pi];
        const v = rnd();
        let andrade = [];  // [pi, d, gammal]
        let pj = -1;
        if (v < 0.55) {  // flytta ett pass mellan två vardagar
          const d1 = Math.floor(rnd() * N), d2 = Math.floor(rnd() * N);
          if (d1 % 7 >= 5 || d2 % 7 >= 5 || !x[d1] || x[d2]) continue;
          const a = per[pi].tillat[d2]; if (!a.length) continue;
          andrade = [[pi, d1, x[d1]], [pi, d2, OFF]];
          x[d2] = a[Math.floor(rnd() * a.length)]; x[d1] = OFF;
        } else if (v < 0.85) {  // byt dygnsdel
          if (p.typer.length < 2) continue;
          const d = Math.floor(rnd() * N); if (!x[d]) continue;
          const a = per[pi].tillat[d].filter(t => t !== x[d]); if (!a.length) continue;
          andrade = [[pi, d, x[d]]]; x[d] = a[Math.floor(rnd() * a.length)];
        } else {  // två personer byter dygnsdel samma dag
          pj = Math.floor(rnd() * P); if (pj === pi) continue;
          const d = Math.floor(rnd() * N), y = X[pj];
          if (!x[d] || !y[d] || x[d] === y[d]) continue;
          if (!per[pi].tillat[d].includes(y[d]) || !per[pj].tillat[d].includes(x[d])) continue;
          andrade = [[pi, d, x[d]], [pj, d, y[d]]];
          const tmp = x[d]; x[d] = y[d]; y[d] = tmp;
        }
        // delta
        let delta = 0;
        const vakFore = {}, berorda = new Set();
        for (const [q, d, gammal] of andrade) {
          berorda.add(q);
          for (const t of [gammal, X[q][d]]) if (t) { const n = d * 4 + t; if (!(n in vakFore)) vakFore[n] = vakans(cnt, d, t); }
        }
        for (const [q, d, gammal] of andrade) { if (gammal) cnt[d][gammal]--; if (X[q][d]) cnt[d][X[q][d]]++; }
        for (const n in vakFore) delta += (vakans(cnt, Math.floor(n / 4), n % 4) - vakFore[n]) * WV;
        const nya = {};
        for (const q of berorda) { nya[q] = personKost(q, X[q]); delta += nya[q].summa - pk[q].summa; }
        if (delta <= 0 || rnd() < Math.exp(-delta / T)) {
          kost += delta;
          for (const q of berorda) pk[q] = nya[q];
          if (kost < lokalBast - 1e-9) { lokalBast = kost; lokalX = X.map(x => x.slice()); }
        } else {
          for (const [q, d, gammal] of andrade) { if (X[q][d]) cnt[d][X[q][d]]--; if (gammal) cnt[d][gammal]++; }
          for (let i = andrade.length - 1; i >= 0; i--) { const [q, d, gammal] = andrade[i]; X[q][d] = gammal; }
        }
      }
      if (lokalBast < bastKost) { bastKost = lokalBast; bastX = lokalX; }
      if (bastKost < WV) break;  // inga hårda brott och inga vakanser: bra nog
    }
    rapport({ andel: 1, kost: bastKost });
    return resultat(pr, bastX, tider, personKost, (Date.now() - start) / 1000);
  }

  // ------------------------------------------------------------------ resultat och passlängder
  function resultat(pr, X, tider, personKost, sekunder) {
    const { r, W, N, cyk, behov, pers } = pr;
    const schema = {}, personer = {};
    let hardTotalt = 0, block = 0, onskStraff = 0, passlangd = 0;
    const brott = [];
    const kvallar = [];
    pers.forEach((p, pi) => {
      const x = X[pi], k = personKost(pi, x, brott);
      hardTotalt += k.hard; block += k.block; onskStraff += k.onsk;
      const rad = x.map((t, d) => {
        if (!t) return null;
        if (t === NT) return { mall: "N", dygnsdel: "natt", start: klocka(pr.ns), slut: klocka(pr.ne), rast: pr.nRast, netto: pr.nnet, ...(pr.nRast ? {} : { maltidsuppehall: true }) };
        const net = p.bas, o = onsite(net, r);
        const [s, e] = t === M ? [pr.ms, pr.ms + o] : [pr.ks - o, pr.ks];
        return { mall: (t === M ? "M" : "K") + klocka(s) + "-" + klocka(e), dygnsdel: DELNAMN[t], start: klocka(s), slut: klocka(e), rast: o - net, netto: net };
      });
      // förläng k pass med 15 minuter där vilan räcker
      if (!p.natt && p.k) {
        const dagar = rad.map((v, d) => v ? d : -1).filter(d => d >= 0);
        let kvar = p.k;
        const ordning = dagar.slice().sort((a, b) => ((a * 7919) % 97) - ((b * 7919) % 97));
        for (const d of ordning) {
          if (!kvar) break;
          const v = rad[d], net = v.netto + 15, o = onsite(net, r);
          const forsok = v.dygnsdel === "morgon" ? { ...v, slut: klocka(pr.ms + o) } : { ...v, start: klocka(pr.ks - o) };
          forsok.netto = net; forsok.rast = o - net; forsok.mall = (v.dygnsdel === "morgon" ? "M" : "K") + forsok.start + "-" + forsok.slut;
          const gammal = rad[d]; rad[d] = forsok;
          if (vilaOk(rad, pr, p)) kvar--; else rad[d] = gammal;
        }
      }
      schema[p.id] = rad;
      const minuter = rad.reduce((s, v) => s + (v ? v.netto : 0), 0);
      const kv = rad.filter(v => v && v.dygnsdel === "kvall").length;
      if (p.typer.length > 1) kvallar.push(kv);
      passlangd += rad.reduce((s, v) => s + (v ? Math.abs(v.netto - p.L) : 0), 0) + Math.abs(minuter - p.malMin);
      personer[p.id] = { pass: rad.filter(Boolean).length, minuter, mal_minuter: p.malMin, kvallspass: kv,
        helggrupp: p.frek === "2/4" ? (p.grupp === 0 ? "A" : "B") : null, helgfrekvens: p.frek };
    });
    const vakanser = [];
    let vak = 0;
    for (let d = 0; d < N; d++) for (let t = 1; t <= 3; t++) {
      const n = pers.reduce((s, p, pi) => s + (X[pi][d] === t ? 1 : 0), 0), b = behov[d % 7][t];
      if (n < b) { vak += b - n; vakanser.push({ dag: d, vecka: Math.floor(d / 7) + 1, veckodag: DAGAR[d % 7], dygnsdel: DELNAMN[t], tid: null, antal: b - n }); }
    }
    return {
      status: hardTotalt ? "BROTT" : "OK", motor: "light", enhet: pr.enhet, veckor: W, cykliskt: cyk, sekunder: Math.round(sekunder * 10) / 10,
      kpi: { vakanser: vak, vakanta_pass: vak, vakanta_tidpunkter: 0, blocklangd: block, passlangd: Math.round(passlangd),
        rattvisa: kvallar.length ? Math.max(...kvallar) - Math.min(...kvallar) : 0, onskemal: onskStraff, hardregelbrott: hardTotalt },
      personer, vakanser, schema, brott,
    };
  }

  function vilaOk(rad, pr, p) {
    const { r, N, W, cyk } = pr;
    const L = N * DYGN;
    let iv = [];
    rad.forEach((v, d) => { if (v) { const s = d * DYGN + tid(v.start); let e = d * DYGN + tid(v.slut); if (e <= s) e += DYGN; iv.push([s, e]); } });
    if (cyk) iv = iv.concat(iv.map(([s, e]) => [s - L, e - L]), iv.map(([s, e]) => [s + L, e + L]));
    iv.sort((a, b) => a[0] - b[0]);
    const lucka = (a, b) => { let pos = a, best = 0; for (const [s, e] of iv) { if (e <= a || s >= b) continue; best = Math.max(best, Math.max(s, a) - pos); pos = Math.max(pos, Math.min(e, b)); } return Math.max(best, b - pos); };
    for (let i = 1; i < iv.length; i++) if (iv[i][0] - iv[i - 1][1] < r.dygnsvila_minuter && iv[i][0] >= 0 && iv[i][0] < L) return false;
    for (let w = 0; w < W; w++) if (lucka(w * 7 * DYGN, (w + 1) * 7 * DYGN) < r.veckovila_minuter) return false;
    const db = p.natt ? pr.nattDb : pr.db;
    for (let d = 0; d < N; d++) if (lucka(d * DYGN + db, d * DYGN + db + DYGN) < r.dygnsvila_minuter) return false;
    return true;
  }

  // ------------------------------------------------------------------ bemanningsbalans
  function balans(ind) {
    const pr = forbered(ind);
    if (pr.fel.length) return { fel: pr.fel };
    const { r, W, N, behov, pers } = pr;
    const b = (d, t) => behov[d % 7][t];
    const dag = pers.filter(p => !p.natt), natt = pers.filter(p => p.natt);
    const sum = (l, f) => l.reduce((s, x) => s + f(x), 0);
    let behovDK = 0, behovN = 0, vardagDK = 0, vardagN = 0;
    for (let d = 0; d < N; d++) { behovDK += b(d, M) + b(d, K); behovN += b(d, NT); if (d % 7 < 5) { vardagDK += b(d, M) + b(d, K); vardagN += b(d, NT); } }
    const tillDK = sum(dag, p => p.P), tillN = sum(natt, p => p.P);
    let vakHelg = 0, fredag = 0, helgDK = 0, helgN = 0;
    const helger = [];
    for (let w = 0; w < W; w++) {
      const fre = w * 7 + 4, lor = w * 7 + 5, son = w * 7 + 6;
      const bada = dag.filter(p => p.helg[w] && p.typer.length > 1).length;
      const mo = dag.filter(p => p.helg[w] && p.typer.length === 1 && p.typer[0] === M).length;
      const kv = dag.filter(p => p.helg[w] && p.typer.length === 1 && p.typer[0] === K).length;
      const nw = natt.filter(p => p.helg[w]).length;
      const mB = Math.max(b(lor, M), b(son, M)), kB = Math.max(b(lor, K), b(son, K));
      const kF = r.ingen_fredagskvall_fore_ledig_helg ? Math.max(kB, b(fre, K)) : kB;
      const brist = kb => Math.max(0, Math.max(0, kb - kv) + Math.max(0, mB - mo) - bada);
      const bDK = brist(kF);
      fredag += bDK - brist(kB);
      const nB = Math.max(r.ingen_fredagskvall_fore_ledig_helg ? b(fre, NT) : 0, b(lor, NT), b(son, NT));
      const bN = Math.max(0, nB - nw);
      vakHelg += bDK + bN; helgDK += 2 * (bada + mo + kv); helgN += 2 * nw;
      helger.push({ vecka: w + 1, arbetar: bada + mo + kv, behov: mB + kF, natt: nw, nattbehov: nB, vakanser: bDK + bN });
    }
    const vakVDK = Math.max(0, vardagDK - (tillDK - helgDK)), vakVN = Math.max(0, vardagN - (tillN - helgN));
    const atgarder = [];
    if (vakVDK) atgarder.push(`Det saknas cirka ${vakVDK} dag- och kvällspass på vardagar. En person till ger ${String(r.pass_per_vecka * W).replace(".", ",")} pass.`);
    if (vakVN) atgarder.push(`Det saknas cirka ${vakVN} nattpass på vardagar. Utöka nattpersonalen.`);
    if (fredag) atgarder.push(`Fredagskvällarna ger ${fredag} ${fredag === 1 ? "vakant pass" : "vakanta pass"}: den som är ledig helgen arbetar inte fredag kväll, och den som arbetar fredag kväll kan inte ta morgon på lördagen. Sänk behovet fredag kväll eller låt fler arbeta helg.`);
    if (vakHelg - fredag > 0) atgarder.push(`Helgerna räcker inte till (vecka ${helger.filter(h => h.vakanser).map(h => h.vecka).join(", ")}). Sänk helgbehovet eller utöka personalen.`);
    return { forvantade_vakanser: vakHelg + vakVDK + vakVN, behovDK, tillDK, behovN, tillN, helger, atgarder };
  }

  return { los, balans, forbered, DAGAR };
})();

if (typeof module !== "undefined") module.exports = MOTOR;
if (typeof self !== "undefined" && typeof window === "undefined" && typeof module === "undefined") {
  self.onmessage = e => {
    try {
      const res = MOTOR.los(e.data.indata, { sekunder: e.data.sekunder, seed: e.data.seed, rapport: m => self.postMessage({ typ: "framsteg", ...m }) });
      self.postMessage({ typ: "klar", resultat: res });
    } catch (err) { self.postMessage({ typ: "fel", fel: String(err && err.message || err) }); }
  };
}

<script>// Fristående granskning av ett färdigt schema, översatt från schemamotor/validate.py.
// Delar ingen kod med light/motor.js, så att den kan fånga fel i motorn.
"use strict";

const GRANSKNING = (() => {
  const DAGNAMN = ["mån", "tis", "ons", "tor", "fre", "lör", "sön"];
  const DYGN = 1440;
  const STANDARD = {
    dygnsvila_minuter: 660, veckovila_minuter: 2160, dygnsbryt: "auto", veckobryt: "mån 00:00",
    rast_grans_minuter: 300, rast_minuter: 30, pass_per_vecka: 4.75, morgon_start: "07:00",
    kvall_slut: "22:00", kant_fran: "12:00", kant_till: "18:00", block_min: 2, block_max: 5,
    block_rekommenderat: 4, helg_start: "fre 22:00", helg_slut: "mån 06:00", hel_helg: true,
    helgfrekvens: "2/4", ingen_fredagskvall_fore_ledig_helg: true, tolerans_minuter: 60, min_passlangd_minuter: 300,
  };
  const NIVA = { DYGNSVILA: "avtal", VECKOVILA: "avtal", RAST: "lag", ANTAL_PASS: "kontrakt", TID: "kontrakt",
    HELG: "lokal regel", BLOCK_MIN: "lokal regel", BLOCK_MAX: "lokal regel", PASSFONSTER: "princip",
    BLOCK_REKOMMENDERAT: "princip", BEHOV: "verksamhet" };

  const tid = s => { const [h, m] = s.trim().split(":").map(Number); return h * 60 + m; };
  const klocka = m => { m = ((m % DYGN) + DYGN) % DYGN; return `${String(Math.floor(m / 60)).padStart(2, "0")}:${String(m % 60).padStart(2, "0")}`; };
  const veckotid = s => { const [d, k] = s.split(" "); return DAGNAMN.indexOf(d) * DYGN + tid(k); };
  const dagText = d => `vecka ${Math.floor(d / 7) + 1} ${DAGNAMN[d % 7]}`;
  const h = m => (m / 60).toFixed(1).replace(".", ",");

  function langstaLucka(iv, a, b) {

    return Math.max(langst, b - pos);
  }

  function foreslaDygnsbryt(alla, r) {
    const fran = tid(r.kant_fran), till = tid(r.kant_till), granser = new Map();
    for (const lista of Object.values(alla)) for (const [, s, e, p] of lista) {
      if (p.dygnsdel === "natt") continue;
      for (const g of [s % DYGN, e % DYGN]) if (g >= fran && g <= till) granser.set(g, (granser.get(g) || 0) + 1);

        if (!p) return;

        alla[pid].push([d, d * DYGN + s, d * DYGN + e, p]);

    }
    const dbDag = r.dygnsbryt === "auto" ? foreslaDygnsbryt(alla, r) : tid(r.dygnsbryt);
    const vb = veckotid(r.veckobryt);
    const personer = Object.fromEntries((indata.personal || []).map(p => [p.id, p]));

    for (const [pid, lista] of Object.entries(alla)) {
      let iv = lista.map(([, s, e]) => [s, e]);
      if (cyk) iv = iv.concat(iv.map(([s, e]) => [s - L, e - L]), iv.map(([s, e]) => [s + L, e + L]));
      const pers = personer[pid] || {};
      const natt = JSON.stringify(pers.dygnsdelar) === '["natt"]';
      let db = dbDag;
      if (pers.dygnsbryt) db = tid(pers.dygnsbryt);
      else if (natt && lista.length) {
        const c = new Map(); lista.forEach(([, , e]) => c.set(e % DYGN, (c.get(e % DYGN) || 0) + 1));
        db = [...c.entries()].sort((a, b) => b[1] - a[1])[0][0];
      }
      const sort = lista.slice().sort((a, b) => a[1] - b[1]);
      const par = sort.slice(1).map((v, i) => [sort[i], v]);
      if (cyk && sort.length > 1) par.push([sort.at(-1), [sort[0][0] + N, sort[0][1] + L, sort[0][2] + L]]);
      for (const [[d1, , e1], [d2, s2]] of par) {
        if (s2 < e1) brott("DYGNSVILA", pid, `Pass överlappar (${dagText(d1)} och ${dagText(d2 % N)}).`);
        else if (s2 - e1 < r.dygnsvila_minuter) brott("DYGNSVILA", pid, `Bara ${h(s2 - e1)} h vila mellan passet ${dagText(d1)} och passet ${dagText(d2 % N)}.`);
      }
      for (let d = 0; d < (cyk ? N : N - 1); d++) {
        const a = d * DYGN + db;
        if (langstaLucka(iv, a, a + DYGN) < r.dygnsvila_minuter) brott("DYGNSVILA", pid, `Ingen sammanhängande dygnsvila på 11 h i perioden från ${dagText(d)} kl ${klocka(db)}.`);
      }
      for (let w = 0; w < (cyk ? W : W - 1); w++) {
        const a = w * 7 * DYGN + vb, l = langstaLucka(iv, a, a + 7 * DYGN);
        if (l < r.veckovila_minuter) brott("VECKOVILA", pid, `Längsta vila vecka ${w + 1} är ${h(l)} h (minst 36 h).`);
      }
      const arbetstider = [];
      for (const [d, s, e, p] of lista) {

        arbetstider.push(arb);
        if (!p.maltidsuppehall && paPlats - rast > r.rast_grans_minuter) {
          if (rast < r.rast_minuter) brott("RAST", pid, `${dagText(d)} ${p.start}–${p.slut}: över 5 h arbete utan rast.`);
          else if (paPlats - rast > 2 * r.rast_grans_minuter) brott("RAST", pid, `${dagText(d)} ${p.start}–${p.slut}: rasten kan inte placeras så att ingen del blir över 5 h.`);
        }
        if (p.dygnsdel === "morgon" && (s % DYGN !== tid(r.morgon_start) || e % DYGN < tid(r.kant_fran) || e % DYGN > tid(r.kant_till)))
          brott("PASSFONSTER", pid, `${dagText(d)}: morgonpass ${p.start}–${p.slut} följer inte fönstret.`);
        if (p.dygnsdel === "kvall" && (e % DYGN !== tid(r.kvall_slut) || s % DYGN < tid(r.kant_fran) || s % DYGN > tid(r.kant_till)))
          brott("PASSFONSTER", pid, `${dagText(d)}: kvällspass ${p.start}–${p.slut} följer inte fönstret.`);
      }

      for (let d = cyk ? 0 : 1; d < (cyk ? N : N - 1); d++)
        if (work[d] && !work[(d - 1 + N) % N] && !work[(d + 1) % N]) brott("BLOCK_MIN", pid, `Enstaka arbetsdag ${dagText(d)}.`);
      for (const [regel, grans, hard] of [["BLOCK_MAX", r.block_max, true], ["BLOCK_REKOMMENDERAT", r.block_rekommenderat, false]]) {
        for (let d = 0; d < (cyk ? N : N - grans); d++) {
          let alla_ = true; for (let k = 0; k <= grans; k++) if (!work[(d + k) % N]) { alla_ = false; break; }
          if (alla_ && (!work[(d - 1 + N) % N] || (!cyk && d === 0))) {
            let langd = grans + 1; while (langd < N && work[(d + langd) % N]) langd++;
            brott(regel, pid, `${langd} arbetsdagar i följd från ${dagText(d)} (gräns ${grans}).`, hard);
          }
        }
      }
      const hs = veckotid(r.helg_start), he = veckotid(r.helg_slut), helger = [];
      for (let w = 0; w < W; w++) {
        const a = w * 7 * DYGN + hs, b = (w + 1) * 7 * DYGN + he;
        const jobbar = iv.some(([s, e]) => e > a && s < b);
        helger.push(jobbar);
        if (jobbar && r.hel_helg && !(work[w * 7 + 5] && work[w * 7 + 6])) brott("HELG", pid, `Arbetar helgen vecka ${w + 1} men inte både lördag och söndag.`);
        if (!jobbar && r.ingen_fredagskvall_fore_ledig_helg)
          for (const [d, , , p] of lista) if (d === w * 7 + 4 && (p.dygnsdel === "kvall" || p.dygnsdel === "natt")) brott("HELG", pid, `Kvällspass fredag vecka ${w + 1} före ledig helg.`);
      }
      const frek = pers.helgfrekvens || r.helgfrekvens, antal = helger.filter(Boolean).length;
      if (frek === "2/4") {
        for (let w = 0; w < (cyk ? W : W - 1); w++) if (helger[w] === helger[(w + 1) % W]) { brott("HELG", pid, "Helgerna växlar inte varannan: " + helger.map(x => x ? "J" : "L").join("") + "."); break; }
      } else if (frek === "alla" && antal !== W) brott("HELG", pid, `Ska arbeta alla helger, arbetar ${antal} av ${W}.`);
      else if (frek === "ingen" && antal) brott("HELG", pid, `Ska inte arbeta helg, arbetar ${antal}.`);
      else if (frek === "1/4" || frek === "3/4") {
        const [t, n] = frek.split("/").map(Number);
        if (antal !== Math.round(W * t / n)) brott("HELG", pid, `Helgfrekvens ${frek} ger ${W * t / n} helger, arbetar ${antal}.`);
      }
      const heltid = pers.heltid_minuter_per_vecka || indata.heltid_minuter_per_vecka || 2220;
      const malMin = Math.round(heltid * (pers.grad ?? 1) * W);
      let mal = pers.antal_pass;
      if (Array.isArray(mal)) mal = mal.reduce((a, b) => a + b, 0);
      if (mal == null && !natt) {
        mal = Math.round(r.pass_per_vecka * W);
        if (r.min_passlangd_minuter && malMin / mal < r.min_passlangd_minuter) mal = Math.max(1, Math.floor(malMin / r.min_passlangd_minuter));
      }
      const faktiskt = work.reduce((a, b) => a + b, 0);
      if (mal != null && faktiskt !== mal) brott("ANTAL_PASS", pid, `${faktiskt} pass, ska vara ${mal}.`);
      let tol = pers.tolerans_minuter;
      if (tol == null) { tol = r.tolerans_minuter; if (natt && arbetstider.length) tol = Math.max(tol, Math.ceil(Math.min(...arbetstider) / 2)); }
      const arb = arbetstider.reduce((a, b) => a + b, 0);
      if (Math.abs(arb - malMin) > tol) brott("TID", pid, `Arbetstid ${h(arb)} h, kontrakterat ${h(malMin)} h (tolerans ${tol} min).`);
    }

    const behov = Array.from({ length: 7 }, () => ({}));
    for (const [k, v] of Object.entries(indata.behov || {})) {
      const idx = k === "vardag" ? [0, 1, 2, 3, 4] : k === "helg" ? [5, 6] : k === "alla" ? [0, 1, 2, 3, 4, 5, 6] : [DAGNAMN.indexOf(k)];
      idx.forEach(i => (behov[i] = v));
    }
    let vakanser = 0;
    for (let d = 0; d < N; d++) for (const [del, antal] of Object.entries(behov[d % 7])) {
      let n = 0; for (const l of Object.values(alla)) for (const [dd, , , p] of l) if (dd === d && p.dygnsdel === del) n++;
      if (n < antal) { vakanser += antal - n; brott("BEHOV", null, `${dagText(d)}: ${antal - n} vakant ${del === "kvall" ? "kvälls" : del}pass.`, false); }
    }
    return { giltigt: !fel.length, dygnsbryt: klocka(dbDag), veckobryt: r.veckobryt, brott: fel, varningar: varn, vakanser };
  }
  return { kontrollera };
})();

<script>// Schemamotor light: lägger cykliska grundscheman i webbläsaren utan server.
// Heuristik (simulerad glödgning) i stället för OR-Tools. Hårda regler (avtal, lag, kontrakt och
// lokala regler) väger mycket tyngre än vakanser; vakanser tyngre än block, rättvisa och önskemål.
// Fungerar i en Web Worker (postMessage) och i Node (module.exports) för tester.
"use strict";

const MOTOR = (() => {
  const DYGN = 1440;
  const DAGAR = ["mån", "tis", "ons", "tor", "fre", "lör", "sön"];
  const STD = {
    dygnsvila_minuter: 660, veckovila_minuter: 2160, rast_grans_minuter: 300, rast_minuter: 30,
    pass_per_vecka: 4.75, morgon_start: "07:00", kvall_slut: "22:00", kant_fran: "12:00", kant_till: "18:00",
    block_min: 2, block_max: 5, block_rekommenderat: 4, helgfrekvens: "2/4", hel_helg: true,
    ingen_fredagskvall_fore_ledig_helg: true, tolerans_minuter: 60, min_passlangd_minuter: 300,
  };
  const OFF = 0, M = 1, K = 2, NT = 3;
  const DELNAMN = { 1: "morgon", 2: "kvall", 3: "natt" };
  const HW = 1e6;      // hård regel
  const WV = 1e3;      // vakant pass
  const WB = 60;       // arbetsdagar i följd över rekommenderat
  const WF = 8;        // rättvisa (kvadratisk avvikelse i antal kvällar)
  const WO = 4;        // brutet önskemål per vikt

  const tid = s => { const [h, m] = String(s).split(":").map(Number); return h * 60 + m; };
  const klocka = m => { m = ((m % DYGN) + DYGN) % DYGN; return String(m / 60 | 0).padStart(2, "0") + ":" + String(m % 60).padStart(2, "0"); };
  const onsite = (net, r) => net > r.rast_grans_minuter ? net + r.rast_minuter : net;

  function slump(seed) {  // mulberry32
    let a = seed >>> 0;
    return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  }

  // ------------------------------------------------------------------ förberedelse
  function forbered(ind) {
    const fel = [];
    const r = { ...STD, ...(ind.regler || {}) };
    const W = ind.veckor | 0, N = W * 7;
    if (!(W >= 1 && W <= 16)) fel.push("Perioden måste vara 1–16 veckor.");
    const cyk = ind.cykliskt !== false;
    const heltid = ind.heltid_minuter_per_vecka || 2220;
    const np = (ind.nattpass && ind.nattpass[0]) || { start: "21:45", slut: "07:15", maltidsuppehall: true };
    const ns = tid(np.start); let ne = tid(np.slut); if (ne <= ns) ne += DYGN;
    const nRast = np.maltidsuppehall === false && ne - ns > r.rast_grans_minuter ? r.rast_minuter : 0;
    const nnet = ne - ns - nRast;
    const ms = tid(r.morgon_start), ks = tid(r.kvall_slut), kf = tid(r.kant_fran), kt = tid(r.kant_till);

    const behov = Array.from({ length: 7 }, () => [0, 0, 0, 0]);
    for (const [nyckel, v] of Object.entries(ind.behov || {})) {
      const idx = nyckel === "vardag" ? [0, 1, 2, 3, 4] : nyckel === "helg" ? [5, 6] : nyckel === "alla" ? [0, 1, 2, 3, 4, 5, 6] : [DAGAR.indexOf(nyckel)];
      if (idx[0] < 0) { fel.push(`Okänd dag i behovet: ${nyckel}.`); continue; }
      for (const i of idx) behov[i] = [0, v.morgon || 0, v.kvall || 0, v.natt || 0];
    }

    const pers = [], ids = new Set();
    for (const p of ind.personal || []) {
      if (!p.id) { fel.push("En person saknar id."); continue; }
      if (ids.has(p.id)) fel.push(`Samma id finns två gånger: ${p.id}.`);
      ids.add(p.id);
      const delar = p.dygnsdelar || ["morgon", "kvall"];
      const natt = delar.length === 1 && delar[0] === "natt";
      if (!(p.grad > 0 && p.grad <= 1)) { fel.push(`${p.id}: sysselsättningsgraden måste vara mellan 1 och 100 %.`); continue; }
      const malMin = Math.round((p.heltid_minuter_per_vecka || heltid) * p.grad * W);
      let P = Array.isArray(p.antal_pass) ? p.antal_pass.reduce((a, b) => a + b, 0) : p.antal_pass;
      if (P == null) {
        if (natt) P = Math.round(malMin / nnet);
        else {
          const x = r.pass_per_vecka * W;
          if (Math.abs(x - Math.round(x)) > 1e-9) {
            fel.push(`${p.id}: ${W} veckor × ${String(r.pass_per_vecka).replace(".", ",")} pass = ${String(x).replace(".", ",")}, inte ett heltal. Välj 4, 8, 12 eller 16 veckor, eller ange antal pass.`);
            continue;
          }
          P = Math.round(x);
          if (r.min_passlangd_minuter && malMin / P < r.min_passlangd_minuter) P = Math.max(1, Math.floor(malMin / r.min_passlangd_minuter));
        }
      }
      if (!(P > 0)) { fel.push(`${p.id}: antal pass måste vara minst 1.`); continue; }
      const typer = natt ? [NT] : delar.map(d => d === "morgon" ? M : K);
      const L = malMin / P;
      let bas = natt ? nnet : Math.floor(L / 15) * 15, k = 0;
      if (!natt) {
        k = Math.max(0, Math.min(P, Math.round((malMin - P * bas) / 15)));
        for (const net of k ? [bas, bas + 15] : [bas]) {
          const o = onsite(net, r);
          const okM = ms + o >= kf && ms + o <= kt, okK = ks - o >= kf && ks - o <= kt;
          if ((typer.includes(M) && !okM) || (typer.includes(K) && !okK)) {
            fel.push(`${p.id}: passen blir ${Math.floor(net / 60)} h ${net % 60} min arbetstid, vilket inte ryms i fönstret ${r.kant_fran}–${r.kant_till}. Ändra antal pass eller sysselsättningsgrad.`);
            break;

      const frek = p.helgfrekvens || r.helgfrekvens;
      const tol = p.tolerans_minuter ?? (natt ? Math.max(r.tolerans_minuter, Math.ceil(nnet / 2)) : r.tolerans_minuter);
      pers.push({ id: p.id, natt, typer, P, malMin, L, bas, k, tol, frek, grupp: p.helggrupp === "A" ? 0 : p.helggrupp === "B" ? 1 : null, grad: p.grad });
    }
    if (!pers.length) fel.push("Lägg till minst en person.");

    for (const p of pers) {
      if (p.frek === "2/4" && cyk && W % 2) fel.push(`Varannan helg kräver ett jämnt antal veckor (${p.id}).`);
      if ((p.frek === "1/4" || p.frek === "3/4") && W % 4) fel.push(`${p.id}: helgfrekvens ${p.frek} kräver 4, 8, 12 eller 16 veckor.`);
    }

    // helggrupper: lika många i varje grupp per klass (dag/natt); fasta grupper räknas in
    for (const natt of [false, true]) {
      for (const [frek, n] of [["2/4", 2], ["1/4", 4], ["3/4", 4]]) {
        const lista = pers.filter(p => p.natt === natt && p.frek === frek);
        const antal = Array(n).fill(0);
        lista.filter(p => p.grupp != null).forEach(p => { p.grupp = p.grupp % n; antal[p.grupp]++; });
        lista.filter(p => p.grupp == null).sort((a, b) => b.grad - a.grad).forEach(p => {
          const g = antal.indexOf(Math.min(...antal)); p.grupp = g; antal[g]++;

    }

        p.frek === "alla" ? true : p.frek === "ingen" ? false : p.frek === "2/4" ? w % 2 === p.grupp :
        p.frek === "1/4" ? w % 4 === p.grupp : p.frek === "3/4" ? w % 4 !== p.grupp : w % 2 === 0);

      if (p.P < helgdagar) fel.push(`${p.id}: ${p.P} pass räcker inte till ${helgdagar} helgdagar.`);
      else if (p.P - helgdagar > vardagar) fel.push(`${p.id}: ${p.P} pass ryms inte på de vardagar som är tillåtna.`);
    }

    // önskemål
    const onsk = [];
    (ind.onskemal || []).forEach((o, i) => {
      const pi = pers.findIndex(p => p.id === o.person);
      if (pi < 0) { fel.push(`Önskemål ${o.id || i + 1} gäller ${o.person}, som inte finns.`); return; }
      const dagar = [];
      if (Array.isArray(o.dagindex)) o.dagindex.forEach(d => dagar.push(((d % N) + N) % N));
      else {
        const dd = o.dagar && o.dagar.length ? o.dagar : DAGAR;
        const vv = o.veckor || "alla";
        for (let w = 0; w < W; w++) {
          const nr = ind.start_iso_vecka ? ind.start_iso_vecka + w : w + 1;
          if (vv === "alla" || (vv === "jämna" && nr % 2 === 0) || (vv === "udda" && nr % 2 === 1) || (Array.isArray(vv) && vv.includes(w + 1)))

    const raknare = {};
    for (const p of pers) if (!p.natt) {
      const o = onsite(p.bas, r);
      if (p.typer.includes(M)) raknare[ms + o] = (raknare[ms + o] || 0) + p.P;
      if (p.typer.includes(K)) raknare[ks - o] = (raknare[ks - o] || 0) + p.P;

    for (let t = kf; t <= kt; t += 15) {
      const v = Object.entries(raknare).reduce((s, [g, n]) => s + (Math.abs(g - t) <= 30 ? n : 0), 0);
      if (v > bast) { bast = v; db = t; }
    }

  }

  function tillatna(p, d, r, W) {
    const w = Math.floor(d / 7), wd = d % 7;
    if (p.natt) {
      if (wd >= 5) return p.helg[w] ? [NT] : [];
      if (wd === 4) return p.helg[w] ? [NT] : [];   // fredagsnatt går in i helgen
      if (wd === 0) return [NT];
      return [NT];
    }
    if (wd >= 5) return p.helg[w] ? p.typer.slice() : [];
    if (wd === 4 && !p.helg[w] && r.ingen_fredagskvall_fore_ledig_helg) return p.typer.filter(t => t !== K);
    return p.typer.slice();
  }

  // ------------------------------------------------------------------ sökning
  function los(ind, opt = {}) {
    const pr = forbered(ind);
    if (pr.fel.length) return { status: "INDATAFEL", fel: pr.fel };
    const { r, W, N, cyk, behov, pers, onsk } = pr;
    const P = pers.length;
    const rnd = slump(opt.seed ?? 12345);
    const tidsgrans = opt.sekunder ?? 8;
    const rapport = opt.rapport || (() => {});
    const per = pers.map((p, pi) => ({ onsk: onsk.filter(o => o.pi === pi), tillat: Array.from({ length: N }, (_, d) => tillatna(p, d, r, W)) }));

    // passtider per person och typ (utan förlängning)
    const tider = pers.map(p => {
      const o = onsite(p.bas, r);
      return { 1: [pr.ms, pr.ms + o], 2: [pr.ks - o, pr.ks], 3: [pr.ns, pr.ne] };
    });

    // andel kvällar för rättvisa
    let mB = 0, kB = 0;
    for (let d = 0; d < N; d++) { mB += behov[d % 7][M]; kB += behov[d % 7][K]; }
    const kAndel = mB + kB ? kB / (mB + kB) : 0.5;

    function personKost(pi, x, ut) {
      const p = pers[pi], t = tider[pi];
      let hard = 0, block = 0, onskStraff = 0;
      const not = (regel, niva, text) => { if (ut) ut.push({ regel, niva, person: p.id, text }); };
      const dt = d => `vecka ${Math.floor(d / 7) + 1} ${DAGAR[d % 7]}`;
      // vila mellan pass: kväll följd av morgon
      for (let d = 0; d < N; d++) if (x[d] === K && (cyk || d < N - 1) && x[(d + 1) % N] === M) { hard++; not("DYGNSVILA", "avtal", `Kväll ${dt(d)} följs av morgon, för kort vila.`); }
      // block
      let start = -1;
      for (let d = 0; d < N; d++) if (!x[d]) { start = d; break; }
      if (start < 0) hard += 10;
      else {
        let len = 0;
        for (let i = 1; i <= N; i++) {
          const d = (start + i) % N;
          if (x[d]) len++;
          else if (len) {
            const kant = !cyk && (d - len <= 0 || d === N);
            if (len < r.block_min && !kant) { hard++; not("BLOCK_MIN", "lokal regel", `Enstaka arbetsdag ${dt((d - 1 + N) % N)}.`); }
            if (len > r.block_max) { hard += len - r.block_max; not("BLOCK_MAX", "lokal regel", `${len} arbetsdagar i följd fram till ${dt((d - 1 + N) % N)}.`); }
            if (len > r.block_rekommenderat) block++;
            len = 0;
          }
        }
      }
      // veckovila och dygnsvila
      const iv = d => {
        const dd = ((d % N) + N) % N;
        if (!cyk && dd !== d) return null;
        const typ = x[dd]; if (!typ) return null;
        return [d * DYGN + t[typ][0], d * DYGN + t[typ][1]];
      };
      const lucka = (a, b, d0, d1) => {
        let pos = a, best = 0;
        for (let d = d0; d <= d1; d++) {
          const v = iv(d); if (!v || v[1] <= a || v[0] >= b) continue;
          best = Math.max(best, Math.max(v[0], a) - pos); pos = Math.max(pos, Math.min(v[1], b));
        }
        return Math.max(best, b - pos);
      };
      for (let w = 0; w < W; w++) {
        const a = w * 7 * DYGN;
        if (lucka(a, a + 7 * DYGN, w * 7 - 1, w * 7 + 7) < r.veckovila_minuter) { hard++; not("VECKOVILA", "avtal", `Mindre än 36 timmars veckovila vecka ${w + 1}.`); }
      }
      const db = p.natt ? pr.nattDb : pr.db;
      for (let d = 0; d < (cyk ? N : N - 1); d++) {
        const a = d * DYGN + db;
        if (lucka(a, a + DYGN, d - 1, d + 2) < r.dygnsvila_minuter) { hard++; not("DYGNSVILA", "avtal", `Mindre än 11 timmars dygnsvila från ${dt(d)}.`); }
      }
      // önskemål
      for (const o of per[pi].onsk) {
        for (const d of o.dagar) {
          const typ = x[d];
          let bryt = false;
          if (o.typ === "ledig") bryt = !!typ;
          else if (o.typ === "arbetar") bryt = !typ;
          else if (typ && o.typ === "tidigast_start") bryt = t[typ][0] < tid(o.varde);
          else if (typ && o.typ === "senast_slut") bryt = t[typ][1] > tid(o.varde);
          else if (typ && o.typ === "endast_dygnsdel") bryt = ![].concat(o.varde).includes(DELNAMN[typ]);
          if (bryt) { if (o.krav) { hard++; not("KRAV", "önskemål som krav", `Krav ${o.id} (${o.typ.replace("_", " ")}) bryts ${dt(d)}.`); } else onskStraff += o.vikt; }
        }
      }
      // rättvisa
      let f = 0;
      if (p.typer.length > 1) {
        let kv = 0; for (let d = 0; d < N; d++) if (x[d] === K) kv++;
        f = (kv - p.P * kAndel) ** 2;
      }
      return { hard, block, onsk: onskStraff, f, summa: hard * HW + block * WB + onskStraff * WO + f * WF };
    }

    function bygg() {
      const X = pers.map((p, pi) => {
        const x = new Array(N).fill(OFF);
        let kvar = p.P;
        for (let w = 0; w < W; w++) if (p.helg[w]) for (const d of [w * 7 + 5, w * 7 + 6]) {
          const a = per[pi].tillat[d]; x[d] = a[Math.floor(rnd() * a.length)]; kvar--;
        }
        const lediga = [];
        for (let d = 0; d < N; d++) if (d % 7 < 5 && per[pi].tillat[d].length) lediga.push(d);
        for (let i = lediga.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [lediga[i], lediga[j]] = [lediga[j], lediga[i]]; }
        for (let i = 0; i < Math.max(0, kvar); i++) {
          const d = lediga[i], a = per[pi].tillat[d]; x[d] = a[Math.floor(rnd() * a.length)];
        }
        return x;
      });
      return X;
    }

    function vakans(cnt, d, t) { return Math.max(0, behov[d % 7][t] - cnt[d][t]); }

    let bastX = null, bastKost = Infinity;
    const start = Date.now();
    const omstarter = opt.omstarter ?? 3;
    for (let om = 0; om < omstarter; om++) {
      const X = bygg();
      const cnt = Array.from({ length: N }, () => [0, 0, 0, 0]);
      X.forEach(x => x.forEach((t, d) => { if (t) cnt[d][t]++; }));
      const pk = X.map((x, pi) => personKost(pi, x));
      let vak = 0;
      for (let d = 0; d < N; d++) for (let t = 1; t <= 3; t++) vak += vakans(cnt, d, t);
      let kost = pk.reduce((s, k) => s + k.summa, 0) + vak * WV;
      let lokalBast = kost, lokalX = X.map(x => x.slice());
      const budget = tidsgrans * 1000 / omstarter;
      const t0 = Date.now();
      let T = 3000, iter = 0;
      const Tslut = 0.3;

        }

        const v = rnd();

        let pj = -1;
        if (v < 0.55) {  // flytta ett pass mellan två vardagar

          if (d1 % 7 >= 5 || d2 % 7 >= 5 || !x[d1] || x[d2]) continue;
          const a = per[pi].tillat[d2]; if (!a.length) continue;
          andrade = [[pi, d1, x[d1]], [pi, d2, OFF]];
          x[d2] = a[Math.floor(rnd() * a.length)]; x[d1] = OFF;
        } else if (v < 0.85) {  // byt dygnsdel
          if (p.typer.length < 2) continue;
          const d = Math.floor(rnd() * N); if (!x[d]) continue;
          const a = per[pi].tillat[d].filter(t => t !== x[d]); if (!a.length) continue;
          andrade = [[pi, d, x[d]]]; x[d] = a[Math.floor(rnd() * a.length)];
        } else {  // två personer byter dygnsdel samma dag
          pj = Math.floor(rnd() * P); if (pj === pi) continue;
          const d = Math.floor(rnd() * N), y = X[pj];
          if (!x[d] || !y[d] || x[d] === y[d]) continue;
          if (!per[pi].tillat[d].includes(y[d]) || !per[pj].tillat[d].includes(x[d])) continue;
          andrade = [[pi, d, x[d]], [pj, d, y[d]]];
          const tmp = x[d]; x[d] = y[d]; y[d] = tmp;
        }
        // delta
        let delta = 0;
        const vakFore = {}, berorda = new Set();
        for (const [q, d, gammal] of andrade) {
          berorda.add(q);
          for (const t of [gammal, X[q][d]]) if (t) { const n = d * 4 + t; if (!(n in vakFore)) vakFore[n] = vakans(cnt, d, t); }
        }
        for (const [q, d, gammal] of andrade) { if (gammal) cnt[d][gammal]--; if (X[q][d]) cnt[d][X[q][d]]++; }
        for (const n in vakFore) delta += (vakans(cnt, Math.floor(n / 4), n % 4) - vakFore[n]) * WV;
        const nya = {};
        for (const q of berorda) { nya[q] = personKost(q, X[q]); delta += nya[q].summa - pk[q].summa; }
        if (delta <= 0 || rnd() < Math.exp(-delta / T)) {
          kost += delta;
          for (const q of berorda) pk[q] = nya[q];
          if (kost < lokalBast - 1e-9) { lokalBast = kost; lokalX = X.map(x => x.slice()); }
        } else {
          for (const [q, d, gammal] of andrade) { if (X[q][d]) cnt[d][X[q][d]]--; if (gammal) cnt[d][gammal]++; }
          for (let i = andrade.length - 1; i >= 0; i--) { const [q, d, gammal] = andrade[i]; X[q][d] = gammal; }
        }
      }
      if (lokalBast < bastKost) { bastKost = lokalBast; bastX = lokalX; }
      if (bastKost < WV) break;  // inga hårda brott och inga vakanser: bra nog
    }
    rapport({ andel: 1, kost: bastKost });
    return resultat(pr, bastX, tider, personKost, (Date.now() - start) / 1000);
  }

  // ------------------------------------------------------------------ resultat och passlängder
  function resultat(pr, X, tider, personKost, sekunder) {
    const { r, W, N, cyk, behov, pers } = pr;
    const schema = {}, personer = {};
    let hardTotalt = 0, block = 0, onskStraff = 0, passlangd = 0;
    const brott = [];
    const kvallar = [];
    pers.forEach((p, pi) => {
      const x = X[pi], k = personKost(pi, x, brott);
      hardTotalt += k.hard; block += k.block; onskStraff += k.onsk;
      const rad = x.map((t, d) => {
        if (!t) return null;
        if (t === NT) return { mall: "N", dygnsdel: "natt", start: klocka(pr.ns), slut: klocka(pr.ne), rast: pr.nRast, netto: pr.nnet, ...(pr.nRast ? {} : { maltidsuppehall: true }) };
        const net = p.bas, o = onsite(net, r);
        const [s, e] = t === M ? [pr.ms, pr.ms + o] : [pr.ks - o, pr.ks];
        return { mall: (t === M ? "M" : "K") + klocka(s) + "-" + klocka(e), dygnsdel: DELNAMN[t], start: klocka(s), slut: klocka(e), rast: o - net, netto: net };
      });
      // förläng k pass med 15 minuter där vilan räcker
      if (!p.natt && p.k) {
        const dagar = rad.map((v, d) => v ? d : -1).filter(d => d >= 0);
        let kvar = p.k;
        const ordning = dagar.slice().sort((a, b) => ((a * 7919) % 97) - ((b * 7919) % 97));
        for (const d of ordning) {
          if (!kvar) break;
          const v = rad[d], net = v.netto + 15, o = onsite(net, r);
          const forsok = v.dygnsdel === "morgon" ? { ...v, slut: klocka(pr.ms + o) } : { ...v, start: klocka(pr.ks - o) };
          forsok.netto = net; forsok.rast = o - net; forsok.mall = (v.dygnsdel === "morgon" ? "M" : "K") + forsok.start + "-" + forsok.slut;
          const gammal = rad[d]; rad[d] = forsok;
          if (vilaOk(rad, pr, p)) kvar--; else rad[d] = gammal;
        }
      }
      schema[p.id] = rad;
      const minuter = rad.reduce((s, v) => s + (v ? v.netto : 0), 0);
      const kv = rad.filter(v => v && v.dygnsdel === "kvall").length;
      if (p.typer.length > 1) kvallar.push(kv);
      passlangd += rad.reduce((s, v) => s + (v ? Math.abs(v.netto - p.L) : 0), 0) + Math.abs(minuter - p.malMin);
      personer[p.id] = { pass: rad.filter(Boolean).length, minuter, mal_minuter: p.malMin, kvallspass: kv,
        helggrupp: p.frek === "2/4" ? (p.grupp === 0 ? "A" : "B") : null, helgfrekvens: p.frek };
    });
    const vakanser = [];
    let vak = 0;
    for (let d = 0; d < N; d++) for (let t = 1; t <= 3; t++) {
      const n = pers.reduce((s, p, pi) => s + (X[pi][d] === t ? 1 : 0), 0), b = behov[d % 7][t];
      if (n < b) { vak += b - n; vakanser.push({ dag: d, vecka: Math.floor(d / 7) + 1, veckodag: DAGAR[d % 7], dygnsdel: DELNAMN[t], tid: null, antal: b - n }); }
    }
    return {
      status: hardTotalt ? "BROTT" : "OK", motor: "light", enhet: pr.enhet, veckor: W, cykliskt: cyk, sekunder: Math.round(sekunder * 10) / 10,
      kpi: { vakanser: vak, vakanta_pass: vak, vakanta_tidpunkter: 0, blocklangd: block, passlangd: Math.round(passlangd),
        rattvisa: kvallar.length ? Math.max(...kvallar) - Math.min(...kvallar) : 0, onskemal: onskStraff, hardregelbrott: hardTotalt },
      personer, vakanser, schema, brott,
    };
  }

  function vilaOk(rad, pr, p) {
    const { r, N, W, cyk } = pr;
    const L = N * DYGN;
    let iv = [];
    rad.forEach((v, d) => { if (v) { const s = d * DYGN + tid(v.start); let e = d * DYGN + tid(v.slut); if (e <= s) e += DYGN; iv.push([s, e]); } });
    if (cyk) iv = iv.concat(iv.map(([s, e]) => [s - L, e - L]), iv.map(([s, e]) => [s + L, e + L]));
    iv.sort((a, b) => a[0] - b[0]);
    const lucka = (a, b) => { let pos = a, best = 0; for (const [s, e] of iv) { if (e <= a || s >= b) continue; best = Math.max(best, Math.max(s, a) - pos); pos = Math.max(pos, Math.min(e, b)); } return Math.max(best, b - pos); };
    for (let i = 1; i < iv.length; i++) if (iv[i][0] - iv[i - 1][1] < r.dygnsvila_minuter && iv[i][0] >= 0 && iv[i][0] < L) return false;
    for (let w = 0; w < W; w++) if (lucka(w * 7 * DYGN, (w + 1) * 7 * DYGN) < r.veckovila_minuter) return false;
    const db = p.natt ? pr.nattDb : pr.db;
    for (let d = 0; d < N; d++) if (lucka(d * DYGN + db, d * DYGN + db + DYGN) < r.dygnsvila_minuter) return false;
    return true;
  }

  // ------------------------------------------------------------------ bemanningsbalans
  function balans(ind) {
    const pr = forbered(ind);
    if (pr.fel.length) return { fel: pr.fel };
    const { r, W, N, behov, pers } = pr;
    const b = (d, t) => behov[d % 7][t];
    const dag = pers.filter(p => !p.natt), natt = pers.filter(p => p.natt);
    const sum = (l, f) => l.reduce((s, x) => s + f(x), 0);
    let behovDK = 0, behovN = 0, vardagDK = 0, vardagN = 0;
    for (let d = 0; d < N; d++) { behovDK += b(d, M) + b(d, K); behovN += b(d, NT); if (d % 7 < 5) { vardagDK += b(d, M) + b(d, K); vardagN += b(d, NT); } }
    const tillDK = sum(dag, p => p.P), tillN = sum(natt, p => p.P);
    let vakHelg = 0, fredag = 0, helgDK = 0, helgN = 0;
    const helger = [];
    for (let w = 0; w < W; w++) {
      const fre = w * 7 + 4, lor = w * 7 + 5, son = w * 7 + 6;
      const bada = dag.filter(p => p.helg[w] && p.typer.length > 1).length;
      const mo = dag.filter(p => p.helg[w] && p.typer.length === 1 && p.typer[0] === M).length;
      const kv = dag.filter(p => p.helg[w] && p.typer.length === 1 && p.typer[0] === K).length;
      const nw = natt.filter(p => p.helg[w]).length;
      const mB = Math.max(b(lor, M), b(son, M)), kB = Math.max(b(lor, K), b(son, K));
      const kF = r.ingen_fredagskvall_fore_ledig_helg ? Math.max(kB, b(fre, K)) : kB;
      const brist = kb => Math.max(0, Math.max(0, kb - kv) + Math.max(0, mB - mo) - bada);
      const bDK = brist(kF);
      fredag += bDK - brist(kB);
      const nB = Math.max(r.ingen_fredagskvall_fore_ledig_helg ? b(fre, NT) : 0, b(lor, NT), b(son, NT));
      const bN = Math.max(0, nB - nw);
      vakHelg += bDK + bN; helgDK += 2 * (bada + mo + kv); helgN += 2 * nw;
      helger.push({ vecka: w + 1, arbetar: bada + mo + kv, behov: mB + kF, natt: nw, nattbehov: nB, vakanser: bDK + bN });
    }
    const vakVDK = Math.max(0, vardagDK - (tillDK - helgDK)), vakVN = Math.max(0, vardagN - (tillN - helgN));
    const atgarder = [];
    if (vakVDK) atgarder.push(`Det saknas cirka ${vakVDK} dag- och kvällspass på vardagar. En person till ger ${String(r.pass_per_vecka * W).replace(".", ",")} pass.`);
    if (vakVN) atgarder.push(`Det saknas cirka ${vakVN} nattpass på vardagar. Utöka nattpersonalen.`);
    if (fredag) atgarder.push(`Fredagskvällarna ger ${fredag} ${fredag === 1 ? "vakant pass" : "vakanta pass"}: den som är ledig helgen arbetar inte fredag kväll, och den som arbetar fredag kväll kan inte ta morgon på lördagen. Sänk behovet fredag kväll eller låt fler arbeta helg.`);
    if (vakHelg - fredag > 0) atgarder.push(`Helgerna räcker inte till (vecka ${helger.filter(h => h.vakanser).map(h => h.vecka).join(", ")}). Sänk helgbehovet eller utöka personalen.`);
    return { forvantade_vakanser: vakHelg + vakVDK + vakVN, behovDK, tillDK, behovN, tillN, helger, atgarder };
  }

  return { los, balans, forbered, DAGAR };
})();

if (typeof module !== "undefined") module.exports = MOTOR;

<script>

const DAGAR = ["mån", "tis", "ons", "tor", "fre", "lör", "sön"];
const DELAR = { morgon: "Morgon", kvall: "Kväll", natt: "Natt" };
const ARBETAR = { "morgon,kvall": "Dag och kväll", "morgon": "Bara morgon", "kvall": "Bara kväll", "natt": "Natt" };
const UNDANTAG = { "1/4": "var fjärde", "3/4": "tre av fyra", "alla": "alla", "ingen": "inga" };
const ONSKTYP = { ledig: "Ledig", arbetar: "Arbetar", tidigast_start: "Börjar tidigast", senast_slut: "Slutar senast", endast_dygnsdel: "Bara dygnsdel" };
const DAGNYCKEL = { vardag: "Vardagar", helg: "Helg", alla: "Alla dagar", mån: "Måndag", tis: "Tisdag", ons: "Onsdag", tor: "Torsdag", fre: "Fredag", lör: "Lördag", sön: "Söndag" };
const KPI = [["vakanta_pass", "Vakanta pass"], ["hardregelbrott", "Brutna hårda regler"], ["blocklangd", "Arbetsdagar i följd över 4"], ["rattvisa", "Rättvisa, spridning i kvällar"], ["onskemal", "Brutna önskemål"]];

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const sv = x => String(x).replace(".", ",");
const timmar = m => `${Math.floor(m / 60)} h ${String(m % 60).padStart(2, "0")}`;
const datum = t => new Date(t).toLocaleString("sv-SE", { dateStyle: "short", timeStyle: "short" });
const vakText = n => `${n} ${n === 1 ? "vakant pass" : "vakanta pass"}`;
const nyttId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
function meddela(t) { const m = $("#meddelande"); m.textContent = t; m.classList.add("syns"); clearTimeout(meddela.t); meddela.t = setTimeout(() => m.classList.remove("syns"), 2600); }

// ------------------------------------------------------------------ lagring
// I Claude: privat i ditt konto (syns i mobil och dator). Annars: bara i den här webbläsaren.
const lager = {
  typ: "lokal", db: null, bas: null,
  async init() {
    try {
      const use = window.claude && window.claude.use;
      if (use) {
        const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
        const uid = user ? await user.id() : null;
        if (db && uid) { this.db = db; this.bas = "data/users/" + uid; this.typ = "konto"; }
      }
    } catch (e) { /* lokalt */ }
  },
  lokal() { try { return JSON.parse(localStorage.getItem("schema-light") || '{"enheter":{},"korningar":{}}'); } catch { return { enheter: {}, korningar: {} }; } },
  lokalSpara(d) { try { localStorage.setItem("schema-light", JSON.stringify(d)); } catch { meddela("Kunde inte spara i webbläsaren."); } },
  async enheter() {
    if (this.db) {
      const s = await medTidsgrans(this.db.collection(this.bas).get());
      return s.docs.filter(d => d.id.startsWith("e_")).map(d => ({ id: d.id.slice(2), ...d.data() })).sort((a, b) => b.andrad - a.andrad);
    }
    return Object.values(this.lokal().enheter).sort((a, b) => b.andrad - a.andrad);
  },
  async sparaEnhet(e) {
    const rad = { id: e.id, namn: e.namn, indata: e.indata, andrad: Date.now() };
    if (this.db) return this.db.doc(`${this.bas}/e_${e.id}`).set(rad);
    const d = this.lokal(); d.enheter[e.id] = rad; this.lokalSpara(d);
  },
  async taBortEnhet(id) {
    if (this.db) {
      const k = await this.db.collection(`${this.bas}/e_${id}/korningar`).get();
      for (const d of k.docs) await this.db.doc(`${this.bas}/e_${id}/korningar/${d.id}`).delete();
      return this.db.doc(`${this.bas}/e_${id}`).delete();
    }
    const d = this.lokal(); delete d.enheter[id];
    Object.keys(d.korningar).forEach(k => { if (d.korningar[k].enhet === id) delete d.korningar[k]; }); this.lokalSpara(d);
  },
  async korningar(eid) {
    if (this.db) {
      const s = await medTidsgrans(this.db.collection(`${this.bas}/e_${eid}/korningar`).get());
      return s.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => b.skapad - a.skapad);
    }
    return Object.values(this.lokal().korningar).filter(k => k.enhet === eid).sort((a, b) => b.skapad - a.skapad);
  },
  async sparaKorning(k) {
    if (this.db) return this.db.doc(`${this.bas}/e_${k.enhet}/korningar/${k.id}`).set(k);
    const d = this.lokal(); d.korningar[k.id] = k; this.lokalSpara(d);
  },
  async taBortKorning(k) {
    if (this.db) return this.db.doc(`${this.bas}/e_${k.enhet}/korningar/${k.id}`).delete();
    const d = this.lokal(); delete d.korningar[k.id]; this.lokalSpara(d);
  },
};
function medTidsgrans(p) { return Promise.race([p, new Promise((_, nej) => setTimeout(() => nej(new Error("Lagringen svarar inte just nu.")), 10000))]); }

async function skapa(namn, indata) {
  const e = { id: nyttId(), namn, indata: structuredClone(indata) };
  delete e.indata.losare; delete e.indata.tidpunkter; delete e.indata.delperioder;
  try { await lager.sparaEnhet(e); } catch (err) { meddela("Kunde inte spara: " + err.message); }

async function oppna(e) {
  st.vy = "enhet"; st.enhet = e; st.onskForm = null; st.korning = null;

function ritaKontroll() {
  const el = $("#kontroll"); if (!el) return;

  const kontr = Math.round(st.enhet.indata.personal.reduce((s, p) => s + (p.grad ?? 1) * ((p.heltid_minuter_per_vecka || 0) / 60 || ht), 0) * 100) / 100;
  const bud = st.enhet.indata.budget_timmar_vecka;

  el.innerHTML = `<div class="banner ${b.forvantade_vakanser ? "varn" : "ok"}"><strong>${b.forvantade_vakanser ? `Cirka ${vakText(b.forvantade_vakanser)}` : "Personalen räcker"}</strong>

    ${budText}
