<style>
/* Layout: en kolumn för mobilen; kontroll överst, flikar för indata, fast knapp för att lägga schemat. */

  --accent: #a8c5b0; --accent-text: #13221e; --accent-svag: #24372f; --guld: #d5b46a; --guld-ljus: #ead29a; --guld-djup: #c39f50;
  --morgon: #1f3328; --morgon-text: #b9dcc3; --kvall: #1b2f3c; --kvall-text: #b8d7e8; --natt: #362e22; --natt-text: #e9d3ae;
  --morgon-kant: #5f8f6d; --kvall-kant: #5f8fae; --natt-kant: #9c8058;
  --bra: #8fcaa0; --bra-bg: #1c3326; --dalig: #ec8b78; --dalig-bg: #3b221d; --varn: #e8c47a; --varn-bg: #352c19; color-scheme: dark; } }
:root[data-theme="dark"] {

  --bg: #121c1a; --yta: #1a2724; --yta2: #20302c; --text: #e8ece8; --dampad: #a9b6b1; --linje: #2c3d38; --helg: #1d2925;
  --accent: #a8c5b0; --accent-text: #13221e; --accent-svag: #24372f; --guld: #d5b46a; --guld-ljus: #ead29a; --guld-djup: #c39f50;
  --morgon: #1f3328; --morgon-text: #b9dcc3; --kvall: #1b2f3c; --kvall-text: #b8d7e8; --natt: #362e22; --natt-text: #e9d3ae;
  --morgon-kant: #5f8f6d; --kvall-kant: #5f8fae; --natt-kant: #9c8058;

* { box-sizing: border-box; }

.rull { overflow-x: auto; }

.banner strong { display: block; font-size: 16px; }
.banner.ok { background: var(--bra-bg); color: var(--bra); } .banner.dalig { background: var(--dalig-bg); color: var(--dalig); }

.pass.vald { outline: 2px solid var(--accent); outline-offset: 1px; }

.pass.resurs { box-shadow: inset 4px 0 0 var(--resurs), inset 0 0 0 1px var(--resurs) !important; }
.pass .res { display: block; font: 800 9.5px/1.1 var(--mono); font-style: normal; color: #fff; background: var(--resurs); border: 1px solid var(--text); border-radius: 4px; margin: 2px 2px 0; padding: 0 2px; }
.schema.period .pass.resurs { background: var(--resurs); color: #fff; }
.pass .akt { display: block; font: 700 9.5px/1.1 var(--mono); font-style: normal; color: #4a3608; background: #ead29a; border-radius: 4px; margin: 2px 2px 0; padding: 1px 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
tr.bem td { font-size: 11px; color: var(--dampad); border-top: 2px solid var(--linje); line-height: 1.25; }

.mono { font-family: var(--mono); font-size: 13px; }

  padding-block: 10px max(10px, env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

.fot button.primar { flex: 1; padding: 11px; font-size: 16px; }
.fot select { width: auto; }

.onsk { display: flex; gap: 10px; justify-content: space-between; align-items: flex-start; padding: 8px 0; border-bottom: 1px solid var(--linje); }
.formular { background: var(--yta2); border: 1px solid var(--linje); border-radius: 8px; padding: 12px; display: grid; gap: 10px; margin-bottom: 10px; }
.status { font-size: 12px; font-weight: 600; padding: 1px 8px; border-radius: 10px; white-space: nowrap; }
.status.ok { background: var(--bra-bg); color: var(--bra); } .status.dalig { background: var(--dalig-bg); color: var(--dalig); } .status.varn { background: var(--varn-bg); color: var(--varn); }

  border-radius: 8px; padding: 9px 14px; font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .2s; max-width: calc(100% - 32px); z-index: 20; }

.pass.vakant { background: none; border: 2px dashed; padding: 2px 0; cursor: default; }
.pass.vakant.morgon { border-color: var(--morgon-text); color: var(--morgon-text); } .pass.vakant.kvall { border-color: var(--kvall-text); color: var(--kvall-text); } .pass.vakant.natt { border-color: var(--natt); color: var(--text); }
tr.vakantrad td:first-child { color: var(--dalig); }
.minus { color: var(--dalig); font-weight: 800; } .plus { color: var(--resurs); font-weight: 800; } tr.bem td.over { background: var(--resurs-bg); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .plus { color: var(--text); } }
:root[data-theme="dark"] .plus { color: var(--text); }
table.schema.period th:first-child, table.schema.period td:first-child { position: sticky; left: 0; background: var(--yta); z-index: 1; }
table.schema.period td, table.schema.period th { padding: 1px; } table.schema.period .ny-vecka { border-left: 2px solid var(--linje); }

details summary { cursor: pointer; color: var(--dampad); }
[hidden] { display: none !important; }
.chatt-knapp { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(84px + env(safe-area-inset-bottom, 0px)); z-index: 15; background: var(--guld); color: #25332f; border: 0; border-radius: 999px; padding: 12px 20px; font-weight: 700; box-shadow: 0 6px 18px rgba(25,63,56,.18); }
.chatt { position: fixed; z-index: 25; right: 0; top: 0; bottom: 0; width: min(440px, 100%); background: var(--yta); border-left: 1px solid var(--linje); display: flex; flex-direction: column; }
.chatt header { display: flex; justify-content: space-between; align-items: center; padding: max(14px, env(safe-area-inset-top, 0px)) 16px 12px; border-bottom: 1px solid var(--linje); }

.bubbla { background: var(--yta2); border: 1px solid var(--linje); border-radius: 14px 14px 14px 4px; padding: 9px 12px; max-width: 92%; font-size: 14.5px; white-space: pre-wrap; }

.chatt textarea { font: inherit; font-size: 16px; color: var(--text); background: var(--yta2); border: 1px solid var(--linje); border-radius: 8px; padding: 8px; flex: 1; resize: none; }
/* ---------- översikt, grafer, regelkontroll, simulering ---------- */
.sida > *, .kort, .grafyta { min-width: 0; }
.grafyta { --morgon: #56a06a; --kvall: #2f80c4; --natt: #a8692a; --over: #2f6f9e; --kritisk: #b8432f; --skog: #193f38; --rutnat: var(--linje); --sand: #e9dfd0; --guld: #c9a03a; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .grafyta { --skog: #a8c5b0; --sand: #3a352c; --over: #5f9fd0; } }
:root[data-theme="dark"] .grafyta { --skog: #a8c5b0; --sand: #3a352c; --over: #5f9fd0; }
.grafyta .kort { margin-top: 12px; }
#flik .kort.bb { box-shadow: none; border: 1px solid var(--linje); padding: 12px; margin: 10px 0 0; }
.bb table.bbtabell input, .bb table.bbtabell select { padding: 6px; width: auto; } .bb table.bbtabell td { padding: 3px; }
.bb table { width: auto; min-width: 100%; table-layout: auto; } .bb td, .bb th { white-space: nowrap; }
.bb table.lista tr.summa td { border-top: 2px solid var(--linje); font-weight: 700; } .bb h2 { font-size: 16px; }
.tva { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); gap: 12px; align-items: start; }

.graf text { fill: var(--dampad); font: 11px var(--sans); font-variant-numeric: tabular-nums; }
.graf .axel { stroke: var(--linje); } .graf .rutnat { stroke: var(--linje); stroke-dasharray: 2 3; } .graf .traff { fill: transparent; }
.legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 13px; color: var(--dampad); align-items: center; }
.legend span { display: inline-flex; align-items: center; gap: 6px; } .legend i { width: 12px; height: 12px; border-radius: 4px; display: inline-block; }
.ring { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; justify-content: center; }
.ring svg { width: 160px; height: 160px; flex: none; } .ring .ringtal { font-size: 28px; font-weight: 800; fill: var(--text); } .ring .ringtext { font-size: 12px; fill: var(--dampad); }
.ringlegend { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; min-width: 140px; }
.ringlegend li { display: grid; grid-template-columns: 12px 1fr auto; gap: 10px; align-items: center; } .ringlegend i { width: 12px; height: 12px; border-radius: 4px; }
table.varme { width: auto; border-collapse: separate; border-spacing: 2px; font-size: 11px; }

table.varme td { width: 18px; min-width: 18px; height: 24px; text-align: center; border-radius: 5px; font-weight: 700; padding: 0; border: 0; }
.nyckeltal { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 12px; }
.nyckel { background: var(--yta); border: 1px solid var(--linje); border-radius: 16px; padding: 14px; }
.nyckel span { display: block; font-size: 12.5px; color: var(--dampad); } .nyckel b { display: block; font-size: 24px; line-height: 1.2; font-variant-numeric: tabular-nums; }
.nyckel small { display: block; font-size: 12px; color: var(--dampad); margin-top: 2px; } .nyckel b.minus { color: var(--dalig); }
.nyckel i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }
.flikrad { display: flex; gap: 6px; overflow-x: auto; padding: 2px; margin-top: 12px; }
.flikrad button { flex: none; border-radius: 999px; padding: 7px 14px; }
.flikrad button[aria-pressed="true"] { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
.regellista { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.regellista > li { display: grid; grid-template-columns: 20px 1fr auto; gap: 8px; align-items: center; padding: 10px 12px; border-radius: 12px; background: var(--yta2); }
.regellista > li.brott { background: var(--dalig-bg); } .regellista > li.info { background: var(--varn-bg); }
.regellista .bock { font-weight: 800; color: var(--bra); } .regellista li.brott .bock { color: var(--dalig); } .regellista li.info .bock { color: var(--varn); }

.hstapel { display: grid; grid-template-columns: minmax(90px, 150px) 1fr 64px; gap: 8px; align-items: center; padding: 3px 0; }

<script>

const DAGAR = ["mån", "tis", "ons", "tor", "fre", "lör", "sön"];
const DELAR = { morgon: "Dag", kvall: "Kväll", natt: "Natt" };
const ARBETAR = { "morgon,kvall": "Dag och kväll", "morgon": "Bara morgon", "kvall": "Bara kväll", "natt": "Natt" };

x1="32" y1="32" x2="44" y2="23" stroke="url(#guldlogga)" stroke-width="1.8" stroke-linecap="round"/><circle cx="32" cy="32" r="2.4" fill="#f0d58e"/></svg>`;
const EXEMPEL = JSON.parse(document.getElementById("exempel").textContent);

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const sv = x => String(x).replace(".", ",");

const datum = t => new Date(t).toLocaleString("sv-SE", { dateStyle: "short", timeStyle: "short" });
const vakText = n => `${n} ${n === 1 ? "vakant pass" : "vakanta pass"}`;
const nyttId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
function meddela(t) { const m = $("#meddelande"); m.textContent = t; m.classList.add("syns"); clearTimeout(meddela.t); meddela.t = setTimeout(() => m.classList.remove("syns"), 2600); }

// ------------------------------------------------------------------ lagring
// I Claude: privat i ditt konto (syns i mobil och dator). Annars: bara i den här webbläsaren.
const lager = {
  typ: "lokal", db: null, bas: null,
  async init() {
    try {
      const use = window.claude && window.claude.use;
      if (use) {
        const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
        const uid = user ? await user.id() : null;
        if (db && uid) { this.db = db; this.bas = "data/users/" + uid; this.typ = "konto"; }
      }
    } catch (e) { /* lokalt */ }
  },
  lokal() { try { return JSON.parse(localStorage.getItem("schema-light") || '{"enheter":{},"korningar":{}}'); } catch { return { enheter: {}, korningar: {} }; } },
  lokalSpara(d) { try { localStorage.setItem("schema-light", JSON.stringify(d)); } catch { meddela("Kunde inte spara i webbläsaren."); } },
  async enheter() {
    if (this.db) {
      const s = await medTidsgrans(this.db.collection(this.bas).get());
      return s.docs.filter(d => d.id.startsWith("e_")).map(d => ({ id: d.id.slice(2), ...d.data() })).sort((a, b) => b.andrad - a.andrad);
    }
    return Object.values(this.lokal().enheter).sort((a, b) => b.andrad - a.andrad);
  },
  async sparaEnhet(e) {
    const rad = { id: e.id, namn: e.namn, indata: e.indata, andrad: Date.now() };
    if (this.db) return this.db.doc(`${this.bas}/e_${e.id}`).set(rad);
    const d = this.lokal(); d.enheter[e.id] = rad; this.lokalSpara(d);
  },
  async taBortEnhet(id) {
    if (this.db) {
      const k = await this.db.collection(`${this.bas}/e_${id}/korningar`).get();
      for (const d of k.docs) await this.db.doc(`${this.bas}/e_${id}/korningar/${d.id}`).delete();
      return this.db.doc(`${this.bas}/e_${id}`).delete();
    }
    const d = this.lokal(); delete d.enheter[id];
    Object.keys(d.korningar).forEach(k => { if (d.korningar[k].enhet === id) delete d.korningar[k]; }); this.lokalSpara(d);
  },
  async korningar(eid) {
    if (this.db) {
      const s = await medTidsgrans(this.db.collection(`${this.bas}/e_${eid}/korningar`).get());
      return s.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => b.skapad - a.skapad);
    }
    return Object.values(this.lokal().korningar).filter(k => k.enhet === eid).sort((a, b) => b.skapad - a.skapad);
  },
  async sparaKorning(k) {
    if (this.db) return this.db.doc(`${this.bas}/e_${k.enhet}/korningar/${k.id}`).set(k);
    const d = this.lokal(); d.korningar[k.id] = k; this.lokalSpara(d);
  },
  async taBortKorning(k) {
    if (this.db) return this.db.doc(`${this.bas}/e_${k.enhet}/korningar/${k.id}`).delete();
    const d = this.lokal(); delete d.korningar[k.id]; this.lokalSpara(d);
  },
};
function medTidsgrans(p) { return Promise.race([p, new Promise((_, nej) => setTimeout(() => nej(new Error("Lagringen svarar inte just nu.")), 10000))]); }

// ------------------------------------------------------------------ tillstånd
const st = { vy: "lista", enheter: [], enhet: null, flik: "personal", korningar: [], korning: null, vecka: 0, cell: null, onskForm: null, sekunder: 8, kor: false };
let sparaTimer = null;
function andrad(rita) {
  if (rita) ritaFlik();
  ritaKontroll();
  clearTimeout(sparaTimer);
  sparaTimer = setTimeout(async () => { try { await lager.sparaEnhet(st.enhet); } catch (e) { meddela("Kunde inte spara: " + e.message); } }, 800);
}

  st.vy = "lista"; st.enhet = null; $("#fot").hidden = true;
  $("#sida").innerHTML = `<p class="tom">Laddar …</p>`;

  $("#sida").innerHTML = `
    <header class="kort"><div class="logga" style="margin-bottom:10px">${LOGGA}<span><b>DODEX</b><small>SCHEDULER · LIGHT</small></span></div>
      <p class="dampad" style="margin:6px 0 0">Lägg cykliska grundscheman direkt i mobilen. Samma hårda regler som det fullständiga systemet: dygnsvila och veckovila (avtal), rast (lag), antal pass, varannan helg och block på 2–5 dagar.</p>
      <p class="liten dampad" style="margin:6px 0 0">${lager.typ === "konto" ? "Sparas privat i ditt Claude-konto och syns i mobil och dator." : "Sparas bara i den här webbläsaren."}</p></header>
    ${GUIDE.val({ harEnheter: st.enheter.length > 0 })}
    <section class="kort" id="mina-enheter"><div class="rad"><h2 style="margin:0">Mina enheter</h2><button class="primar" data-guide="ny">Ny enhet</button></div>
      ${st.enheter.length ? st.enheter.map(e => `<div class="onsk"><div><button class="lank" data-g="oppna" data-id="${e.id}" style="font-weight:600;font-size:16px">${esc(e.namn)}</button>
        <div class="dampad liten">${(e.indata.personal || []).length} personer · ${e.indata.veckor} veckor · ändrad ${datum(e.andrad)}</div></div>
        <div class="chips"><button class="liten" data-g="kopiera" data-id="${e.id}">Kopiera</button><button class="liten fara" data-g="ta-bort" data-id="${e.id}">Ta bort</button></div></div>`).join("")
      : `<p class="tom">Inga enheter än. Skapa en ny eller börja från ett exempel.</p>`}</section>
    <section class="kort" id="exempel"><h2>Exempel</h2><p class="dampad liten">Testfall från projektet, med id-koder i stället för namn.</p>
      ${EXEMPEL.map((x, i) => `<div class="onsk"><div><b>${esc(x.namn)}</b><div class="dampad liten">${esc(x.beskrivning)}</div></div><button class="liten" data-g="exempel" data-i="${i}">Använd</button></div>`).join("")}</section>`;
}

const NY = () => ({ veckor: 4, cykliskt: true, behov: { vardag: { morgon: 2, kvall: 2, natt: 1 }, helg: { morgon: 2, kvall: 2, natt: 1 } },
  personal: [{ id: "A1", grad: 1 }, { id: "A2", grad: 1 }, { id: "A3", grad: 0.9 }, { id: "A4", grad: 0.9 }, { id: "A5", grad: 0.8 }, { id: "A6", grad: 0.75 }, { id: "N1", grad: 1, dygnsdelar: ["natt"] }, { id: "N2", grad: 0.9, dygnsdelar: ["natt"] }],
  onskemal: [] });

async function skapa(namn, indata) {
  const e = { id: nyttId(), namn, indata: structuredClone(indata) };
  delete e.indata.losare; delete e.indata.tidpunkter; delete e.indata.delperioder;
  try { await lager.sparaEnhet(e); } catch (err) { meddela("Kunde inte spara: " + err.message); }
  oppna(e);
}

// ------------------------------------------------------------------ vy: enhet
async function oppna(e) {
  st.vy = "enhet"; st.enhet = e; st.onskForm = null; st.korning = null;
  $("#sida").innerHTML = `
    <header class="kort"><div class="rad"><button class="lank" data-g="tillbaka">‹ Enheter</button><span class="dampad liten">${lager.typ === "konto" ? "Sparas automatiskt" : "Sparas i webbläsaren"}</span></div>
      <label for="namn" style="margin-top:6px">Enhet</label><input id="namn" value="${esc(e.namn)}" style="font-weight:600;font-size:18px">
      <div class="chips" style="margin-top:10px"><button data-g="senaste" id="senaste-knapp" hidden>Översikt senaste schema</button><button data-g="simulering">Simulering</button></div></header>
    <section class="kort" id="kontroll"></section>
    <section class="kort"><div class="flikar" role="tablist">${[["personal", "Personal"], ["behov", "Behov"], ["onskemal", "Önskemål"], ["aktiviteter", "Aktiviteter"], ["balans", "Bemanningsbalans"], ["regler", "Regler"], ["period", "Period"]].map(([k, t]) =>
      `<button role="tab" data-g="flik" data-f="${k}" aria-selected="${st.flik === k}">${t}</button>`).join("")}</div><div id="flik"></div></section>
    <section class="kort" id="korningar"><h2>Körningar</h2><p class="dampad liten">Laddar …</p></section>`;
  $("#namn").oninput = ev => { st.enhet.namn = ev.target.value; andrad(false); };
  ritaFlik(); ritaKontroll(); ritaFot();
  try { st.korningar = await lager.korningar(e.id); } catch { st.korningar = []; }
  ritaKorningar();
  const sk = $("#senaste-knapp"); if (sk) sk.hidden = !st.korningar.length;
}

function ritaFot() {
  const f = $("#fot"); f.hidden = false;
  f.innerHTML = `<div><select id="sek" aria-label="Söktid"><option value="5"${st.sekunder === 5 ? " selected" : ""}>Snabb</option><option value="8"${st.sekunder === 8 ? " selected" : ""}>Normal</option><option value="20"${st.sekunder === 20 ? " selected" : ""}>Noggrann</option></select>
    <button data-g="lagg-manuellt" ${st.kor ? "disabled" : ""} aria-label="Lägg schemat själv">✋ Själv</button>
    <button class="primar" data-g="lagg" ${st.kor ? "disabled" : ""}>${st.kor ? "Lägger schema …" : "🤖 Lägg schema"}</button></div>`;
  $("#sek").onchange = ev => (st.sekunder = +ev.target.value);
}

function ritaKontroll() {
  const el = $("#kontroll"); if (!el) return;
  const b = MOTOR_HUVUD.balans(st.enhet.indata);
  if (b.fel) { el.innerHTML = `<div class="banner dalig"><strong>Rätta först</strong></div><ul class="punkter liten" style="margin-top:8px">${b.fel.map(f => `<li>${esc(f)}</li>`).join("")}</ul>`; return; }
  const und = st.enhet.indata.personal.filter(p => p.helgfrekvens && p.helgfrekvens !== "2/4");
  const ht = (st.enhet.indata.heltid_minuter_per_vecka || 2220) / 60;
  const htn = (st.enhet.indata.heltid_natt_minuter_per_vecka || 2060) / 60, arNatt = p => p.dygnsdelar && p.dygnsdelar.length === 1 && p.dygnsdelar[0] === "natt";
  const kontr = Math.round(st.enhet.indata.personal.reduce((s, p) => s + (p.grad ?? 1) * ((p.heltid_minuter_per_vecka || 0) / 60 || (arNatt(p) ? htn : ht)), 0) * 100) / 100;
  const bud = st.enhet.indata.budget_timmar_vecka;
  const budText = bud ? `<p class="liten" style="margin:8px 0 0;${kontr > bud + 0.05 ? "color:var(--dalig)" : ""}">Kontrakterad tid ${sv(kontr)} h per vecka av budgeten ${sv(bud)} h${Math.abs(kontr - bud) < 0.05 ? "." : kontr > bud ? `: ${sv(Math.round((kontr - bud) * 100) / 100)} h över.` : `: ${sv(Math.round((bud - kontr) * 100) / 100)} h kvar.`}</p>` : `<p class="liten dampad" style="margin:8px 0 0">Kontrakterad tid ${sv(kontr)} h per vecka.</p>`;
  el.innerHTML = `<div class="banner ${b.forvantade_vakanser ? "varn" : "ok"}"><strong>${b.forvantade_vakanser ? `Cirka ${vakText(b.forvantade_vakanser)}` : "Personalen räcker"}</strong>
    <span class="liten">Dag och kväll: behov ${b.behovDK}, finns ${b.tillDK} · Natt: behov ${b.behovN}, finns ${b.tillN}</span></div>
    ${b.atgarder.length ? `<details style="margin-top:8px"><summary>${b.atgarder.length} förslag</summary><ul class="punkter liten" style="margin-top:6px">${b.atgarder.map(a => `<li>${esc(a)}</li>`).join("")}</ul></details>` : ""}
    ${budText}
    ${und.length ? `<p class="liten" style="margin:8px 0 0;color:var(--varn)">Undantag från varannan helg: ${und.map(p => `${esc(p.id)} (${UNDANTAG[p.helgfrekvens]})`).join(", ")}</p>` : ""}`;
}

function beskriv(o) {
  const vill = o.krav ? "måste" : "vill";
  const vad = o.typ === "ledig" ? "vara ledig" : o.typ === "arbetar" ? "arbeta" : o.typ === "tidigast_start" ? `börja tidigast ${o.varde}` : o.typ === "senast_slut" ? `sluta senast ${o.varde}` : `bara arbeta ${(DELAR[o.varde] || o.varde).toLowerCase()}`;
  let nar = Array.isArray(o.dagindex) ? o.dagindex.map(d => `v${Math.floor(d / 7) + 1} ${DAGAR[d % 7]}`).join(", ") : (o.dagar && o.dagar.length ? o.dagar.join(", ") : "alla dagar");
  if (o.veckor === "jämna" || o.veckor === "udda") nar += `, ${o.veckor} veckor`;
  else if (Array.isArray(o.veckor)) nar += `, vecka ${o.veckor.join(", ")}`;
  return `${o.person} ${vill} ${vad} – ${nar}${!o.krav && (o.vikt || 1) > 1 ? ` (vikt ${o.vikt})` : ""}`;
}

const AKTTYP = { apt: "APT", utbildning: "Utbildning", mote: "Möte", studier: "Studier", dokumentation: "Dokumentation", handledning: "Handledning", annat: "Annat" };
function aktBeskriv(a) {
  const vv = Array.isArray(a.veckor) ? `vecka ${a.veckor.join(", ")}` : a.veckor === "jämna" ? "jämna veckor" : a.veckor === "udda" ? "udda veckor" : "varje vecka";
  const vem = a.antal ? `${a.antal} personer` : a.andel ? `${Math.round(a.andel * 100)} % av gruppen` : a.varje_person ? `alla, ${a.varje_person} ${a.varje_person === 1 ? "gång" : "gånger"} var` : "alla";
  return `${a.namn || a.id} ${a.start}–${a.slut}, ${(a.dagar || []).join(", ") || "alla dagar"}, ${vv}: ${vem}${a.deltagare?.length ? ` bland ${a.deltagare.join(", ")}` : ""}${a.fran_golvet === false ? " (räknas på golvet)" : ""}${a.minst_pa_golvet ? `. Minst ${a.minst_pa_golvet} kvar på golvet` : ""}`;
}

function aktForm() {
  const a = st.aktForm.data, vv = Array.isArray(a.veckor) ? "vissa" : (a.veckor || "alla");
  const vem = a.antal ? "antal" : a.andel ? "andel" : a.varje_person ? "varje" : "alla";
  const valda = new Set(a.deltagare || []);
  return `<form class="formular" id="af">
    <div class="falt"><div><label for="af-typ">Typ</label><select id="af-typ">${Object.entries(AKTTYP).map(([k, t]) => `<option value="${k}"${k === (a.typ || "annat") ? " selected" : ""}>${t}</option>`).join("")}</select></div><div><label for="af-n">Namn</label><input id="af-n" value="${esc(a.namn || "")}" placeholder="APT"></div>
      <div><label for="af-s">Från</label><input id="af-s" type="time" value="${esc(a.start)}"></div><div><label for="af-e">Till</label><input id="af-e" type="time" value="${esc(a.slut)}"></div></div>
    <div><label>Dagar</label><div class="chips">${DAGAR.map(d => `<label><input type="checkbox" name="af-d" value="${d}"${(a.dagar || []).includes(d) ? " checked" : ""}>${d}</label>`).join("")}</div></div>
    <div class="falt"><div><label for="af-w">Veckor</label><select id="af-w">${[["alla", "Varje vecka"], ["jämna", "Jämna"], ["udda", "Udda"], ["vissa", "Vissa"]].map(([k, t]) => `<option value="${k}"${k === vv ? " selected" : ""}>${t}</option>`).join("")}</select></div>
      <div id="af-wl"${vv === "vissa" ? "" : " hidden"}><label for="af-wlista">Vilka (2, 4)</label><input id="af-wlista" value="${Array.isArray(a.veckor) ? a.veckor.join(", ") : ""}"></div></div>
    <div class="falt"><div><label for="af-v">Vilka deltar</label><select id="af-v">${[["alla", "Alla som kan arbeta då"], ["andel", "En andel"], ["antal", "Ett visst antal"], ["varje", "Alla, fördelat på tillfällena"]].map(([k, t]) => `<option value="${k}"${k === vem ? " selected" : ""}>${t}</option>`).join("")}</select></div>
      <div id="af-tal"${vem === "alla" ? " hidden" : ""}><label for="af-t" id="af-tl">${vem === "andel" ? "Andel, %" : vem === "antal" ? "Antal per tillfälle" : "Gånger per person"}</label><input id="af-t" type="number" min="1" value="${vem === "andel" ? Math.round(a.andel * 100) : vem === "antal" ? a.antal : a.varje_person || 1}"></div></div>
    <details${valda.size ? " open" : ""}><summary class="liten">Bara vissa personer (valfritt)</summary><div class="chips" style="margin-top:6px">${st.enhet.indata.personal.map(p => `<label><input type="checkbox" name="af-p" value="${esc(p.id)}"${valda.has(p.id) ? " checked" : ""}>${esc(p.id)}</label>`).join("")}</div></details>
    <div><label for="af-m">Minst kvar på golvet under tiden</label><input id="af-m" type="number" min="0" value="${a.minst_pa_golvet ?? ""}" placeholder="ingen gräns">
      <p class="dampad liten" style="margin:4px 0 0">De som inte deltar får längre pass så att minst så många är i tjänst.</p></div>
    <p><label class="check"><input type="checkbox" id="af-g"${a.fran_golvet !== false ? " checked" : ""}> Deltagarna räknas inte på golvet under tiden</label><br>
      <label class="check"><input type="checkbox" id="af-k"${a.krav ? " checked" : ""}> Måste genomföras</label></p>
    <div class="chips"><button class="primar" type="submit">${st.aktForm.n == null ? "Lägg till" : "Spara"}</button><button type="button" data-g="avbryt-akt">Avbryt</button></div></form>`;
}

function kopplaAkt() {
  const f = $("#af"); if (!f) return;
  const a = st.aktForm.data;
  $("#af-w").onchange = () => ($("#af-wl").hidden = $("#af-w").value !== "vissa");
  $("#af-typ").onchange = () => { const n = $("#af-n"); if (!n.value.trim() || Object.values(AKTTYP).includes(n.value.trim())) n.value = $("#af-typ").value === "annat" ? "" : AKTTYP[$("#af-typ").value]; };
  $("#af-v").onchange = () => {
    const v = $("#af-v").value; $("#af-tal").hidden = v === "alla";
    $("#af-tl").textContent = v === "andel" ? "Andel, %" : v === "antal" ? "Antal per tillfälle" : "Gånger per person";
    $("#af-t").value = v === "andel" ? 50 : 1;
  };
  f.onsubmit = ev => {
    ev.preventDefault();
    const namn = $("#af-n").value.trim() || "Aktivitet", ids = new Set((st.enhet.indata.aktiviteter || []).map(x => x.id));
    let id = a.id; if (!id) { const bas = (namn.normalize("NFD").replace(/[^A-Za-z0-9]/g, "").toUpperCase() || "AKT").slice(0, 8); id = bas; let k = 2; while (ids.has(id)) id = bas + k++; }
    const n = { id, typ: $("#af-typ").value, namn, start: $("#af-s").value, slut: $("#af-e").value };
    if (!(n.slut > n.start)) return meddela("Aktiviteten måste sluta efter att den börjar, samma dag.");
    n.dagar = [...f.querySelectorAll("[name=af-d]:checked")].map(x => x.value);
    if (!n.dagar.length) return meddela("Välj minst en dag.");
    const w = $("#af-w").value;
    if (w === "vissa") { const l = $("#af-wlista").value.split(/[,; ]+/).map(Number).filter(x => x > 0); if (!l.length) return meddela("Ange vilka veckor."); n.veckor = l; }
    else if (w !== "alla") n.veckor = w;
    const v = $("#af-v").value, t = +$("#af-t").value || 1;
    if (v === "andel") n.andel = Math.max(5, Math.min(100, t)) / 100;
    if (v === "antal") n.antal = Math.max(1, Math.round(t));
    if (v === "varje") n.varje_person = Math.max(1, Math.round(t));
    const p = [...f.querySelectorAll("[name=af-p]:checked")].map(x => x.value); if (p.length) n.deltagare = p;
    if (!$("#af-g").checked) n.fran_golvet = false;
    const m = parseInt($("#af-m").value); if (m > 0) n.minst_pa_golvet = m;
    if ($("#af-k").checked) n.krav = true;
    const l = st.enhet.indata.aktiviteter || (st.enhet.indata.aktiviteter = []);
    if (st.aktForm.n == null) l.push(n); else l[st.aktForm.n] = n;
    st.aktForm = null; andrad(true);
  };
}

function onskForm() {
  const o = st.onskForm.data, vv = Array.isArray(o.veckor) ? "vissa" : (o.veckor || "alla");
  return `<form class="formular" id="of">
    <div class="falt"><div><label for="of-p">Person</label><select id="of-p">${st.enhet.indata.personal.map(p => `<option${p.id === o.person ? " selected" : ""}>${esc(p.id)}</option>`).join("")}</select></div>
      <div><label for="of-t">Önskemål</label><select id="of-t">${Object.entries(ONSKTYP).map(([k, t]) => `<option value="${k}"${k === o.typ ? " selected" : ""}>${t}</option>`).join("")}</select></div>
      <div id="of-v"></div></div>
    ${Array.isArray(o.dagindex) ? `<p class="dampad liten">Gäller enskilda dagar: ${esc(o.dagindex.join(", "))}.</p>` : `
    <div><label>Dagar (inga valda = alla)</label><div class="chips">${DAGAR.map(d => `<label><input type="checkbox" name="of-d" value="${d}"${(o.dagar || []).includes(d) ? " checked" : ""}>${d}</label>`).join("")}</div></div>
    <div class="falt"><div><label for="of-w">Veckor</label><select id="of-w">${[["alla", "Alla"], ["jämna", "Jämna"], ["udda", "Udda"], ["vissa", "Vissa"]].map(([k, t]) => `<option value="${k}"${k === vv ? " selected" : ""}>${t}</option>`).join("")}</select></div>
      <div id="of-wl"${vv === "vissa" ? "" : " hidden"}><label for="of-wlista">Vilka (1, 3)</label><input id="of-wlista" value="${Array.isArray(o.veckor) ? o.veckor.join(", ") : ""}"></div></div>`}
    <div class="falt"><div><label>Hur viktigt</label><div class="chips"><label><input type="radio" name="of-k" value="0"${o.krav ? "" : " checked"}>Önskemål</label><label><input type="radio" name="of-k" value="1"${o.krav ? " checked" : ""}>Krav</label></div></div>
      <div id="of-vikt"${o.krav ? " hidden" : ""}><label for="of-vi">Vikt 1–10</label><input id="of-vi" type="number" min="1" max="10" value="${o.vikt || 1}"></div></div>
    <div class="chips"><button class="primar" type="submit">${st.onskForm.n == null ? "Lägg till" : "Spara"}</button><button type="button" data-g="avbryt-onsk">Avbryt</button></div></form>`;
}

function kopplaOnsk() {
  const f = $("#of"); if (!f) return;
  const o = st.onskForm.data;
  const varde = () => {
    const t = $("#of-t").value;
    $("#of-v").innerHTML = t === "tidigast_start" || t === "senast_slut" ? `<label for="of-va">Klockslag</label><input id="of-va" type="time" value="${esc(String(o.varde || "").includes(":") ? o.varde : t === "tidigast_start" ? "08:00" : "14:00")}">`
      : t === "endast_dygnsdel" ? `<label for="of-va">Dygnsdel</label><select id="of-va">${Object.entries(DELAR).map(([k, n]) => `<option value="${k}"${k === o.varde ? " selected" : ""}>${n}</option>`).join("")}</select>` : "";
  };
  varde(); $("#of-t").onchange = varde;
  if ($("#of-w")) $("#of-w").onchange = () => ($("#of-wl").hidden = $("#of-w").value !== "vissa");
  f.querySelectorAll("[name=of-k]").forEach(x => (x.onchange = () => ($("#of-vikt").hidden = f.querySelector("[name=of-k]:checked").value === "1")));
  f.onsubmit = ev => {
    ev.preventDefault();
    const n = { id: o.id || "O" + (Math.max(0, ...(st.enhet.indata.onskemal || []).map(x => +String(x.id || "O0").slice(1) || 0)) + 1), person: $("#of-p").value, typ: $("#of-t").value };
    if ($("#of-va")) n.varde = $("#of-va").value;
    if (Array.isArray(o.dagindex)) n.dagindex = o.dagindex;
    else {
      const d = [...f.querySelectorAll("[name=of-d]:checked")].map(x => x.value); if (d.length && d.length < 7) n.dagar = d;
      const w = $("#of-w").value;
      if (w === "vissa") { const l = $("#of-wlista").value.split(/[,; ]+/).map(Number).filter(x => x > 0); if (!l.length) return meddela("Ange vilka veckor."); n.veckor = l; }
      else if (w !== "alla") n.veckor = w;
    }
    n.krav = f.querySelector("[name=of-k]:checked").value === "1";
    if (!n.krav) n.vikt = Math.max(1, Math.min(10, +$("#of-vi").value || 1));
    const l = st.enhet.indata.onskemal;
    if (st.onskForm.n == null) l.push(n); else l[st.onskForm.n] = n;
    st.onskForm = null; andrad(true);
  };
}

function ritaKorningar() {
  const el = $("#korningar"); if (!el) return;
  el.innerHTML = `<h2>Körningar</h2>` + (st.korningar.length ? st.korningar.map(k => {
    const s = k.status === "OK" ? (k.vakanta ? ["varn", vakText(k.vakanta)] : ["ok", "Klart"]) : ["dalig", "Regler bryts"];
    return `<div class="onsk"><div><button class="lank" data-g="visa-korning" data-id="${k.id}">${esc(k.namn)}</button><br><span class="status ${s[0]}">${s[1]}</span> <span class="dampad liten">${datum(k.skapad)}</span></div>
      <button class="liten fara" data-g="ta-bort-korning" data-id="${k.id}" aria-label="Ta bort">×</button></div>`;
  }).join("") : `<p class="dampad liten">Inga körningar än. Tryck på Lägg schema.</p>`);
}

// ------------------------------------------------------------------ ändringar
document.addEventListener("input", ev => {
  const el = ev.target; if (!st.enhet || !el.closest("#flik")) return;
  const i = st.enhet.indata;
  if (el.dataset.p !== undefined) {
    const p = i.personal[+el.dataset.p], f = el.dataset.f, v = el.value.trim();
    if (f === "id") { const gammal = p.id; p.id = v; (i.onskemal || []).forEach(o => { if (o.person === gammal) o.person = v; }); }
    else if (f === "grad") { if (v) p.grad = Math.round(+v.replace(",", ".")) / 100; }
    else if (f === "dygnsdelar") { if (v === "morgon,kvall") delete p.dygnsdelar; else p.dygnsdelar = v.split(","); }
    else if (f === "antal_pass") { if (v) p.antal_pass = parseInt(v) || undefined; else delete p.antal_pass; }
    else { if (v) p[f] = v; else delete p[f]; }
    andrad(f === "helgfrekvens");
  } else if (el.dataset.b) { i.behov[el.dataset.b][el.dataset.d] = parseInt(el.value) || 0; andrad(false); }
  else if (el.dataset.r) {
    i.regler = i.regler || {};
    const k = el.dataset.r;
    if (el.dataset.t === "check") { if (el.checked) delete i.regler[k]; else i.regler[k] = false; }
    else if (el.tagName === "SELECT") { if (el.value === "mjuk") delete i.regler[k]; else i.regler[k] = el.value; }
    else if (el.type === "time") i.regler[k] = el.value;
    else { const v = parseFloat(el.value.replace(",", ".")); if (isNaN(v)) delete i.regler[k]; else i.regler[k] = v; }
    andrad(false);
  } else if (el.dataset.i) {
    const k = el.dataset.i;
    if (k === "cykliskt") i.cykliskt = el.checked;
    else if (k === "startdatum") { if (!el.value) delete i.startdatum; else if (OB.veckodag(OB.frånText(el.value)) !== 0) { meddela("Startdatum ska vara en måndag."); return; } else i.startdatum = el.value; }
    else if (el.value === "") delete i[k]; else i[k] = ["budget_timmar_vecka", "timkostnad_kr", "ob_prognos_procent"].includes(k) ? parseFloat(el.value.replace(",", ".")) : parseInt(el.value);
    andrad(false);
  }
});
document.addEventListener("change", ev => { if (ev.target.tagName === "SELECT" && ev.target.closest("#flik") && (ev.target.dataset.p !== undefined || ev.target.dataset.r)) ev.target.dispatchEvent(new Event("input", { bubbles: true })); });

document.addEventListener("click", async ev => {
  const el = ev.target.closest("[data-g]"); if (!el) return;
  const g = el.dataset.g, i = st.enhet && st.enhet.indata;
  switch (g) {
    case "ny": return skapa("Ny enhet", NY());
    case "exempel": { const x = EXEMPEL[+el.dataset.i]; return skapa(x.namn, x.indata); }
    case "oppna": return oppna(structuredClone(st.enheter.find(e => e.id === el.dataset.id)));
    case "kopiera": { const e = st.enheter.find(x => x.id === el.dataset.id); await lager.sparaEnhet({ id: nyttId(), namn: e.namn + " (kopia)", indata: e.indata }); meddela("Kopia skapad."); return visaLista(); }
    case "ta-bort":
      if (el.dataset.ok !== "1") { el.dataset.ok = "1"; el.textContent = "Säker?"; setTimeout(() => { el.dataset.ok = ""; el.textContent = "Ta bort"; }, 4000); return; }
      await lager.taBortEnhet(el.dataset.id); meddela("Borttagen."); return visaLista();
    case "tillbaka": clearTimeout(sparaTimer); if (st.enhet) await lager.sparaEnhet(st.enhet).catch(() => {}); return visaLista();
    case "flik": st.flik = el.dataset.f; st.onskForm = null; st.aktForm = null; return ritaFlik();
    case "ny-person": {
      const natt = el.dataset.natt === "1", ids = new Set(i.personal.map(p => p.id)), pre = natt ? "N" : "P";
      let n = i.personal.length + 1; while (ids.has(pre + n)) n++;
      i.personal.push(natt ? { id: pre + n, grad: 1, dygnsdelar: ["natt"] } : { id: pre + n, grad: 0.75 }); return andrad(true);
    }
    case "ta-bort-person": {
      const p = i.personal[+el.dataset.n];
      if ((i.onskemal || []).some(o => o.person === p.id)) return meddela(`${p.id} har önskemål. Ta bort dem först.`);
      i.personal.splice(+el.dataset.n, 1); return andrad(true);
    }
    case "ny-behov": { const k = $("#ny-dag").value; if (!k) return; i.behov[k] = { ...(["lör", "sön", "helg"].includes(k) ? i.behov.helg : i.behov.vardag) }; return andrad(true); }
    case "ta-bort-behov": delete i.behov[el.dataset.k]; return andrad(true);
    case "nytt-onsk": if (!i.personal.length) return; st.onskForm = { n: null, data: { person: i.personal[0].id, typ: "ledig", krav: false, vikt: 1 } }; return ritaFlik();
    case "andra-onsk": st.onskForm = { n: +el.dataset.n, data: structuredClone(i.onskemal[+el.dataset.n]) }; return ritaFlik();
    case "avbryt-onsk": st.onskForm = null; return ritaFlik();
    case "ny-akt": {
      const v = (i.behov || {}).vardag || {}, l = [v.morgon, v.kvall].filter(x => x > 0);
      st.aktForm = { n: null, data: { typ: "apt", namn: "APT", dagar: ["tis"], veckor: "alla", start: "14:00", slut: "16:00", andel: 0.5, minst_pa_golvet: l.length ? Math.min(...l) : undefined } }; return ritaFlik();
    }
    case "andra-akt": st.aktForm = { n: +el.dataset.n, data: structuredClone(i.aktiviteter[+el.dataset.n]) }; return ritaFlik();
    case "avbryt-akt": st.aktForm = null; return ritaFlik();
    case "ta-bort-akt": i.aktiviteter.splice(+el.dataset.n, 1); if (!i.aktiviteter.length) delete i.aktiviteter; return andrad(true);
    case "ta-bort-onsk": i.onskemal.splice(+el.dataset.n, 1); return andrad(true);
    case "lagg": return laggSchema();
    case "lagg-manuellt": { const b = MOTOR_HUVUD.balans(st.enhet.indata); if (b.fel) { meddela("Rätta felen i kontrollen först."); return; } return laggManuellt(); }
    case "senaste": if (st.korningar.length) { st.rflik = "oversikt"; return visaKorning(st.korningar[0]); } return;
    case "rflik": st.rflik = el.dataset.f; st.person = null; ritaResultat(); return;
    case "person": st.person = el.dataset.p || null; st.rflik = "personer"; ritaResultat(); window.scrollTo(0, 0); return;
    case "redigera": st.red = { schema: structuredClone(st.korning.resultat.schema), historik: [], andringar: 0, panel: null }; raknaOmUtkast(); return;
    case "red-avbryt": if (st.red.andringar && !confirm("Avbryta utan att spara ändringarna?")) return; st.red = null; ritaResultat(); return;
    case "red-angra": if (st.red.historik.length) { st.red.schema = st.red.historik.pop(); st.red.andringar--; st.red.panel = null; raknaOmUtkast(); } return;
    case "red-cell": st.red.panel = { c: el.dataset.c }; ritaResultat(); return;
    case "red-stang": st.red.panel = null; ritaResultat(); return;
    case "red-ta-bort": { const [pid, d] = st.red.panel.c.split("|"); st.red.panel = null; return andraUtkast(sch => { sch[pid][+d] = null; }); }
    case "red-spara-pass": return sparaPass();
    case "red-spara": return sparaJustering();
    case "simulering": return visaSimulering();
    case "simulera": return simulera();
    case "anvand-forslag": return anvandForslag(+el.dataset.n);
    case "visa-korning": return visaKorning(st.korningar.find(k => k.id === el.dataset.id));
    case "ta-bort-korning": { const k = st.korningar.find(x => x.id === el.dataset.id); await lager.taBortKorning(k); st.korningar = st.korningar.filter(x => x !== k); return ritaKorningar(); }
    case "till-enhet": return oppna(st.enhet);
    case "vecka": st.vecka = +el.dataset.v; st.cell = null; return ritaResultat();
    case "cell": {
      st.cell = st.cell === el.dataset.c ? null : el.dataset.c;
      document.querySelectorAll(".pass.vald").forEach(b => b.classList.remove("vald")); if (st.cell) el.classList.add("vald");
      $("#info").innerHTML = cellInfo(); return;
    }
    case "excel": return excel();
    case "kopiera-tabell": return kopieraTabell();
  }
});

// ------------------------------------------------------------------ lägga schema
let arbetare = null;
function laggSchema() {
  const b = MOTOR_HUVUD.balans(st.enhet.indata);
  if (b.fel) { meddela("Rätta felen i kontrollen först."); $("#kontroll").scrollIntoView({ behavior: "smooth" }); return; }
  st.kor = true; ritaFot();
  const kontroll = $("#kontroll");
  kontroll.innerHTML = `<div class="banner info"><strong>Lägger schemat …</strong><span class="liten">Söker ett schema som håller alla hårda regler med så få vakanser som möjligt.</span><div class="matare"><div id="matare"></div></div></div>`;
  kontroll.scrollIntoView({ behavior: "smooth", block: "start" });
  const klar = res => { st.kor = false; ritaFot(); efterKorning(res, b); };
  try {
    if (!arbetare) arbetare = new Worker(URL.createObjectURL(new Blob([$("#motor-kod").textContent], { type: "text/javascript" })));
    arbetare.onmessage = e => {
      if (e.data.typ === "framsteg") { const m = $("#matare"); if (m) m.style.width = Math.round(e.data.andel * 100) + "%"; }
      else if (e.data.typ === "klar") klar(e.data.resultat);
      else { st.kor = false; ritaFot(); ritaKontroll(); meddela("Fel i motorn: " + e.data.fel); }
    };
    arbetare.onerror = () => { arbetare = null; setTimeout(() => klar(MOTOR_HUVUD.los(st.enhet.indata, { sekunder: st.sekunder })), 30); };
    arbetare.postMessage({ indata: st.enhet.indata, sekunder: st.sekunder, seed: Date.now() % 100000 });
  } catch {
    setTimeout(() => klar(MOTOR_HUVUD.los(st.enhet.indata, { sekunder: st.sekunder, seed: Date.now() % 100000 })), 30);
  }
}

async function efterKorning(res, bal) {
  if (res.status === "INDATAFEL") { ritaKontroll(); meddela(res.fel[0]); return; }
  const granskning = GRANSKNING.kontrollera(st.enhet.indata, res);
  const k = { id: nyttId(), enhet: st.enhet.id, namn: `Körning ${st.korningar.length + 1}`, skapad: Date.now(), status: res.status === "OK" && granskning.giltigt ? "OK" : "BROTT",
    vakanta: res.kpi.vakanta_pass, data: JSON.stringify({ resultat: res, granskning, balans: bal.forvantade_vakanser, indata: st.enhet.indata }) };
  st.korningar.unshift(k);
  try { await lager.sparaKorning(k); } catch (e) { meddela("Körningen kunde inte sparas: " + e.message); }
  visaKorning(k);
}

// ------------------------------------------------------------------ resultat
function visaKorning(k) {
  st.vy = "resultat"; st.korning = { ...k, ...JSON.parse(k.data) }; st.vecka = 0; st.cell = null; st.red = null; st.person = null;
  $("#fot").hidden = true; ritaResultat(); window.scrollTo(0, 0);
}

function ritaResultat() {
  const k = st.korning, res = st.red?.res || k.resultat, g = st.red?.g || k.granskning;
  const brott = (res.brott || []).concat(g.brott);
  const ok = !brott.length, flik = st.red ? "schema" : st.rflik || "oversikt";
  const F = [["oversikt", "Översikt"], ["schema", "Schema"], ["personer", "Personer"], ["regler", "Regelkontroll"]];
  let h = `<header class="kort"><div class="rad"><button class="lank" data-g="till-enhet">‹ ${esc(st.enhet.namn)}</button><span class="dampad liten">${datum(k.skapad)}</span></div>
    <h1 style="margin-top:4px">${esc(k.namn)}</h1>
    <div class="banner ${!ok ? "dalig" : res.kpi.vakanta_pass ? "varn" : "ok"}" style="margin-top:10px"><strong>${!ok ? `${brott.length} hårda regler bryts` : res.kpi.vakanta_pass ? `Schema klart, med ${vakText(res.kpi.vakanta_pass)}` : "Schema klart, utan vakanser och avtalsbrott"}</strong>
      <span class="liten">${res.veckor} veckor${res.cykliskt ? ", cykliskt" : ""} · ${Object.keys(res.schema).length} personer · ${sv(res.sekunder)} s · bemanningsbalansen förutsåg ${vakText(k.balans)}</span></div>
    <div class="flikrad" role="group" aria-label="Visa">${F.map(([f, t]) => `<button data-g="rflik" data-f="${f}" aria-pressed="${flik === f}">${t}</button>`).join("")}</div></header>`;
  if (flik === "oversikt") h += ritaOversikt(k, brott);
  else if (flik === "regler") h += ritaRegelkontroll(k, brott);
  else if (flik === "personer" && st.person && res.schema[st.person]) h += ritaPerson(st.person, res, k.indata);
  else if (flik === "personer") {
    const ob = GRAF.obFor(res, k.indata);
    h += `<section class="kort"><h2>Per person</h2><p class="dampad liten">Tryck på en person för hela schemat med timmar, OB och kostnad.</p><div class="rull"><table><thead><tr><th>Person</th><th class="tal">Pass</th><th class="tal">Tid</th><th class="tal">Mål</th><th class="tal">Kvällar</th><th class="tal">OB/år</th></tr></thead><tbody>
    ${Object.entries(res.personer).map(([p, x]) => `<tr><td><button class="lank" data-g="person" data-p="${esc(p)}" style="font-weight:700">${esc(p)} ›</button></td><td class="tal">${x.pass}</td><td class="tal nw">${timmar(x.minuter)}</td><td class="tal nw">${timmar(x.mal_minuter)}</td><td class="tal">${x.kvallspass}</td><td class="tal nw">${ob ? GRAF.kr(ob.per[p].ar.kr) : "–"}</td></tr>`).join("")}</tbody></table></div>
    ${ob ? `<p class="dampad liten" style="margin-top:8px">OB per år enligt AB 25 § 21 från ${esc(ob.start)}${ob.antaget ? " (antaget – ange startdatum under Period)" : ""}.</p>` : ""}</section>`;
  }
  else {
    if (st.red) h += redigeringsrad();
    h += `<section class="kort"><div class="rad"><h2 style="margin:0">Schema</h2><div class="chips">${st.red ? "" : `<button class="liten" data-g="redigera">Justera schemat</button><button class="liten" data-g="excel">Excel</button><button class="liten" data-g="kopiera-tabell">Kopiera</button>`}</div></div><div class="veckor" style="margin-top:8px">` +
      Array.from({ length: res.veckor }, (_, v) => `<button data-g="vecka" data-v="${v}" aria-pressed="${v === st.vecka}">V${v + 1}</button>`).join("") +
      `<button data-g="vecka" data-v="-1" aria-pressed="${st.vecka === -1}">${res.veckor === 6 ? "Sexveckorsperiod" : "Hela perioden"}</button></div>` +
      (st.vecka === -1 ? dagTabell(res, Array.from({ length: res.veckor * 7 }, (_, d) => d), true) : vecka(res, st.vecka)) +
      `<p class="liten" id="info" style="margin-top:8px">${st.red ? "Tryck på ett pass för att ändra, flytta eller ta bort det. Tryck på en tom ruta för att lägga till ett pass." : cellInfo()}</p><p class="dampad liten">D dag, K kväll, N natt. Streckad ruta = vakant pass. <span class="minus">−1</span> vakans. <b>◼ R</b> resurspass och <span class="plus">+1</span> resurstid, utöver behovet.</p></section>`;
    { const dagar = st.vecka === -1 ? Array.from({ length: res.veckor * 7 }, (_, d) => d) : Array.from({ length: 7 }, (_, i) => st.vecka * 7 + i);
      const ind = st.korning.indata || st.enhet.indata;
      h += `<section class="kort"><h2>Sammanställning ${st.vecka === -1 ? "hela perioden" : "vecka " + (st.vecka + 1)}</h2>${GRAF.summaTabell(res, ind, dagar, GRAF.resurs(res, ind), "")}</section>`; }
    h += GRAF.aktivitetKort(res);
    if (res.vakanser.length) h += `<section class="kort"><h2>Vakanser</h2><ul class="punkter">${res.vakanser.map(x => `<li>Vecka ${x.vecka} ${x.veckodag}: ${x.antal} ${DELAR[x.dygnsdel].toLowerCase()}pass</li>`).join("")}</ul></section>`;
  }
  if (st.red?.panel) h += redigeringspanel(res);
  $("#sida").innerHTML = h;
}

// ------------------------------------------------------------------ person
function ritaPerson(pid, res, ind) {
  const x = res.personer[pid], rad = res.schema[pid], W = res.veckor, p = ind.personal.find(q => q.id === pid) || {};
  const kod = { morgon: "D", kvall: "K", natt: "N" }, rs = GRAF.resurs(res, ind);
  let h = `<section class="kort"><button class="lank" data-g="person" data-p="">‹ Alla personer</button><h2 style="margin:6px 0 0">${esc(pid)}</h2>
    <p class="dampad" style="margin:2px 0 0">${Math.round((p.grad ?? 1) * 100)} % · ${(p.dygnsdelar || ["morgon", "kvall"]).map(d => DELAR[d].toLowerCase()).join(" och ")} · ${x.pass} pass · ${x.kvallspass} kvällar</p>
    <div class="rull" style="margin-top:10px"><table class="schema"><thead><tr><th></th>${DAGAR.map((d, i) => `<th class="${i > 4 ? "helg" : ""}">${d}</th>`).join("")}<th class="tal">Tid</th></tr></thead><tbody>`;
  for (let v = 0; v < W; v++) {
    const veck = rad.slice(v * 7, v * 7 + 7).reduce((s, q) => s + (q ? q.netto : 0), 0);
    h += `<tr><td>V${v + 1}</td>${DAGAR.map((_, i) => { const q = rad[v * 7 + i], r = rs.has(pid + ":" + (v * 7 + i)); return `<td class="${i > 4 ? "helg" : ""}">${q ? `<span class="pass ${q.dygnsdel}${r ? " resurs" : ""}" data-tips="${DELAR[q.dygnsdel]} ${q.start}–${q.slut}\nArbetstid ${timmar(q.netto)}, rast ${q.rast} min${esc(GRAF.aktText(q))}${GRAF.obPassText(pid, v * 7 + i, res, ind)}"><b>${kod[q.dygnsdel]}</b><small>${q.start}–${q.slut}</small>${r ? GRAF.resursMarke : ""}${GRAF.aktMarke(q)}</span>` : ""}</td>`; }).join("")}<td class="tal nw liten">${sv(Math.round(veck / 6) / 10)} h</td></tr>`;
  }
  h += `</tbody></table></div><p class="dampad liten" style="margin-top:6px">Tryck på ett pass för datum och OB.</p></section>`;
  return h + `<div class="grafyta">${GRAF.vilaKort(pid, res, ind)}${GRAF.obKort(pid, res, ind, { installningar: "Period" })}</div>`;
}

// Lägg schemat själv: en körning med tomt schema som öppnas i redigeringsläge.
async function laggManuellt() {
  const ind = st.enhet.indata, W = ind.veckor || 4, ht = ind.heltid_minuter_per_vecka || 2220;
  const grund = { status: "OK", motor: "manuell", enhet: ind.enhet, veckor: W, cykliskt: ind.cykliskt !== false, sekunder: 0,
    kpi: { vakanta_pass: 0, blocklangd: 0, rattvisa: 0, onskemal: 0 }, vakanser: [], schema: {},
    personer: Object.fromEntries(ind.personal.map(p => [p.id, { pass: 0, minuter: 0, mal_minuter: Math.round((p.heltid_minuter_per_vecka || (p.dygnsdelar && p.dygnsdelar[0] === "natt" && p.dygnsdelar.length === 1 ? ind.heltid_natt_minuter_per_vecka || 2060 : ht)) * (p.grad ?? 1) * W), kvallspass: 0, helgfrekvens: p.helgfrekvens || null }])) };
  const res = raknaOm(ind, GUIDE.tomtSchema(ind), grund), g = GRANSKNING.kontrollera(ind, res);
  const k = { id: nyttId(), enhet: st.enhet.id, namn: `Körning ${st.korningar.length + 1} (manuell)`, skapad: Date.now(), status: "BROTT", vakanta: res.kpi.vakanta_pass,
    data: JSON.stringify({ resultat: res, granskning: g, balans: 0, indata: ind }) };
  st.korningar.unshift(k);
  try { await lager.sparaKorning(k); } catch (e) { meddela("Kunde inte spara: " + e.message); }
  visaKorning(k); st.rflik = "schema";
  st.red = { schema: structuredClone(res.schema), historik: [], andringar: 0, panel: null }; raknaOmUtkast();
}

// ------------------------------------------------------------------ justera ett färdigt schema
// Utkastet räknas om (rast, arbetstid, vakanser) och granskas av den fristående granskningen efter varje ändring.
function raknaOm(indata, schema, grund) {
  const r = indata.regler || {}, rg = r.rast_grans_minuter ?? 300, rl = r.rast_minuter ?? 30;
  const maltid = (indata.nattpass?.[0]?.maltidsuppehall) !== false;
  const min = t => { const [a, b] = t.split(":").map(Number); return a * 60 + b; };
  const nytt = {};
  for (const [pid, rad] of Object.entries(schema)) nytt[pid] = rad.map(p => {
    if (!p) return null;
    const s = min(p.start); let e = min(p.slut); if (e <= s) e += 1440;
    const langd = e - s, rast = p.dygnsdel === "natt" && maltid ? 0 : langd > rg ? rl : 0;
    return { ...p, rast, netto: langd - rast };
  });
  const N = grund.veckor * 7, bd = behovDag(indata), vakanser = [];
  for (let d = 0; d < N; d++) for (const del of ["morgon", "kvall", "natt"]) {
    const n = Object.values(nytt).filter(rad => rad[d]?.dygnsdel === del).length, b = bd[d % 7][del];
    if (n < b) vakanser.push({ dag: d, vecka: Math.floor(d / 7) + 1, veckodag: DAGAR[d % 7], dygnsdel: del, antal: b - n });
  }
  const personer = {};
  for (const [pid, rad] of Object.entries(nytt)) {
    const l = rad.filter(Boolean);
    personer[pid] = { ...grund.personer[pid], pass: l.length, minuter: l.reduce((a, q) => a + q.netto, 0), kvallspass: l.filter(q => q.dygnsdel === "kvall").length };
  }
  // aktivitetstillfällen: vem som har aktiviteten på passet som täcker dagen
  const aktiviteter = (grund.aktiviteter || []).map(t => {
    const delt = Object.keys(nytt).filter(pid => [t.dag, (t.dag - 1 + N) % N].some(dd => (nytt[pid][dd]?.aktiviteter || []).some(a => a.id === t.aktivitet)
      && (dd === t.dag ? nytt[pid][dd].dygnsdel !== "natt" || min(nytt[pid][dd].start) <= min(t.start) : nytt[pid][dd].dygnsdel === "natt")));
    return { ...t, deltagare: delt, saknas: Math.max(0, t.behov - delt.length) };
  });
  return { ...grund, schema: nytt, personer, vakanser, aktiviteter, brott: [], justerat: true,
    kpi: { ...grund.kpi, vakanta_pass: vakanser.reduce((a, v) => a + v.antal, 0), aktivitet_saknas: aktiviteter.reduce((a, t) => a + t.saknas, 0) } };
}

function raknaOmUtkast() {
  const k = st.korning;
  st.red.res = raknaOm(k.indata, st.red.schema, k.resultat);
  st.red.g = GRANSKNING.kontrollera(k.indata, st.red.res);
  ritaResultat();
}

function andraUtkast(fn) {
  st.red.historik.push(structuredClone(st.red.schema));
  fn(st.red.schema); st.red.andringar++;
  raknaOmUtkast();
}

function redigeringsrad() {
  const r = st.red, brott = r.g.brott.length, b0 = st.korning.granskning.brott.length + (st.korning.resultat.brott || []).length;
  const v0 = st.korning.resultat.kpi.vakanta_pass, v = r.res.kpi.vakanta_pass;
  const diff = (nu, fore) => nu === fore ? "" : ` (${nu > fore ? "+" : "−"}${Math.abs(nu - fore)})`;
  return `<section class="kort" style="border:2px solid var(--guld)"><h2 style="margin:0">Du justerar schemat</h2>
    <p class="dampad liten" style="margin:4px 0 0">Varje ändring granskas direkt. Originalet finns kvar; justeringen sparas som en ny körning.</p>
    <div class="kpi"><div><b>${r.andringar}</b><span>ändringar</span></div><div class="${brott ? "fel" : ""}"><b>${brott}</b><span>regelbrott${diff(brott, b0)}</span></div><div class="${v ? "fel" : ""}"><b>${v}</b><span>vakanta pass${diff(v, v0)}</span></div></div>
    ${brott ? `<details class="liten" style="margin-top:6px"><summary>Visa regelbrotten</summary><ul class="punkter">${r.g.brott.slice(0, 20).map(b => `<li><b>${esc(b.person || "")}</b> ${esc(b.text)}</li>`).join("")}</ul></details>` : ""}

}

function redigeringspanel(res) {
  const [pid, ds] = st.red.panel.c.split("|"), d = +ds, p = st.red.schema[pid][d], N = res.veckor * 7;
  const tider = { morgon: ["07:00", "15:00"], kvall: ["14:00", "22:00"], natt: ["21:45", "06:45"] };
  for (const rad of Object.values(st.red.schema)) for (const q of rad) if (q) tider[q.dygnsdel] = [q.start, q.slut];
  const v = p || { dygnsdel: "morgon", start: tider.morgon[0], slut: tider.morgon[1] };
  return `<div class="bladpanel" role="dialog" aria-label="${p ? "Ändra pass" : "Nytt pass"}"><div class="rad"><b>${p ? "Ändra pass" : "Nytt pass"} – ${esc(pid)}, V${Math.floor(d / 7) + 1} ${DAGAR[d % 7]}</b><button class="lank" data-g="red-stang" aria-label="Stäng">✕</button></div>
    <div class="falt" style="margin-top:8px"><div><label for="rp-del">Pass</label><select id="rp-del">${Object.entries(DELAR).map(([k, t]) => `<option value="${k}"${v.dygnsdel === k ? " selected" : ""} data-start="${tider[k][0]}" data-slut="${tider[k][1]}">${t}</option>`).join("")}</select></div>
      <div><label for="rp-start">Start</label><input id="rp-start" type="time" value="${v.start}"></div><div><label for="rp-slut">Slut</label><input id="rp-slut" type="time" value="${v.slut}"></div>
      ${p ? `<div><label for="rp-person">Flytta till</label><select id="rp-person">${Object.keys(st.red.schema).map(x => `<option${x === pid ? " selected" : ""}>${esc(x)}</option>`).join("")}</select></div>
      <div><label for="rp-dag">Dag</label><select id="rp-dag">${Array.from({ length: N }, (_, i) => `<option value="${i}"${i === d ? " selected" : ""}>V${Math.floor(i / 7) + 1} ${DAGAR[i % 7]}</option>`).join("")}</select></div>` : ""}</div>
    <div class="chips" style="margin-top:10px"><button class="primar" data-g="red-spara-pass">${p ? "Spara" : "Lägg till"}</button>${p ? `<button class="fara" data-g="red-ta-bort">Ta bort passet</button>` : ""}</div>
    <p class="dampad liten" style="margin:6px 0 0">Rasten räknas ut efter passets längd. Finns ett pass där du flyttar till byter passen plats.</p></div>`;
}

function sparaPass() {
  const [pid, ds] = st.red.panel.c.split("|"), d = +ds;
  const v = { dygnsdel: $("#rp-del").value, start: $("#rp-start").value, slut: $("#rp-slut").value };
  if (!v.start || !v.slut) { meddela("Ange start och slut."); return; }
  const till = $("#rp-person") ? [$("#rp-person").value, +$("#rp-dag").value] : [pid, d];
  st.red.panel = null;
  andraUtkast(sch => {
    const nytt = { ...(sch[pid][d] || {}), ...v, manuell: true };
    if (till[0] === pid && till[1] === d) { sch[pid][d] = nytt; return; }
    const b = sch[till[0]][till[1]]; sch[till[0]][till[1]] = nytt; sch[pid][d] = b ? { ...b, manuell: true } : null;
  });
}

async function sparaJustering() {
  const r = st.red, k0 = st.korning;

// ------------------------------------------------------------------ simulering
// Samma förslag som datorns Simulering (analys.js är en översättning av analys.py). Varje förslag läggs av motorn
// i tur och ordning och granskas av den fristående granskningen.
function korMotor(indata, sekunder) {
  return new Promise(klar => {
    try {
      const w = new Worker(URL.createObjectURL(new Blob([$("#motor-kod").textContent], { type: "text/javascript" })));
      w.onmessage = e => { if (e.data.typ === "framsteg") return; w.terminate(); klar(e.data.typ === "klar" ? e.data.resultat : { status: "FEL", fel: [e.data.fel] }); };
      w.onerror = () => { w.terminate(); klar(MOTOR_HUVUD.los(indata, { sekunder })); };
      w.postMessage({ indata, sekunder, seed: Date.now() % 100000 });
    } catch { setTimeout(() => klar(MOTOR_HUVUD.los(indata, { sekunder, seed: Date.now() % 100000 })), 30); }
  });
}

async function simulera() {
  const budget = parseFloat($("#s-bud").value.replace(",", ".")) || null, tk = parseFloat($("#s-tk").value.replace(",", ".")) || null, sek = +$("#s-sek").value;
  const f = ANALYS.forslag(st.enhet.indata, budget);
  const S = st.sim = { enhet: st.enhet.id, underlag: f.underlag, scenarier: f.scenarier, tk, klar: false, pagar: 0 };
  ritaSimulering();
  for (let n = 0; n < S.scenarier.length; n++) {
    if (st.sim !== S) return;
    S.pagar = n; if (st.vy === "simulering") ritaSimulering();
    const x = S.scenarier[n], res = await korMotor(x.indata, sek);
    const harSchema = res.status === "OK" || res.status === "BROTT";  // BROTT: schema finns men bryter hårda regler
    const g = harSchema ? GRANSKNING.kontrollera(x.indata, res) : null;
    if (g) g.brott = g.brott.concat(res.brott || []);
    x.resultat = harSchema ? res : null; x.granskning = g;
    x.konsekvenser = ANALYS.konsekvenser(x.indata, { ...res, status: harSchema ? "OK" : "INFEASIBLE" }, g, S.underlag.budget_timmar_vecka);
  }
  S.klar = true; S.pagar = null; S.ordning = ANALYS.rangordna(S.scenarier);
  if (st.vy === "simulering") ritaSimulering();
}

async function anvandForslag(n) {
  const x = st.sim.scenarier[n];
  const e = { id: nyttId(), namn: `${st.enhet.namn} – ${x.namn}`, indata: structuredClone(x.indata) };
  await lager.sparaEnhet(e);
  if (x.resultat) {
    const k = { id: nyttId(), enhet: e.id, namn: "Körning 1", skapad: Date.now(), status: x.granskning?.brott.length ? "BROTT" : "OK", vakanta: x.resultat.kpi.vakanta_pass,
      data: JSON.stringify({ resultat: x.resultat, granskning: x.granskning, balans: MOTOR_HUVUD.balans(x.indata).forvantade_vakanser, indata: x.indata }) };
    try { await lager.sparaKorning(k); } catch { /* enheten finns ändå */ }
  }
  meddela("Förslaget är sparat som en ny enhet."); st.sim = null;
  await oppna(e);
}

function vakansPass(res) {
  const tider = {};
  for (const rad of Object.values(res.schema)) for (const x of rad) if (x) { const k = x.start + "–" + x.slut; (tider[x.dygnsdel] = tider[x.dygnsdel] || {})[k] = (tider[x.dygnsdel][k] || 0) + 1; }
  const reserv = { morgon: "07:00–15:00", kvall: "14:00–22:00", natt: "21:45–06:45" };
  const perDag = Array.from({ length: res.veckor * 7 }, () => []);
  for (const v of res.vakanser) for (let i = 0; i < v.antal; i++) {
    const [start, slut] = (tider[v.dygnsdel] ? Object.entries(tider[v.dygnsdel]).sort((a, b) => b[1] - a[1])[0][0] : reserv[v.dygnsdel]).split("–");
    perDag[v.dag].push({ dygnsdel: v.dygnsdel, start, slut });
  }
  perDag.forEach(l => l.sort((a, b) => "mkn".indexOf(a.dygnsdel[0]) - "mkn".indexOf(b.dygnsdel[0])));
  return perDag;
}

function behovDag(indata) {
  const ut = Array.from({ length: 7 }, () => ({ morgon: 0, kvall: 0, natt: 0 }));
  for (const [k, v] of Object.entries(indata.behov || {})) {
    const idx = k === "vardag" ? [0, 1, 2, 3, 4] : k === "helg" ? [5, 6] : k === "alla" ? [0, 1, 2, 3, 4, 5, 6] : [DAGAR.indexOf(k)];
    idx.forEach(i => { if (i >= 0) ut[i] = { morgon: v.morgon || 0, kvall: v.kvall || 0, natt: v.natt || 0 }; });
  }
  return ut;
}

function vecka(res, v) { return dagTabell(res, Array.from({ length: 7 }, (_, i) => v * 7 + i), false); }

function dagTabell(res, dagar, period) {
  const ind = st.korning.indata || st.enhet.indata, pers = Object.keys(res.schema), vak = {}, vp = vakansPass(res), rs = GRAF.resurs(res, ind);
  const kod = { morgon: "D", kvall: "K", natt: "N" };
  res.vakanser.forEach(x => (vak[x.dag] = (vak[x.dag] || 0) + x.antal));
  const kl = d => `class="${d % 7 > 4 ? "helg" : ""}${period && d % 7 === 0 ? " ny-vecka" : ""}"`;
  let h = `<div class="rull"><table class="schema${period ? " period" : ""}"${period ? ` style="min-width:${46 + dagar.length * 30}px"` : ""}><thead>`;
  if (period) h += `<tr><th></th>${Array.from({ length: dagar.length / 7 }, (_, w) => `<th colspan="7" class="ny-vecka" style="text-align:left">V${w + 1}</th>`).join("")}</tr>`;
  h += `<tr><th>${period ? "" : "V" + (Math.floor(dagar[0] / 7) + 1)}</th>${dagar.map(d => `<th ${kl(d)}>${period ? DAGAR[d % 7][0] : DAGAR[d % 7]}</th>`).join("")}</tr></thead><tbody>`;
  for (const p of pers) h += `<tr><td title="${esc(p)}">${st.red ? esc(p) : `<button class="lank" data-g="person" data-p="${esc(p)}" style="font-weight:700">${esc(p)}</button>`}</td>` + dagar.map(d => {
    const x = res.schema[p][d], n = p + "|" + d;
    if (st.red && !x) return `<td ${kl(d)}><button class="tomruta" data-g="red-cell" data-c="${esc(n)}" aria-label="Lägg till pass ${esc(p)} ${DAGAR[d % 7]}">+</button></td>`;
    const r = x && rs.has(p + ":" + d);
    return `<td ${kl(d)}>${x ? `<button class="pass ${x.dygnsdel}${r ? " resurs" : ""}${st.cell === n ? " vald" : ""}${x.manuell ? " manuell" : ""}" data-g="${st.red ? "red-cell" : "cell"}" data-c="${esc(n)}" aria-label="${esc(p)} ${DAGAR[d % 7]} ${x.start} till ${x.slut}${r ? ", resurspass" : ""}"><b>${kod[x.dygnsdel]}</b>${period ? "" : `<small>${x.start}–${x.slut}</small>`}${r && !period ? GRAF.resursMarke : ""}${period ? (x.aktiviteter ? `<i class="akt">★</i>` : "") : GRAF.aktMarke(x)}</button>` : ""}</td>`;
  }).join("") + `</tr>`;
  const rader = Math.max(0, ...dagar.map(d => vp[d].length));
  for (let r = 0; r < rader; r++) h += `<tr class="vakantrad"><td>Vakant</td>` + dagar.map(d => {
    const x = vp[d][r];
    return `<td ${kl(d)}>${x ? `<span class="pass vakant ${x.dygnsdel}" aria-label="Vakant ${DELAR[x.dygnsdel].toLowerCase()}pass ${x.start} till ${x.slut}"><b>${kod[x.dygnsdel]}</b>${period ? "" : `<small>${x.start}–${x.slut}</small>`}</span>` : ""}</td>`;
  }).join("") + `</tr>`;
  const bd = behovDag(st.korning.indata || st.enhet.indata);
  h += `<tr class="bem"><td>I tj.</td>` + dagar.map(d => {
    const c = { morgon: 0, kvall: 0, natt: 0 };
    pers.forEach(p => { const x = res.schema[p][d]; if (x) c[x.dygnsdel]++; });
    const over = ["morgon", "kvall", "natt"].reduce((s, k) => s + Math.max(0, c[k] - bd[d % 7][k]), 0);
    const marke = `${vak[d] ? `<span class="minus">−${vak[d]}</span>` : ""}${over ? `<span class="plus">+${over}</span>` : ""}`;
    return `<td ${kl(d).replace('class="', `class="${vak[d] ? "vakans " : over ? "over " : ""}`)}>${period ? (marke || "✓") : `D${c.morgon}<br>K${c.kvall}<br>N${c.natt}${marke ? "<br>" + marke : ""}`}</td>`;
  }).join("") + `</tr></tbody></table></div>`;
  return h;
}

function cellInfo() {
  if (!st.cell) return `<span class="dampad">Tryck på ett pass för tider och rast.</span>`;
  const [p, d] = st.cell.split("|"), x = st.korning.resultat.schema[p][+d];
  return `<b>${esc(p)}</b>, vecka ${Math.floor(d / 7) + 1} ${DAGAR[d % 7]}: ${DELAR[x.dygnsdel].toLowerCase()} <span class="mono">${x.start}–${x.slut}</span>, rast ${x.rast} min, arbetstid ${timmar(x.netto)}.${(x.aktiviteter || []).map(a => ` ★ ${esc(a.namn || a.id)} ${a.start}–${a.slut}.`).join("")}${GRAF.obPassText(p, +d, st.korning.resultat, st.korning.indata).replace("\n", " ")}`;
}

// ------------------------------------------------------------------ export
function tabellRader() {
  const res = st.korning.resultat, N = res.veckor * 7;
  const rader = [["Person", ...Array.from({ length: N }, (_, d) => `V${Math.floor(d / 7) + 1} ${DAGAR[d % 7]}`)]];
  for (const [p, rad] of Object.entries(res.schema)) rader.push([p, ...rad.map(x => x ? `${{ morgon: "D", kvall: "K", natt: "N" }[x.dygnsdel]} ${x.start}-${x.slut}` : "")]);
  for (const del of ["morgon", "kvall", "natt"]) rader.push([`I tjänst ${DELAR[del].toLowerCase()}`, ...Array.from({ length: N }, (_, d) => Object.values(res.schema).filter(r => r[d] && r[d].dygnsdel === del).length)]);
  return rader;
}

async function kopieraTabell() {
  const text = tabellRader().map(r => r.join("\t")).join("\n");
  try { await navigator.clipboard.writeText(text); meddela("Tabellen är kopierad. Klistra in i Excel eller Numbers."); }
  catch { meddela("Kopieringen tilläts inte här."); }
}

function laddaXlsx() {
  if (window.XLSX) return Promise.resolve();
  return new Promise((ja, nej) => {
    const s = document.createElement("script");
    s.src = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
    s.onload = ja; s.onerror = () => nej(new Error("Kunde inte ladda Excel-stödet."));
    document.head.appendChild(s);
  });
}

async function excel() {
  let dl = null;
  try { dl = window.claude && await window.claude.use("downloads"); } catch { dl = null; }
  if (!dl) { meddela("Nedladdning går inte här. Använd Kopiera tabell."); return; }
  try {
    await laddaXlsx();
    const res = st.korning.resultat, wb = XLSX.utils.book_new();
    const s1 = XLSX.utils.aoa_to_sheet(tabellRader()); s1["!cols"] = [{ wch: 14 }, ...Array(res.veckor * 7).fill({ wch: 13 })];
    XLSX.utils.book_append_sheet(wb, s1, "Schema");
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([["Person", "Pass", "Arbetstid (h)", "Mål (h)", "Kvällspass", "Helger"],
      ...Object.entries(res.personer).map(([p, x]) => [p, x.pass, +(x.minuter / 60).toFixed(2), +(x.mal_minuter / 60).toFixed(2), x.kvallspass, x.helggrupp || UNDANTAG[x.helgfrekvens] || ""])]), "Per person");
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([["Vecka", "Dag", "Dygnsdel", "Antal"], ...res.vakanser.map(x => [x.vecka, x.veckodag, DELAR[x.dygnsdel], x.antal])]), "Vakanser");
    const g = st.korning.granskning;
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([["Typ", "Regel", "Nivå", "Person", "Beskrivning"],
      ...(res.brott || []).concat(g.brott).map(b => ["Brott", b.regel, b.niva, b.person || "", b.text]),
      ...g.varningar.map(b => ["Att notera", b.regel, b.niva, b.person || "", b.text])]), "Granskning");
    const data = XLSX.write(wb, { type: "array", bookType: "xlsx" });
    const namn = (st.enhet.namn || "schema").replace(/[^\wåäöÅÄÖ -]/g, "").trim() || "schema";
    await dl.save({ filename: `${namn} – ${st.korning.namn}.xlsx`, data: new Uint8Array(data) });
  } catch (e) {
    if (e && e.code === "declined") return;
    meddela(e && e.message ? e.message : "Nedladdningen misslyckades.");
  }
}

// ------------------------------------------------------------------ schemaassistent (via Claude-kontot)
const chatt = { oppen: false, enhet: null, turer: [], visning: [], forslag: null, upptagen: false, text: "", notis: "" };
const FRAGOR = ["Hur många kvällar har var och en?", "Hur ser fredagskvällarna ut?", "Var finns vakanserna?", "Lägg till en person på 75 % som bara jobbar kväll"];
function chattKontext() {
  const k = st.korningar.find(x => x.status === "OK") || st.korningar[0];
  const d = k ? JSON.parse(k.data) : null;
  return { indata: st.enhet.indata, resultat: d ? d.resultat : null, granskning: d ? d.granskning : null, onForslag: f => { chatt.forslag = { ...f, korning: k }; } };
}
function ritaChatt() {
  $("#chatt-knapp").hidden = !st.enhet || chatt.oppen;
  $("#chatt").hidden = !chatt.oppen;
  if (!chatt.oppen) return;
  $("#chatt-enhet").textContent = st.enhet ? st.enhet.namn : "";
  let h = chatt.visning.length ? "" : `<p class="dampad liten">Jag svarar på frågor om personal, behov och det senaste schemat, och föreslår ändringar som du godkänner.</p><div class="chips">${FRAGOR.map(f => `<button class="liten" data-g="chatt-fraga">${esc(f)}</button>`).join("")}</div>`;
  for (const m of chatt.visning) h += m.roll === "verktyg" ? `<div class="chatt-verktyg">${esc(m.text)}</div>` : `<div class="bubbla${m.roll === "du" ? " du" : m.roll === "fel" ? " fel" : ""}">${esc(m.text)}</div>`;
  if (chatt.upptagen && chatt.text) h += `<div class="bubbla">${esc(chatt.text)}</div>`;
  if (chatt.forslag) h += `<div class="forslagskort"><b>${esc(chatt.forslag.sammanfattning)}</b><ul class="punkter liten">${chatt.forslag.texter.map(x => `<li>${esc(x)}</li>`).join("")}</ul><div class="chips"><button class="primar liten" data-g="chatt-godkann">Godkänn</button><button class="liten" data-g="chatt-avvisa">Avvisa</button></div></div>`;
  if (chatt.upptagen) h += `<div class="chatt-verktyg">${esc(chatt.status || "Tänker …")}</div>`;
  const l = $("#chatt-logg"); l.innerHTML = h; l.scrollTop = l.scrollHeight;
  $("#chatt-skicka").disabled = chatt.upptagen;
}
async function skickaChatt(text) {
  if (!st.enhet || chatt.upptagen || !text.trim()) return;
  let sample = null;
  try { sample = window.claude && await window.claude.use("sample"); } catch { sample = null; }
  if (!sample) { chatt.visning.push({ roll: "fel", text: "Assistenten fungerar bara när sidan är öppen i Claude." }); return ritaChatt(); }
  if (chatt.enhet !== st.enhet.id) { chatt.enhet = st.enhet.id; chatt.turer = []; chatt.visning = []; chatt.forslag = null; }
  chatt.visning.push({ roll: "du", text: text.trim() });
  chatt.turer.push({ role: "user", content: (chatt.notis ? chatt.notis + "\n\n" : "") + text.trim() }); chatt.notis = "";
  chatt.upptagen = true; chatt.text = ""; chatt.status = "Tänker …"; ritaChatt();
  const ctx = chattKontext();
  const tools = ASSISTENT.verktyg.map(v => ({ name: v.name, description: v.description, inputSchema: v.schema,
    execute: inp => { chatt.status = { las_enhet: "Läser personal och behov …", las_schema: "Läser schemat …", las_dagar: "Tittar på dagarna …", las_person: "Tittar på personen …", foresla_andringar: "Förbereder ett förslag …" }[v.name]; ritaChatt(); return v.kor(ctx, inp || {}); } }));
  const forsta = { role: "user", content: ASSISTENT.SYSTEM + "\n\nAnvändaren arbetar med enheten " + JSON.stringify(st.enhet.namn) + ". Första frågan:\n\n" + chatt.turer[0].content };
  try {
    const { text: svar } = await sample([forsta, ...chatt.turer.slice(1)], { tools, cache: false, onText: ({ text: t }) => { chatt.text = t; ritaChatt(); } });
    chatt.turer.push({ role: "assistant", content: svar || "(inget svar)" });
    chatt.visning.push({ roll: "assistent", text: svar });
  } catch (e) {
    chatt.turer.pop();
    chatt.visning.push({ roll: "fel", text: e.code === "not_granted" ? "Assistenten fick inte tillåtelse att fråga Claude." : e.code === "rate_limited" ? "För många frågor just nu. Vänta en stund." : "Det gick inte att fråga Claude just nu." });
  }
  chatt.upptagen = false; chatt.text = ""; ritaChatt();
}
$("#chatt-knapp").onclick = () => { chatt.oppen = true; ritaChatt(); $("#chatt-text").focus(); };
$("#chatt-stang").onclick = () => { chatt.oppen = false; ritaChatt(); };
$("#chatt-form").onsubmit = e => { e.preventDefault(); const t = $("#chatt-text").value; $("#chatt-text").value = ""; skickaChatt(t); };
$("#chatt-text").onkeydown = e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("#chatt-form").requestSubmit(); } };
document.addEventListener("click", async e => {
  const el = e.target.closest("[data-g^=chatt-]"); if (!el) return;
  if (el.dataset.g === "chatt-fraga") skickaChatt(el.textContent);
  if (el.dataset.g === "chatt-avvisa") { chatt.notis = "[Användaren avvisade förslaget.]"; chatt.visning.push({ roll: "verktyg", text: "Förslaget avvisades." }); chatt.forslag = null; ritaChatt(); }
  if (el.dataset.g === "chatt-godkann") {
    const f = chatt.forslag;
    try {
      if (f.pass) {
        // passen blir exakt så som användaren sa, som en ny körning; originalet finns kvar
        const d = JSON.parse(f.korning.data), schema = ASSISTENT.tillampaSchema(d.resultat.schema, f.andringar, d.resultat.veckor);
        const res = raknaOm(d.indata, schema, d.resultat), g = GRANSKNING.kontrollera(d.indata, res);
        const k = { id: nyttId(), enhet: st.enhet.id, namn: "Ändrad av 🤖", skapad: Date.now(), status: g.brott.length ? "BROTT" : "OK", vakanta: res.kpi.vakanta_pass,
          data: JSON.stringify({ resultat: res, granskning: g, balans: d.balans, indata: d.indata }) };
        st.korningar.unshift(k); await lager.sparaKorning(k);
        chatt.visning.push({ roll: "verktyg", text: `Godkänt. Schemat är ändrat precis så och sparat som en ny körning.${g.brott.length ? ` Granskningen hittar ${g.brott.length} brott mot hårda regler – se Regelkontroll.` : " Alla hårda regler följs."}` });
        chatt.notis = `[Användaren godkände passändringen. Den är sparad med ${g.brott.length} brott mot hårda regler.]`; chatt.forslag = null;
        st.rflik = "schema"; visaKorning(k);
      } else {
        ASSISTENT.tillampa(st.enhet.indata, f.andringar);
        chatt.visning.push({ roll: "verktyg", text: "Godkänt och sparat. Schemat läggs om nu …" });
        chatt.notis = "[Användaren godkände förslaget. Det är sparat och schemat läggs om.]"; chatt.forslag = null;
        clearTimeout(sparaTimer); await lager.sparaEnhet(st.enhet);
        await oppna(st.enhet); laggSchema();
      }
    } catch (err) { chatt.visning.push({ roll: "fel", text: "Kunde inte tillämpa: " + err.message }); }
    ritaChatt();
  }

});
setInterval(() => { if (!chatt.oppen) $("#chatt-knapp").hidden = !st.enhet; }, 800);

// ------------------------------------------------------------------ start
(async () => { await lager.init(); visaLista(); })();
</script>
