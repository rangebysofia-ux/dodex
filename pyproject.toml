[project]
name = "schemasystem"
version = "0.1.0"
description = "Cykliska grundscheman för dygnet runt-verksamhet inom vård och omsorg (Kommunal, HÖK/AB)"
requires-python = ">=3.10"
dependencies = ["ortools>=9.10"]

[project.scripts]
schema-build = "schemamotor.build:main"
schema-validate = "schemamotor.validate:main"
schema-explain = "schemamotor.explain:main"
schema-compare = "schemamotor.compare:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["schemamotor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
