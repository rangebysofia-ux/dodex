[project]
name = "schemasystem"
version = "0.2.0"
description = "Cykliska grundscheman för dygnet runt-verksamhet inom vård och omsorg (Kommunal, HÖK/AB)"
requires-python = ">=3.10"
dependencies = [
    "ortools>=9.10",
    "pydantic>=2.6",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "openpyxl>=3.1",
    "reportlab>=4.0",
    "anthropic>=2.0",
]

[project.scripts]
schema-build = "schemamotor.build:main"
schema-validate = "schemamotor.validate:main"
schema-explain = "schemamotor.explain:main"
schema-compare = "schemamotor.compare:main"
schema-balans = "schemamotor.balans:main"
schema-export = "schemamotor.export:main"

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["schemamotor", "schemawebb"]

[tool.setuptools.package-data]
schemawebb = ["statisk/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
